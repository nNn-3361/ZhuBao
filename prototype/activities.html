<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FCFAF6">
<script src="zhubao-family.js"></script>
<script src="zhubao-app.js"></script>
<title>竹寶・親子活動</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;600&amp;display=swap">
<style>
body{margin:0;background:#F6F2EA}
a{color:#2E5E4E}a:hover{color:#1F4337}
button:focus-visible,a:focus-visible{outline:2px solid #2E5E4E;outline-offset:2px}
.zb-nav-toggle{display:none}
@media (max-width: 760px){.zb-nav-links{display:none !important}.zb-nav-toggle{display:inline-flex !important}}
@media (min-width: 761px){.zb-nav-menu{display:none !important}}
/*zb-ui-start*/
.zb-bam-row{display:flex;gap:8px;align-items:stretch}
.zb-bam-row>button{flex:1;min-width:0}
.zb-bam{position:relative;width:40px;flex-shrink:0;display:flex;flex-direction:column;align-items:center;cursor:pointer}
.zb-culm{width:12px;flex-shrink:0;background:linear-gradient(90deg,#4F8065 0%,#80AE8F 45%,#5E8F73 100%)}
.zb-culm-a{height:26px}
.zb-culm-b{flex:1 1 auto;min-height:12px}
.zb-node{width:20px;height:7px;border-radius:4px;background:#3F6F57;flex-shrink:0;position:relative;z-index:1;transition:transform .25s cubic-bezier(.23,1,.32,1)}
.zb-bam-top .zb-culm-a{border-radius:6px 6px 0 0;height:20px;margin-top:6px}
.zb-bam-bottom .zb-culm-b{border-radius:0 0 3px 3px}
.zb-leaf{position:absolute;top:23px;width:26px;height:12px;fill:#6F9A82;pointer-events:none}
.zb-leaf-r{left:24px;transform-origin:left center;transform:rotate(-30deg)}
.zb-leaf-l{right:24px;transform-origin:right center;transform:rotate(30deg);display:none}
.zb-alt .zb-leaf-r{display:none}.zb-alt .zb-leaf-l{display:block}
.zb-bam-future .zb-culm,.zb-bam-future .zb-node{opacity:.28}
.zb-bam-future .zb-leaf{opacity:.25}
.zb-bam-now .zb-culm-a{opacity:.28}
.zb-bam-now .zb-node{background:#2E5E4E;animation:zbGlow 2.4s ease-in-out infinite}
.zb-bam-now .zb-leaf{fill:#8FC16F}
.zb-bam-now .zb-leaf-l,.zb-bam-now .zb-leaf-r{display:block}
.zb-bam-now .zb-leaf-r{animation:zbIdleR 3.2s ease-in-out infinite}
.zb-bam-now .zb-leaf-l{animation:zbIdleL 3.2s ease-in-out infinite}
.zb-bam-row[data-on="true"] .zb-leaf-r{animation:zbSwayR .8s ease-in-out 2}
.zb-bam-row[data-on="true"] .zb-leaf-l{animation:zbSwayL .8s ease-in-out 2}
@keyframes zbGlow{0%,100%{box-shadow:0 0 0 3px rgba(143,193,111,.35),0 0 8px rgba(46,94,78,.35)}50%{box-shadow:0 0 0 6px rgba(143,193,111,.25),0 0 18px rgba(46,94,78,.6)}}
@keyframes zbIdleR{0%,100%{transform:rotate(-30deg)}50%{transform:rotate(-20deg)}}
@keyframes zbIdleL{0%,100%{transform:rotate(30deg)}50%{transform:rotate(20deg)}}
@keyframes zbSwayR{0%,100%{transform:rotate(-30deg)}30%{transform:rotate(0deg)}65%{transform:rotate(-44deg)}}
@keyframes zbSwayL{0%,100%{transform:rotate(30deg)}30%{transform:rotate(0deg)}65%{transform:rotate(44deg)}}
@keyframes zbWiggle{0%,100%{transform:rotate(0)}25%{transform:rotate(-10deg)}60%{transform:rotate(8deg)}}
*{-webkit-tap-highlight-color:transparent}
button,a[style*="min-height"]{transition:transform .2s cubic-bezier(.23,1,.32,1),box-shadow .2s ease,background-color .2s ease,border-color .2s ease,color .2s ease}
button:active,a[style*="min-height"]:active{transform:scale(.97);box-shadow:none;transition-duration:.1s}
.zb-bam-row button:active{transform:none}
@media (hover:hover){
button:not([aria-expanded]):not([role="switch"]):not([role="checkbox"]):hover,a[style*="min-height"]:hover{transform:translateY(-2px);box-shadow:0 6px 14px rgba(46,94,78,.18)}
button[aria-expanded]:hover .zb-chev{stroke:#2E5E4E}
button[role="switch"]:hover,button[role="checkbox"]:hover{color:#2E5E4E !important}
.zb-nav-links a:not([aria-current]):hover{background:#E4EEE7 !important;color:#2E5E4E !important}
.zb-bam-row button:hover{transform:none;box-shadow:none}
.zb-bam-row:hover button[aria-pressed="false"]{background:#F1EDE4 !important}
.zb-bam-row:hover .zb-leaf-r{animation:zbSwayR .8s ease-in-out infinite}
.zb-bam-row:hover .zb-leaf-l{animation:zbSwayL .8s ease-in-out infinite}
.zb-bam-row:hover .zb-node{transform:scaleX(1.18)}
header svg:first-child:hover{animation:zbWiggle .6s ease-in-out}
}
@media (prefers-reduced-motion:reduce){
#dc-root *,x-dc *{animation:none !important;transition:none !important}
button:hover,button:active,a:hover,a:active{transform:none !important}
}
/*zb-ui-end*/
/*zb-col-start*/
.zb-col{max-width:768px !important;margin-left:auto !important;margin-right:auto !important}
@media (max-width:760px){.zb-col{padding:20px 16px 36px !important}}
.zb-bam-panel{display:flex;gap:8px;align-items:stretch}
.zb-bam-spine{cursor:default}
.zb-bam-spine .zb-culm-b{min-height:24px}
.zb-bam-body{flex:1;min-width:0;display:flex;flex-direction:column;gap:10px;padding:4px 0 16px}
.zb-acc{background:#FCFAF6;border:1px solid #E4DED2;border-radius:16px;overflow:hidden;transition:border-color .2s ease,box-shadow .2s ease}
.zb-acc[data-open="true"]{border-color:#B9CDBF;box-shadow:0 4px 14px rgba(46,94,78,.08)}
.zb-acc-head{width:100%;min-height:60px;display:flex;align-items:center;gap:12px;padding:12px 16px;background:transparent;border:0;font-family:inherit;color:#1F2A24;text-align:left;cursor:pointer}
.zb-acc-title{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.zb-acc-body{padding:0 16px 16px;display:flex;flex-direction:column;gap:12px}
.zb-chev{flex-shrink:0;transition:transform .32s cubic-bezier(.2,.8,.2,1)}
[aria-expanded="true"]>.zb-chev{transform:rotate(180deg)}
.zb-sec{display:flex;flex-direction:column;gap:12px}
.zb-sec-head{display:flex;flex-direction:column;gap:4px}
.zb-sec-head h2{margin:0;font-size:20px;font-weight:600}
.zb-sec-head p{margin:0;font-size:14px;color:#5F6B64;line-height:1.6}
.zb-list{display:flex;flex-direction:column;gap:10px}
@media (max-width:480px){.zb-acc-head{padding:12px 14px;gap:10px}.zb-acc-body{padding:0 14px 14px}}
.zb-list .zb-acc-body{border-top:1px solid #EFEAE0;padding-top:14px}
.zb-list ul.zb-acc-body>li:first-child{border-top:0 !important}
/*zb-col-end*/
</style>
<style>#dc-root>div{margin-left:auto;margin-right:auto}</style>
</head>
<body>
<template id="dc-tpl">
<div style="width: 100%; min-height: 1180px; box-sizing: border-box; background: #F6F2EA; font-family: 'Noto Sans TC', system-ui, sans-serif; color: #1F2A24">

<header style="border-bottom: 1px solid #E4DED2; background: #FCFAF6">
<div style="max-width: 1360px; margin: 0 auto; padding: 14px 24px; box-sizing: border-box; display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap">
<div style="display: flex; align-items: center; gap: 10px">
<svg width="26" height="26" viewBox="0 0 28 28" aria-hidden="true"><circle cx="14" cy="14" r="13" fill="#2E5E4E"></circle><path d="M14 20V9M14 13c0-2.5 2-4 4.5-4M14 15.5c0-2.2-1.8-3.5-4-3.5" stroke="#F6F2EA" stroke-width="1.8" fill="none" stroke-linecap="round"></path></svg>
<span style="font-size: 17px; font-weight: 600; letter-spacing: 0.04em">竹寶</span>
</div>
<nav class="zb-nav-links" aria-label="主選單" style="display: flex; gap: 4px; flex-wrap: wrap">
<a href="index.html" style="min-height: 44px; display: flex; align-items: center; padding: 0 14px; border-radius: 12px; text-decoration: none; color: #5F6B64; font-size: 14px">主頁</a>
<a href="benefits.html" style="min-height: 44px; display: flex; align-items: center; padding: 0 14px; border-radius: 12px; text-decoration: none; color: #5F6B64; font-size: 14px">補助及其他福利</a>
<a href="childcare.html" style="min-height: 44px; display: flex; align-items: center; padding: 0 14px; border-radius: 12px; text-decoration: none; color: #5F6B64; font-size: 14px">托育</a>
<a href="#" aria-current="page" style="min-height: 44px; display: flex; align-items: center; padding: 0 14px; border-radius: 12px; text-decoration: none; background: #E4EEE7; color: #2E5E4E; font-weight: 600; font-size: 14px">親子活動</a>
<a href="ask.html" style="min-height: 44px; display: flex; align-items: center; padding: 0 14px; border-radius: 12px; text-decoration: none; color: #5F6B64; font-size: 14px">問竹寶</a>
<a href="help.html" style="min-height: 44px; display: flex; align-items: center; padding: 0 14px; border-radius: 12px; text-decoration: none; color: #5F6B64; font-size: 14px">協助</a>
</nav>
<button type="button" class="zb-nav-toggle" aria-expanded="{{menuExpanded}}" aria-controls="zb-menu" onClick="{{toggleMenu}}" style="min-height: 44px; align-items: center; gap: 8px; padding: 0 14px; border-radius: 12px; border: 1px solid #E4DED2; background: #FCFAF6; font-family: inherit; font-size: 14px; color: #1F2A24; cursor: pointer"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="{{menuIcon}}"></path></svg>{{menuLabel}}</button>
</div>
<sc-if value="{{menuOpen}}" hint-placeholder-val="{{false}}">
<nav id="zb-menu" class="zb-nav-menu" aria-label="主選單" style="border-top: 1px solid #E4DED2; background: #FCFAF6; padding: 8px 16px 16px; display: flex; flex-direction: column">
<a href="index.html" style="min-height: 52px; display: flex; align-items: center; padding: 0 14px; border-radius: 12px; text-decoration: none; color: #1F2A24; font-size: 16px; border-bottom: 1px solid #EFEAE0">主頁</a>
<a href="benefits.html" style="min-height: 52px; display: flex; align-items: center; padding: 0 14px; border-radius: 12px; text-decoration: none; color: #1F2A24; font-size: 16px; border-bottom: 1px solid #EFEAE0">補助及其他福利</a>
<a href="childcare.html" style="min-height: 52px; display: flex; align-items: center; padding: 0 14px; border-radius: 12px; text-decoration: none; color: #1F2A24; font-size: 16px; border-bottom: 1px solid #EFEAE0">托育</a>
<a href="#" aria-current="page" style="min-height: 52px; display: flex; align-items: center; justify-content: space-between; padding: 0 14px; border-radius: 12px; text-decoration: none; background: #E4EEE7; color: #2E5E4E; font-weight: 600; font-size: 16px">親子活動<span style="font-size: 12px; font-weight: 400">目前位置</span></a>
<a href="ask.html" style="min-height: 52px; display: flex; align-items: center; padding: 0 14px; border-radius: 12px; text-decoration: none; color: #1F2A24; font-size: 16px; border-bottom: 1px solid #EFEAE0">問竹寶</a>
<a href="help.html" style="min-height: 52px; display: flex; align-items: center; padding: 0 14px; border-radius: 12px; text-decoration: none; color: #1F2A24; font-size: 16px; border-bottom: 1px solid #EFEAE0">協助</a>
</nav>
</sc-if>
</header>

<div class="zb-col" style="max-width: 1360px; margin: 0 auto; padding: 24px 24px 40px; box-sizing: border-box; display: flex; flex-direction: column; gap: 20px">

<div style="display: flex; flex-direction: column; gap: 6px">
<h1 style="margin: 0; font-size: 26px; font-weight: 600; line-height: 1.3">親子活動</h1>
<p style="margin: 0; font-size: 14px; line-height: 1.6; color: #5F6B64">全台各縣市對孕婦、兒童有優惠的場館，加上新竹市親子館近期活動。優惠內容整理自各館官方票價頁，購票時通常要帶證明文件，實際以官方頁面為準。</p>
</div>

<div style="display: flex; gap: 12px; align-items: flex-start; background: #E4EEE7; border-radius: 16px; padding: 14px 16px">
<div style="font-size: 14px; line-height: 1.6; color: #1F2A24">親子館、到宅坐月子等長期服務，放在<a href="benefits.html" style="color: #2E5E4E; font-weight: 600">補助及其他福利</a>頁。</div>
</div>

<section aria-label="篩選" class="zb-acc" data-open="{{filterExpanded}}">
<button type="button" class="zb-acc-head" aria-expanded="{{filterExpanded}}" onClick="{{toggleFilter}}">
<span class="zb-acc-title">
<span style="font-size: 16px; font-weight: 600">篩選條件</span>
<span style="font-size: 13px; color: #5F6B64">{{filterSummary}}</span>
</span>
<svg class="zb-chev" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#5F6B64" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"></path></svg>
</button>
<sc-if value="{{filterOpen}}" hint-placeholder-val="{{false}}">
<div class="zb-acc-body" style="gap: 18px; border-top: 1px solid #E4DED2; padding-top: 16px">
<div style="display: flex; flex-direction: column; gap: 8px">
<label for="zb-city" style="font-size: 14px; font-weight: 600">縣市</label>
<div style="position: relative">
<select id="zb-city" class="zb-city" onChange="{{pickCity}}" style="{{cityStyle}}"><option value="全部">全部縣市</option><optgroup label="北部"><option value="基隆市">基隆市</option><option value="臺北市">臺北市</option><option value="新北市">新北市</option><option value="桃園市">桃園市</option><option value="新竹市">新竹市</option><option value="新竹縣">新竹縣</option><option value="宜蘭縣">宜蘭縣</option></optgroup><optgroup label="中部"><option value="苗栗縣">苗栗縣</option><option value="臺中市">臺中市</option><option value="彰化縣">彰化縣</option><option value="南投縣">南投縣</option><option value="雲林縣">雲林縣</option></optgroup><optgroup label="南部"><option value="嘉義縣">嘉義縣</option><option value="嘉義市">嘉義市</option><option value="臺南市">臺南市</option><option value="高雄市">高雄市</option><option value="屏東縣">屏東縣</option></optgroup><optgroup label="東部"><option value="花蓮縣">花蓮縣</option><option value="臺東縣">臺東縣</option></optgroup><optgroup label="離島"><option value="澎湖縣">澎湖縣</option><option value="金門縣">金門縣</option><option value="連江縣">連江縣</option></optgroup></select>
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#5F6B64" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="position: absolute; right: 14px; top: 50%; margin-top: -9px; pointer-events: none"><path d="m6 9 6 6 6-6"></path></svg>
</div>
</div>
<sc-for list="{{filters}}" as="f" hint-placeholder-count="4">
<fieldset style="border: 0; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px">
<legend style="font-size: 14px; font-weight: 600; padding: 0; margin-bottom: 8px">{{f.label}}</legend>
<div style="display: flex; flex-wrap: wrap; gap: 8px">
<sc-for list="{{f.options}}" as="o" hint-placeholder-count="4">
<button type="button" aria-pressed="{{o.pressed}}" onClick="{{o.pick}}" style="{{o.style}}">{{o.label}}</button>
</sc-for>
</div>
</fieldset>
</sc-for>
<button type="button" onClick="{{reset}}" style="min-height: 44px; border-radius: 12px; border: 1px solid #E4DED2; background: transparent; font-family: inherit; font-size: 14px; color: #5F6B64; cursor: pointer">清除篩選</button>
</div>
</sc-if>
</section>

<section aria-label="結果" style="min-width: 0; display: flex; flex-direction: column; gap: 12px">
<div style="display: flex; justify-content: space-between; align-items: baseline; gap: 8px; flex-wrap: wrap">
<h2 style="margin: 0; font-size: 16px; font-weight: 600">{{resultText}}</h2>
</div>

<sc-if value="{{noResult}}" hint-placeholder-val="{{false}}">
<div style="background: #FCFAF6; border: 1px solid #E4DED2; border-radius: 16px; padding: 24px; font-size: 14px; line-height: 1.7; color: #5F6B64">{{emptyText}}</div>
</sc-if>

<div class="zb-list">
<sc-for list="{{results}}" as="r" hint-placeholder-count="4">
<article class="zb-acc" data-k="{{r.name}}" data-item="{{r.itemId}}" data-open="{{r.expanded}}" style="{{r.accStyle}}">
<button type="button" class="zb-acc-head" aria-expanded="{{r.expanded}}" onClick="{{r.toggle}}">
<div style="{{r.dateBox}}"><span style="font-size: 17px; font-weight: 600; line-height: 1.1">{{r.dateBig}}</span><span style="font-size: 11px">{{r.dateSmall}}</span></div>
<span class="zb-acc-title" style="gap: 6px">
<span style="display: flex; gap: 6px; flex-wrap: wrap">
<span style="{{r.areaStyle}}">{{r.chipText}}</span>
<span style="{{r.dealStyle}}">{{r.dealTag}}</span>
<sc-if value="{{r.followTag}}" hint-placeholder-val="{{false}}"><span style="display: inline-flex; align-items: center; font-size: 12px; padding: 3px 10px; border-radius: 999px; background: #EFEAE0; color: #1F2A24; font-weight: 600">{{r.followTag}}</span></sc-if>
</span>
<span style="font-size: 16px; font-weight: 600; line-height: 1.4">{{r.name}}</span>
<span style="font-size: 13px; line-height: 1.5; color: #5F6B64; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden">{{r.price}}</span>
</span>
<svg class="zb-chev" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#5F6B64" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"></path></svg>
</button>
<sc-if value="{{r.open}}" hint-placeholder-val="{{false}}">
<div class="zb-acc-body">
<dl style="margin: 0; display: grid; grid-template-columns: 64px minmax(0, 1fr); row-gap: 6px; font-size: 15px; line-height: 1.6">
<dt style="color: #5F6B64">{{r.whenLabel}}</dt><dd style="margin: 0">{{r.when}}</dd>
<dt style="color: #5F6B64">地點</dt><dd style="margin: 0">{{r.where}}</dd>
<dt style="color: #5F6B64">適合年齡</dt><dd style="margin: 0">{{r.who}}</dd>
<dt style="color: #5F6B64">主辦單位</dt><dd style="margin: 0">{{r.host}}</dd>
<dt style="color: #5F6B64">優惠</dt><dd style="margin: 0">{{r.dealText}}</dd>
</dl>
<sc-if value="{{r.hasNote}}" hint-placeholder-val="{{true}}">
<p style="margin: 0; font-size: 15px; line-height: 1.7">{{r.note}}</p>
</sc-if>
<sc-if value="{{r.canFollow}}" hint-placeholder-val="{{false}}">
<div style="display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px">
<button type="button" class="zb-follow" aria-pressed="{{r.followOn}}" onClick="{{r.toggleFollow}}">{{r.followText}}</button>
<span class="zb-follow-note" style="flex: 1 1 220px">{{r.followNote}}</span>
</div>
</sc-if>
<a href="{{r.ctaUrl}}" style="align-self: flex-start; min-height: 44px; display: inline-flex; align-items: center; padding: 0 16px; border-radius: 12px; background: #2E5E4E; color: #FFFFFF; font-size: 14px; font-weight: 600; text-decoration: none">{{r.cta}}</a>
</div>
</sc-if>
</article>
</sc-for>
</div>

</section>


</div>
</div>
</template>
<div id="dc-root"></div>
<script src="zhubao-ai.js"></script>
<script src="zhubao-runtime.js"></script>
<script>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { menuOpen: false, city: '全部', deal: '全部', kind: '全部' };
    /* 從行事曆或通知跳過來：#a-活動編號，展開那張活動卡片並對準 */
    const jump = /^#a-(\d+)$/.exec(location.hash);
    if (jump) {
      this.state.jumpId = jump[1];
      setTimeout(() => {
        const el = document.querySelector('[data-item="' + jump[1] + '"]');
        if (!el) return;
        window.scrollTo({ top: el.getBoundingClientRect().top + window.scrollY - 76 });
        el.classList.add('zb-flash');
        setTimeout(() => el.classList.remove('zb-flash'), 2400);
      }, 120);
    }
  }
  renderVals() {
    const s = this.state;
    const WPCC = 'https://wpcc.hccg.gov.tw/';
    const HC = '新竹市政府（新竹市托育資源中心親子館）';
    const ev = (o) => Object.assign({ city: '新竹市', kind: '期間活動', deal: ['免費'], dealText: '免費參加，需線上預約', host: HC }, o);
    /* 期間活動：2026/11/21 從新竹市托育資源中心親子館活動報名頁整理 */

    const evDate = (d) => { const m = /(\d{4})\/(\d{1,2})\/(\d{1,2})[^\d]*(\d{1,2}:\d{2})?/.exec(d.when || ''); return m ? { date: m[1] + '-' + m[2].padStart(2, '0') + '-' + m[3].padStart(2, '0'), time: m[4] || '' } : null; };
    if (s.jumpId) { const j = ALL.find((d) => d.kind === '期間活動' && evId(d) === s.jumpId); if (j) { s.card = j.name; s.city = '全部'; s.deal = '全部'; s.kind = '全部'; } s.jumpId = null; return this.renderVals(); }
    /* 關注活動：選這個活動是幫哪個孩子（或全家）關注，行事曆上用那個顏色 */
    const followOf = (d) => {
      const id = evId(d), when = evDate(d);
      if (d.kind !== '期間活動' || !id || !when || F.parse(when.date) < F.today()) return { canFollow: false, followTag: '' };
      const f = F.activityFollow(id);
      const done = (msg) => { if (window.ZB) { window.ZB.toast(msg); window.ZB.buzz && window.ZB.buzz(); window.ZB.refresh && window.ZB.refresh(); } this.setState({}); };
      return {
        canFollow: true, followOn: f ? 'true' : 'false', followText: f ? '已關注' : '關注',
        followTag: f ? '已關注・' + F.kidName(f.kid) : '',
        followNote: f ? '已加到行事曆（' + F.kidName(f.kid) + '）。前 7 天和前 1 天提醒你。' : '關注後會加到主頁行事曆，前 7 天和前 1 天提醒你。',
        toggleFollow: () => {
          if (f) { F.unfollow('a', id); done('已取消關注'); return; }
          const opts = F.kids().concat([{ id: '', name: '全家' }]);
          const esc = (x) => String(x).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
          window.ZB.sheet('zb-follow-kid', '幫誰關注這個活動？', '<p class="zb-follow-note" style="margin:0">' + esc(d.name) + '・' + esc(d.when) + '</p><div class="zb-pick">'
            + opts.map((k) => '<button type="button" data-k="' + k.id + '" aria-pressed="false"><i class="zb-kdot" style="background:' + F.kidHex(k.id) + '"></i>' + esc(k.name) + '</button>').join('') + '</div>', (el) => {
            el.querySelectorAll('[data-k]').forEach((b) => b.addEventListener('click', () => {
              F.follow({ t: 'a', id, kid: b.getAttribute('data-k'), name: d.name, date: when.date, time: when.time, place: d.place || '' });
              window.ZB.closeSheet(); done('已加到行事曆');
            }));
          });
        }
      };
    };
    const results = filtered.map((d) => {
      const isEvent = d.kind === '期間活動';
      return {
        itemId: evId(d), ...followOf(d),
        name: d.name, area: d.city, host: d.host,
        areaStyle: isEvent ? cityChip : 'display: none',
        dealTag: dealLabel(d), dealStyle: hasDeal(d) ? dealChip : plainChip,
        chipText: isEvent ? d.city + "・" + d.place : "常設場館",
        accStyle: hasDeal(d) ? 'border-left: 4px solid #2E5E4E' : '',
        dateBox: 'width: 64px; min-height: 60px; flex-shrink: 0; align-self: center; border-radius: 12px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; text-align: center; ' + (isEvent ? 'background: #E4EEE7; color: #2E5E4E' : 'background: #EFEAE0; color: #1F2A24'),
        dateBig: isEvent ? d.dateBig : d.city, dateSmall: isEvent ? d.dateSmall : '常設場館',
        whenLabel: isEvent ? '時間' : '開放',
        when: d.when, where: d.where, who: d.who, note: d.note, hasNote: !!d.note,
        price: hasDeal(d) ? d.dealText : '費用與優惠請見官方頁面',
        dealText: hasDeal(d) ? d.dealText : '官方頁面沒有寫明孕婦或兒童優惠',
        cta: isEvent ? '看活動頁' : '看官方票價與說明', ctaUrl: d.url
      };
    });
    /* 縣市用手機原生的下拉選單：選項不會在畫面上增減、換行或被底部分頁列蓋住，點哪個就是哪個 */
    const filters = [];
    filters.push(mk('deal', '優惠', ['全部', '有優惠', '孕婦優惠', '兒童優惠', '免費參加', '沒有標示優惠']));
    filters.push(mk('kind', '類型', ['全部', '常設場館', '期間活動']));
    return {
      menuOpen: !!s.menuOpen, menuExpanded: s.menuOpen ? 'true' : 'false',
      menuLabel: s.menuOpen ? '關閉' : '選單', menuIcon: s.menuOpen ? 'M6 6l12 12M18 6 6 18' : 'M4 7h16M4 12h16M4 17h16',
      toggleMenu: () => this.setState({ menuOpen: !s.menuOpen }),
      filters,
      toggles: [],
      pickCity: (e) => this.setState({ city: e.target.value, card: null }),
      cityStyle: 'width: 100%; min-height: 48px; padding: 0 44px 0 14px; border-radius: 12px; border: 1px solid ' + (s.city === '全部' ? '#E4DED2' : '#2E5E4E') + '; background: ' + (s.city === '全部' ? '#FCFAF6' : '#E4EEE7') + '; color: #1F2A24; font-family: inherit; font-size: 16px; -webkit-appearance: none; appearance: none; cursor: pointer',
      reset: () => { this.setState({ city: '全部', deal: '全部', kind: '全部', card: null }); const c = document.getElementById('zb-city'); if (c) c.value = '全部'; },
      results, noResult: results.length === 0, emptyText: '沒有符合條件的場館或活動。可以放寬條件，或清除篩選。',
      resultText: '共 ' + results.length + ' 筆'
    };
  }
}

const __rv = Component.prototype.renderVals;
Component.prototype.renderVals = function () {
  const v = __rv.call(this); const s = this.state;
  const picked = (s.city !== '全部' ? [s.city] : []).concat(v.filters.flatMap((f) => f.options.filter((o) => o.pressed === 'true' && o.label !== '全部').map((o) => o.label)))
    .concat(v.toggles.filter((t) => t.checked === 'true').map((t) => t.label));
  v.filterSummary = picked.length ? '已選：' + picked.join('・') : '目前顯示全部，點開可以篩選';
  v.filterOpen = !!s.filterOpen; v.filterExpanded = s.filterOpen ? 'true' : 'false';
  v.toggleFilter = () => { this.setState({ filterOpen: !s.filterOpen }); const c = document.getElementById('zb-city'); if (c) c.value = this.state.city; };
  v.results = v.results.map((r) => ({ ...r, open: s.card === r.name, expanded: s.card === r.name ? 'true' : 'false', toggle: () => this.setState({ card: s.card === r.name ? null : r.name }) }));
  return v;
};
window.Component = Component;
</script>
</body>
