<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>竹寶・親子活動</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;600&amp;display=swap">
<style>
body{margin:0;background:#F6F2EA}
a{color:#2E5E4E}a:hover{color:#1F4337}
button:focus-visible,a:focus-visible{outline:2px solid #2E5E4E;outline-offset:2px}
.zb-nav-toggle{display:none}
@media (max-width: 760px){.zb-nav-links{display:none !important}.zb-nav-toggle{display:inline-flex !important}}
@media (min-width: 761px){.zb-nav-menu{display:none !important}}
</style>
<style>#dc-root>div{margin-left:auto;margin-right:auto}</style>
</head>
<body>
<template id="dc-tpl">
<div style="width: 100%; min-height: 1180px; box-sizing: border-box; background: #F6F2EA; font-family: 'Noto Sans TC', system-ui, sans-serif; color: #1F2A24">

<header style="border-bottom: 1px solid #E4DED2; background: #FCFAF6">
<div style="max-width: 1360px; margin: 0 auto; padding: 14px 24px; box-sizing: border-box; display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap">
<div style="display: flex; align-items: center; gap: 10px">
<svg width="26" height="26" viewBox="0 0 28 28" aria-hidden="true"><circle cx="14" cy="14" r="13" fill="#2E5E4E"></circle><path d="M14 20V9M14 13c0-2.5 2-4 4.5-4M14 15.5c0-2.2-1.8-3.5-4-3.5" stroke="#F6F2EA" stroke-width="1.8" fill="none" stroke-linecap="round"></path></svg>
<span style="font-size: 17px; font-weight: 600; letter-spacing: 0.04em">竹寶</span>
</div>
<nav class="zb-nav-links" aria-label="主選單" style="display: flex; gap: 4px; flex-wrap: wrap">
<a href="index.html" style="min-height: 44px; display: flex; align-items: center; padding: 0 14px; border-radius: 10px; text-decoration: none; color: #5F6B64; font-size: 14px">主頁</a>
<a href="diary.html" style="min-height: 44px; display: flex; align-items: center; padding: 0 14px; border-radius: 10px; text-decoration: none; color: #5F6B64; font-size: 14px">寶寶日記</a>
<a href="benefits.html" style="min-height: 44px; display: flex; align-items: center; padding: 0 14px; border-radius: 10px; text-decoration: none; color: #5F6B64; font-size: 14px">補助及其他福利</a>
<a href="childcare.html" style="min-height: 44px; display: flex; align-items: center; padding: 0 14px; border-radius: 10px; text-decoration: none; color: #5F6B64; font-size: 14px">托育</a>
<a href="#" aria-current="page" style="min-height: 44px; display: flex; align-items: center; padding: 0 14px; border-radius: 10px; text-decoration: none; background: #E4EEE7; color: #2E5E4E; font-weight: 600; font-size: 14px">親子活動</a>
<a href="ask.html" style="min-height: 44px; display: flex; align-items: center; padding: 0 14px; border-radius: 10px; text-decoration: none; color: #5F6B64; font-size: 14px">AI 問答</a>
<a href="help.html" style="min-height: 44px; display: flex; align-items: center; padding: 0 14px; border-radius: 10px; text-decoration: none; color: #5F6B64; font-size: 14px">協助</a>
</nav>
<button type="button" class="zb-nav-toggle" aria-expanded="{{menuExpanded}}" aria-controls="zb-menu" onClick="{{toggleMenu}}" style="min-height: 44px; align-items: center; gap: 8px; padding: 0 14px; border-radius: 12px; border: 1px solid #E4DED2; background: #FCFAF6; font-family: inherit; font-size: 14px; color: #1F2A24; cursor: pointer"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="{{menuIcon}}"></path></svg>{{menuLabel}}</button>
</div>
<sc-if value="{{menuOpen}}" hint-placeholder-val="{{false}}">
<nav id="zb-menu" class="zb-nav-menu" aria-label="主選單" style="border-top: 1px solid #E4DED2; background: #FCFAF6; padding: 8px 16px 16px; display: flex; flex-direction: column">
<a href="index.html" style="min-height: 52px; display: flex; align-items: center; padding: 0 14px; border-radius: 12px; text-decoration: none; color: #1F2A24; font-size: 16px; border-bottom: 1px solid #EFEAE0">主頁</a>
<a href="diary.html" style="min-height: 52px; display: flex; align-items: center; padding: 0 14px; border-radius: 12px; text-decoration: none; color: #1F2A24; font-size: 16px; border-bottom: 1px solid #EFEAE0">寶寶日記</a>
<a href="benefits.html" style="min-height: 52px; display: flex; align-items: center; padding: 0 14px; border-radius: 12px; text-decoration: none; color: #1F2A24; font-size: 16px; border-bottom: 1px solid #EFEAE0">補助及其他福利</a>
<a href="childcare.html" style="min-height: 52px; display: flex; align-items: center; padding: 0 14px; border-radius: 12px; text-decoration: none; color: #1F2A24; font-size: 16px; border-bottom: 1px solid #EFEAE0">托育</a>
<a href="#" aria-current="page" style="min-height: 52px; display: flex; align-items: center; justify-content: space-between; padding: 0 14px; border-radius: 12px; text-decoration: none; background: #E4EEE7; color: #2E5E4E; font-weight: 600; font-size: 16px">親子活動<span style="font-size: 12px; font-weight: 400">目前位置</span></a>
<a href="ask.html" style="min-height: 52px; display: flex; align-items: center; padding: 0 14px; border-radius: 12px; text-decoration: none; color: #1F2A24; font-size: 16px; border-bottom: 1px solid #EFEAE0">AI 問答</a>
<a href="help.html" style="min-height: 52px; display: flex; align-items: center; padding: 0 14px; border-radius: 12px; text-decoration: none; color: #1F2A24; font-size: 16px; border-bottom: 1px solid #EFEAE0">協助</a>
</nav>
</sc-if>
</header>

<div style="max-width: 1360px; margin: 0 auto; padding: 24px 24px 40px; box-sizing: border-box; display: flex; flex-direction: column; gap: 20px">

<div style="display: flex; flex-direction: column; gap: 6px">
<h1 style="margin: 0; font-size: 26px; font-weight: 600; line-height: 1.3">親子活動</h1>
<p style="margin: 0; font-size: 14px; line-height: 1.6; color: #5F6B64">新竹市的活動有綠色標示並排在前面，過了日期的活動會自動下架。</p>
</div>

<div style="display: flex; gap: 12px; align-items: flex-start; background: #E4EEE7; border-radius: 14px; padding: 14px 16px">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#2E5E4E" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0; margin-top: 2px"><path d="M20 12v9H4v-9M2 7h20v5H2zM12 21V7M12 7H7.5a2.5 2.5 0 1 1 0-5C11 2 12 7 12 7ZM12 7h4.5a2.5 2.5 0 0 0 0-5C13 2 12 7 12 7Z"></path></svg>
<div style="font-size: 14px; line-height: 1.6; color: #1F2A24">親子館、到宅坐月子等長期服務，放在<a href="benefits.html" style="color: #2E5E4E; font-weight: 600">補助及其他福利</a>頁。</div>
</div>

<div style="display: flex; flex-wrap: wrap; gap: 24px; align-items: flex-start">

<section aria-label="篩選" style="flex: 1 1 260px; max-width: 320px; min-width: 0; background: #FCFAF6; border: 1px solid #E4DED2; border-radius: 16px; padding: 18px; display: flex; flex-direction: column; gap: 18px">
<sc-for list="{{filters}}" as="f" hint-placeholder-count="4">
<fieldset style="border: 0; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px">
<legend style="font-size: 14px; font-weight: 600; padding: 0; margin-bottom: 8px">{{f.label}}</legend>
<div style="display: flex; flex-wrap: wrap; gap: 8px">
<sc-for list="{{f.options}}" as="o" hint-placeholder-count="4">
<button type="button" aria-pressed="{{o.pressed}}" onClick="{{o.pick}}" style="{{o.style}}">{{o.label}}</button>
</sc-for>
</div>
</fieldset>
</sc-for>
<fieldset style="border: 0; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 4px">
<legend style="font-size: 14px; font-weight: 600; padding: 0; margin-bottom: 8px">其他條件</legend>
<sc-for list="{{toggles}}" as="t" hint-placeholder-count="1">
<button type="button" role="switch" aria-checked="{{t.checked}}" onClick="{{t.flip}}" style="min-height: 44px; display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 0; background: transparent; border: 0; font-family: inherit; font-size: 14px; color: #1F2A24; cursor: pointer; text-align: left">
<span>{{t.label}}</span>
<span style="{{t.track}}"><span style="{{t.knob}}"></span></span>
</button>
</sc-for>
</fieldset>
<button type="button" onClick="{{reset}}" style="min-height: 44px; border-radius: 12px; border: 1px solid #E4DED2; background: transparent; font-family: inherit; font-size: 14px; color: #5F6B64; cursor: pointer">清除篩選</button>
</section>

<section aria-label="結果" style="flex: 999 1 520px; min-width: 0; display: flex; flex-direction: column; gap: 12px">
<div style="display: flex; justify-content: space-between; align-items: baseline; gap: 8px; flex-wrap: wrap">
<h2 style="margin: 0; font-size: 16px; font-weight: 600">{{resultText}}</h2>
</div>

<sc-if value="{{noResult}}" hint-placeholder-val="{{false}}">
<div style="background: #FCFAF6; border: 1px solid #E4DED2; border-radius: 16px; padding: 24px; font-size: 14px; line-height: 1.7; color: #5F6B64">{{emptyText}}</div>
</sc-if>

<div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 12px">
<sc-for list="{{results}}" as="r" hint-placeholder-count="4">
<article style="{{r.cardStyle}}">
<div style="display: flex; gap: 6px; flex-wrap: wrap">
<span style="{{r.areaStyle}}"><sc-if value="{{r.isCity}}" hint-placeholder-val="{{true}}"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21s-7-6.2-7-11a7 7 0 0 1 14 0c0 4.8-7 11-7 11Z"></path><circle cx="12" cy="10" r="2.5"></circle></svg></sc-if>{{r.area}}</span>
<span style="font-size: 12px; padding: 3px 10px; border-radius: 999px; background: #ECE8E0; color: #3D4842">{{r.kind}}</span>
<sc-if value="{{r.mine}}" hint-placeholder-val="{{false}}"><span style="display: inline-flex; align-items: center; gap: 4px; font-size: 12px; font-weight: 600; padding: 3px 10px; border-radius: 999px; background: #2E5E4E; color: #FFFFFF"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"></path></svg>你可以用</span></sc-if>
</div>
<div style="display: flex; gap: 12px; align-items: center">
<div style="{{r.dateBox}}"><span style="font-size: 17px; font-weight: 600; line-height: 1.1">{{r.dateBig}}</span><span style="font-size: 11px">{{r.dateSmall}}</span></div>
<h3 style="margin: 0; font-size: 16px; font-weight: 600; line-height: 1.4; min-width: 0">{{r.name}}</h3>
</div>
<dl style="margin: 0; display: grid; grid-template-columns: 44px minmax(0, 1fr); row-gap: 6px; font-size: 13px; line-height: 1.5">
<dt style="color: #5F6B64">時間</dt><dd style="margin: 0">{{r.when}}</dd>
<dt style="color: #5F6B64">地點</dt><dd style="margin: 0">{{r.where}}</dd>
<dt style="color: #5F6B64">對象</dt><dd style="margin: 0">{{r.who}}</dd>
</dl>
<p style="margin: 0; font-size: 13px; line-height: 1.6">{{r.note}}</p>
<div style="margin-top: auto; padding-top: 8px; border-top: 1px solid #E4DED2; display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; font-size: 12px; color: #5F6B64">
<span>{{r.price}}</span>
<a href="{{r.ctaUrl}}" style="min-height: 40px; display: inline-flex; align-items: center; padding: 0 14px; border-radius: 10px; border: 1px solid #2E5E4E; color: #2E5E4E; font-size: 13px; font-weight: 600; text-decoration: none">{{r.cta}}</a>
</div>
</article>
</sc-for>
</div>

<div style="background: #FCFAF6; border: 1px dashed #C9C2B4; border-radius: 16px; padding: 16px; display: flex; flex-direction: column; gap: 6px">
<div style="font-size: 14px; font-weight: 600">資料從哪裡來？</div>
<p style="margin: 0; font-size: 13px; line-height: 1.7; color: #5F6B64">竹寶只採用政府機關或主辦單位自己的頁面。過了截止日的項目會自動下架。</p>
</div>
</section>

</div>

<p style="margin: 0; font-size: 12px; line-height: 1.6; color: #5F6B64; border-top: 1px solid #E4DED2; padding-top: 16px">竹寶不收商家刊登費，也不做付費排序。活動內容以主辦單位公告為準。</p>

</div>
</div>
</template>
<div id="dc-root"></div>
<script src="zhubao-runtime.js"></script>
<script>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { menuOpen: false, area: '全部', kind: '全部', time: '全部', age: '全部', free: false };
  }
  renderVals() {
    const s = this.state;
    const WPCC = 'https://wpcc.hccg.gov.tw/';
    const DATA = [
      { name: '寶寶共讀時光', area: '新竹市', kind: '室內', time: ['這個週末', '11 月', '12 月'], ages: ['0–1 歲', '1–3 歲'], free: true,
        dateBig: '每週六', dateSmall: '10:00',
        when: '每週六 10:00–10:40', where: '北區親子館（南勢六街 11 號 2 樓）', price: '免費，需線上預約', who: '0–3 歲寶寶與家長',
        note: '說故事姊姊帶唸繪本、唱兒歌，0 歲寶寶也可以參加。', cta: '預約場次', url: WPCC + 'enrollment/' },
      { name: '7 米聖誕樹點燈展', area: '新竹縣', place: '竹北市', kind: '室內', time: ['這個週末', '11 月', '12 月'], ages: ['0–1 歲', '1–3 歲', '3–6 歲'], free: true,
        dateBig: '展至', dateSmall: '2027/1/3',
        when: '即日起至 2027/1/3', where: '竹北遠百', price: '免費參觀', who: '全年齡',
        note: '室內展區，推嬰兒車也方便。同場有羽絨外套愛心認購。', cta: '活動資訊', url: 'https://n.yam.com/Article/20261113740563' },
      { name: '冬日暖暖節・聖誕序曲', area: '新竹市', kind: '市集', time: ['11 月'], ages: ['1–3 歲', '3–6 歲'], free: true,
        dateBig: '11/28', dateSmall: '週六–週日',
        when: '11/28（六）– 11/29（日）', where: '東區 IFG 遠雄廣場', price: '免費入場', who: '全年齡',
        note: '冬日市集、街頭表演與聖誕手作攤位。', cta: '活動資訊', url: 'https://www.twmarket.tw/' },
      { name: '安全玩具自己做', area: '新竹市', kind: '手作', time: ['12 月'], ages: ['3–6 歲'], free: true,
        dateBig: '12/5', dateSmall: '週六 10:00',
        when: '12/5（六）10:00–11:30', where: '香山區親子館（育德街 188 號）', price: '免費，需報名', who: '2–6 歲幼兒與家長',
        note: '用回收材料做會動的小魚玩具，材料由親子館準備。', cta: '報名', url: WPCC },
      { name: '聖誕點燈市集', area: '新竹縣', place: '竹北市', kind: '市集', time: ['12 月'], ages: ['1–3 歲', '3–6 歲'], free: true,
        dateBig: '12/12', dateSmall: '週六 12:00',
        when: '12/12（六）12:00–19:00', where: '新竹縣政府前廣場', price: '免費入場', who: '全年齡，有親子互動區',
        note: '約 150 組攤位，有手作 DIY、創意闖關和大型氣墊。', cta: '活動資訊', url: 'https://eventgo.tw/event/916079da-2617-4d5a-8ea3-52a5c8691bda' },
      { name: '冬日親子野餐日', area: '其他縣市', place: '桃園市', kind: '戶外', time: ['12 月'], ages: ['0–1 歲', '1–3 歲', '3–6 歲'], free: true,
        dateBig: '12/20', dateSmall: '週日 10:00',
        when: '12/20（日）10:00–16:00', where: '桃園市藝文特區廣場', price: '免費', who: '全年齡',
        note: '草地野餐、親子瑜伽和繪本角，備有哺乳與換尿布帳篷。', cta: '活動資訊', url: '#' },
      { name: '公園草地親子野餐', area: '新竹市', kind: '戶外', time: ['12 月'], ages: ['0–1 歲', '1–3 歲', '3–6 歲'], free: true,
        dateBig: '12/13', dateSmall: '週日 10:00',
        when: '12/13（日）10:00–15:00', where: '東區 新竹公園草地', price: '免費，自備野餐墊', who: '全年齡',
        note: '現場有說故事、泡泡秀和親子律動，備有哺乳與換尿布帳篷。', cta: '活動資訊', url: '#' },
      { name: '親子樂園 兒童免費入園（限時 3 天）', area: '新竹縣', place: '關西鎮', kind: '戶外', time: ['12 月'], ages: ['0–1 歲', '1–3 歲', '3–6 歲'], free: true,
        dateBig: '12/25', dateSmall: '–12/27',
        when: '12/25（五）– 12/27（日）', where: '新竹縣關西鎮親子樂園', price: '12 歲以下兒童免費，大人需購票', who: '12 歲以下兒童與家長',
        note: '只有這 3 天，憑兒童健保卡或戶口名簿入園。嬰兒車可租借。', cta: '活動資訊', url: '#' }
    ];
    const base = 'min-height: 40px; padding: 0 14px; border-radius: 999px; font-family: inherit; font-size: 14px; cursor: pointer; ';
    const on = base + 'background: #2E5E4E; color: #FFFFFF; border: 1px solid #2E5E4E; font-weight: 600';
    const off = base + 'background: #FCFAF6; color: #1F2A24; border: 1px solid #E4DED2';
    const mk = (key, label, opts) => ({
      label,
      options: opts.map((o) => ({ label: o, pressed: s[key] === o ? 'true' : 'false', style: s[key] === o ? on : off, pick: () => this.setState({ [key]: o }) }))
    });
    const tg = (key, label) => ({
      label, checked: s[key] ? 'true' : 'false',
      flip: () => this.setState({ [key]: !s[key] }),
      track: 'width: 44px; height: 26px; border-radius: 999px; flex-shrink: 0; position: relative; display: inline-block; background: ' + (s[key] ? '#2E5E4E' : '#D8D1C3'),
      knob: 'position: absolute; top: 3px; left: ' + (s[key] ? '21px' : '3px') + '; width: 20px; height: 20px; border-radius: 999px; background: #FFFFFF'
    });
    const order = { '新竹市': 0, '新竹縣': 1, '其他縣市': 2 };
    const filtered = DATA.filter((d) =>
      (s.area === '全部' || d.area === s.area) &&
      (s.kind === '全部' || d.kind === s.kind) &&
      (s.time === '全部' || d.time.indexOf(s.time) >= 0) &&
      (s.age === '全部' || d.ages.indexOf(s.age) >= 0) &&
      (!s.free || d.free)
    ).sort((a, b) => order[a.area] - order[b.area]);
    const cityArea = 'display: inline-flex; align-items: center; gap: 4px; font-size: 12px; font-weight: 600; padding: 3px 10px; border-radius: 999px; background: #E4EEE7; color: #2E5E4E';
    const otherArea = 'display: inline-flex; align-items: center; gap: 4px; font-size: 12px; padding: 3px 10px; border-radius: 999px; border: 1px solid #E4DED2; color: #5F6B64';
    const results = filtered.map((d) => {
      const isCity = d.area === '新竹市';
      const hasDate = !!d.dateBig;
      return {
        name: d.name, kind: d.kind, isCity, area: d.area + (d.place ? '・' + d.place : ''),
        areaStyle: isCity ? cityArea : otherArea,
        cardStyle: 'background: #FCFAF6; border: 1px solid #E4DED2; border-radius: 16px; padding: 16px; display: flex; flex-direction: column; gap: 10px' + (isCity ? '; border-left: 4px solid #2E5E4E' : ''),
        dateBox: hasDate ? 'width: 64px; min-height: 56px; flex-shrink: 0; border-radius: 12px; background: #E4EEE7; color: #2E5E4E; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; text-align: center' : 'display: none',
        dateBig: d.dateBig || '', dateSmall: d.dateSmall || '',
        mine: false, when: d.when, where: d.where, price: d.price, who: d.who, note: d.note,
        cta: d.cta, ctaUrl: d.url, srcTitle: '活動資訊', srcUrl: d.url
      };
    });
    return {
      menuOpen: !!s.menuOpen, menuExpanded: s.menuOpen ? 'true' : 'false',
      menuLabel: s.menuOpen ? '關閉' : '選單', menuIcon: s.menuOpen ? 'M6 6l12 12M18 6 6 18' : 'M4 7h16M4 12h16M4 17h16',
      toggleMenu: () => this.setState({ menuOpen: !s.menuOpen }),
      filters: [
        mk('area', '地區', ['全部', '新竹市', '新竹縣', '其他縣市']),
        mk('kind', '類型', ['全部', '戶外', '室內', '手作', '市集']),
        mk('time', '時間', ['全部', '這個週末', '11 月', '12 月']),
        mk('age', '適合年齡（寶寶現在 2 個月）', ['全部', '0–1 歲', '1–3 歲', '3–6 歲'])
      ],
      toggles: [tg('free', '只看免費')],
      reset: () => this.setState({ area: '全部', kind: '全部', time: '全部', age: '全部', free: false }),
      results, noResult: results.length === 0, emptyText: '沒有符合條件的活動。可以放寬條件，或清除篩選。',
      resultText: '共 ' + results.length + ' 場活動'
    };
  }
}

window.Component = Component;
</script>
</body>
</html>
