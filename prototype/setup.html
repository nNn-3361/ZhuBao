<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>竹寶・初次設定</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;600&amp;display=swap">
<style>
body{margin:0}
a{color:#2E5E4E}a:hover{color:#1F4337}
input:focus-visible,button:focus-visible,a:focus-visible{outline:2px solid #2E5E4E;outline-offset:2px}
</style>
<style>#dc-root>div{margin-left:auto;margin-right:auto}</style>
</head>
<body>
<template id="dc-tpl">
<div style="width: 390px; min-height: 1180px; box-sizing: border-box; background: #F6F2EA; font-family: 'Noto Sans TC', system-ui, sans-serif; color: #1F2A24; padding: 24px 20px 32px; display: flex; flex-direction: column; gap: 20px">

<div style="display: flex; align-items: center; justify-content: space-between">
<div style="display: flex; align-items: center; gap: 8px">
<svg width="28" height="28" viewBox="0 0 28 28" aria-hidden="true"><circle cx="14" cy="14" r="13" fill="#2E5E4E"></circle><path d="M14 20V9M14 13c0-2.5 2-4 4.5-4M14 15.5c0-2.2-1.8-3.5-4-3.5" stroke="#F6F2EA" stroke-width="1.8" fill="none" stroke-linecap="round"></path></svg>
<span style="font-size: 18px; font-weight: 600; letter-spacing: 0.04em">竹寶</span>
</div>
<span style="font-size: 12px; color: #5F6B64">新竹市生養時程</span>
</div>

<div style="display: flex; flex-direction: column; gap: 8px">
<div style="height: 4px; background: #E4DED2; border-radius: 999px; overflow: hidden"><div style="width: 100%; height: 4px; background: #2E5E4E"></div></div>
<h1 style="margin: 8px 0 0; font-size: 24px; line-height: 1.4; font-weight: 600">先認識你的寶寶</h1>
<p style="margin: 0; font-size: 14px; line-height: 1.6; color: #5F6B64">回答 5 個問題，我們會依新竹市與中央的規定，整理出寶寶可以用的補助和每個年紀要注意的事。</p>
</div>

<div style="display: flex; gap: 12px; align-items: flex-start; background: #E4EEE7; border-radius: 12px; padding: 12px 14px">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#2E5E4E" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0; margin-top: 2px"><rect x="4" y="10" width="16" height="11" rx="2"></rect><path d="M8 10V7a4 4 0 0 1 8 0v3"></path></svg>
<p style="margin: 0; font-size: 13px; line-height: 1.6; color: #2E5E4E">不收姓名與身分證字號。資料只存在這支手機，隨時可以在設定中清除。</p>
</div>

<div style="display: flex; flex-direction: column; gap: 8px">
<label for="birth" style="font-size: 15px; font-weight: 600">寶寶出生日期</label>
<input id="birth" type="date" value="2026-09-10" style="height: 48px; box-sizing: border-box; border: 1px solid #E4DED2; border-radius: 12px; background: #FCFAF6; padding: 0 14px; font-family: inherit; font-size: 16px; color: #1F2A24">
<span style="font-size: 12px; color: #5F6B64">還沒出生？<a href="#">改填預產期</a></span>
</div>

<sc-for list="{{questions}}" as="q" hint-placeholder-count="4">
<fieldset style="border: 0; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px">
<legend style="font-size: 15px; font-weight: 600; padding: 0; margin-bottom: 8px; display: flex; gap: 8px; align-items: center">{{q.label}}<sc-if value="{{q.optional}}" hint-placeholder-val="{{false}}"><span style="font-size: 12px; font-weight: 400; color: #5F6B64; border: 1px solid #E4DED2; border-radius: 999px; padding: 1px 8px">選填・可略過</span></sc-if></legend>
<sc-if value="{{q.hint}}" hint-placeholder-val="{{false}}"><span style="font-size: 12px; line-height: 1.5; color: #5F6B64; margin-top: -4px">{{q.hint}}</span></sc-if>
<div style="display: flex; flex-wrap: wrap; gap: 8px">
<sc-for list="{{q.options}}" as="o" hint-placeholder-count="3">
<button type="button" aria-pressed="{{o.pressed}}" onClick="{{o.pick}}" style="{{o.style}}">{{o.label}}</button>
</sc-for>
</div>
</fieldset>
</sc-for>

<div style="display: flex; flex-direction: column; gap: 10px; margin-top: 8px">
<a href="index.html" style="height: 52px; display: flex; align-items: center; justify-content: center; background: #2E5E4E; color: #FFFFFF; border-radius: 12px; font-size: 16px; font-weight: 600; text-decoration: none">開始使用竹寶</a>
<p style="margin: 0; font-size: 12px; line-height: 1.6; color: #5F6B64; text-align: center">結果僅供參考，最終資格以主管機關審核為準。</p>
</div>

</div>
</template>
<div id="dc-root"></div>
<script src="zhubao-runtime.js"></script>
<script>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { district: '北區', residency: '不確定', order: '第 1 胎', care: '自己或家人', lowIncome: '不想回答' };
  }
  renderVals() {
    const s = this.state;
    const base = 'min-height: 44px; padding: 0 16px; border-radius: 999px; font-family: inherit; font-size: 15px; cursor: pointer; ';
    const on = base + 'background: #2E5E4E; color: #FFFFFF; border: 1px solid #2E5E4E; font-weight: 600';
    const off = base + 'background: #FCFAF6; color: #1F2A24; border: 1px solid #E4DED2; font-weight: 400';
    const mk = (key, label, opts, extra) => Object.assign({
      label,
      options: opts.map((o) => ({
        label: o,
        pressed: s[key] === o ? 'true' : 'false',
        style: s[key] === o ? on : off,
        pick: () => this.setState({ [key]: o })
      }))
    }, extra || {});
    return {
      questions: [
        mk('district', '戶籍行政區', ['東區', '北區', '香山區']),
        mk('residency', '父或母是否設籍新竹市？', ['是', '否', '不確定'], { hint: '用來判斷新竹市的補助' }),
        mk('order', '這是第幾胎？', ['第 1 胎', '第 2 胎', '第 3 胎以上'], { hint: '部分補助金額依胎次不同' }),
        mk('care', '寶寶目前主要由誰照顧？', ['自己或家人', '保母', '托嬰中心'], { hint: '決定可以領育兒津貼還是托育補助' }),
        mk('lowIncome', '是否為低收入或中低收入戶？', ['是', '否', '不想回答'], { optional: true })
      ]
    };
  }
}

window.Component = Component;
</script>
</body>
</html>
