<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FCFAF6">
<script src="zhubao-family.js"></script>
<script src="zhubao-app.js"></script>
<title>竹寶・初次設定</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;600&amp;display=swap">
<style>
body{margin:0;background:#F6F2EA}
a{color:#2E5E4E}a:hover{color:#1F4337}
input:focus-visible,button:focus-visible,a:focus-visible{outline:2px solid #2E5E4E;outline-offset:2px}
.zb-nav-toggle{display:none}
@media (max-width: 760px){.zb-nav-links{display:none !important}.zb-nav-toggle{display:inline-flex !important}}
@media (min-width: 761px){.zb-nav-menu{display:none !important}}
/*zb-ui-start*/
.zb-bam-row{display:flex;gap:8px;align-items:stretch}
.zb-bam-row>button{flex:1;min-width:0}
.zb-bam{position:relative;width:40px;flex-shrink:0;display:flex;flex-direction:column;align-items:center;cursor:pointer}
.zb-culm{width:12px;flex-shrink:0;background:linear-gradient(90deg,#4F8065 0%,#80AE8F 45%,#5E8F73 100%)}
.zb-culm-a{height:26px}
.zb-culm-b{flex:1 1 auto;min-height:12px}
.zb-node{width:20px;height:7px;border-radius:4px;background:#3F6F57;flex-shrink:0;position:relative;z-index:1;transition:transform .25s cubic-bezier(.23,1,.32,1)}
.zb-bam-top .zb-culm-a{border-radius:6px 6px 0 0;height:20px;margin-top:6px}
.zb-bam-bottom .zb-culm-b{border-radius:0 0 3px 3px}
.zb-leaf{position:absolute;top:23px;width:26px;height:12px;fill:#6F9A82;pointer-events:none}
.zb-leaf-r{left:24px;transform-origin:left center;transform:rotate(-30deg)}
.zb-leaf-l{right:24px;transform-origin:right center;transform:rotate(30deg);display:none}
.zb-alt .zb-leaf-r{display:none}.zb-alt .zb-leaf-l{display:block}
.zb-bam-future .zb-culm,.zb-bam-future .zb-node{opacity:.28}
.zb-bam-future .zb-leaf{opacity:.25}
.zb-bam-now .zb-culm-a{opacity:.28}
.zb-bam-now .zb-node{background:#2E5E4E;animation:zbGlow 2.4s ease-in-out infinite}
.zb-bam-now .zb-leaf{fill:#8FC16F}
.zb-bam-now .zb-leaf-l,.zb-bam-now .zb-leaf-r{display:block}
.zb-bam-now .zb-leaf-r{animation:zbIdleR 3.2s ease-in-out infinite}
.zb-bam-now .zb-leaf-l{animation:zbIdleL 3.2s ease-in-out infinite}
.zb-bam-row[data-on="true"] .zb-leaf-r{animation:zbSwayR .8s ease-in-out 2}
.zb-bam-row[data-on="true"] .zb-leaf-l{animation:zbSwayL .8s ease-in-out 2}
@keyframes zbGlow{0%,100%{box-shadow:0 0 0 3px rgba(143,193,111,.35),0 0 8px rgba(46,94,78,.35)}50%{box-shadow:0 0 0 6px rgba(143,193,111,.25),0 0 18px rgba(46,94,78,.6)}}
@keyframes zbIdleR{0%,100%{transform:rotate(-30deg)}50%{transform:rotate(-20deg)}}
@keyframes zbIdleL{0%,100%{transform:rotate(30deg)}50%{transform:rotate(20deg)}}
@keyframes zbSwayR{0%,100%{transform:rotate(-30deg)}30%{transform:rotate(0deg)}65%{transform:rotate(-44deg)}}
@keyframes zbSwayL{0%,100%{transform:rotate(30deg)}30%{transform:rotate(0deg)}65%{transform:rotate(44deg)}}
@keyframes zbWiggle{0%,100%{transform:rotate(0)}25%{transform:rotate(-10deg)}60%{transform:rotate(8deg)}}
*{-webkit-tap-highlight-color:transparent}
button,a[style*="min-height"]{transition:transform .2s cubic-bezier(.23,1,.32,1),box-shadow .2s ease,background-color .2s ease,border-color .2s ease,color .2s ease}
button:active,a[style*="min-height"]:active{transform:scale(.97);box-shadow:none;transition-duration:.1s}
.zb-bam-row button:active{transform:none}
@media (hover:hover){
button:not([aria-expanded]):not([role="switch"]):not([role="checkbox"]):hover,a[style*="min-height"]:hover{transform:translateY(-2px);box-shadow:0 6px 14px rgba(46,94,78,.18)}
button[aria-expanded]:hover .zb-chev{stroke:#2E5E4E}
button[role="switch"]:hover,button[role="checkbox"]:hover{color:#2E5E4E !important}
.zb-nav-links a:not([aria-current]):hover{background:#E4EEE7 !important;color:#2E5E4E !important}
.zb-bam-row button:hover{transform:none;box-shadow:none}
.zb-bam-row:hover button[aria-pressed="false"]{background:#F1EDE4 !important}
.zb-bam-row:hover .zb-leaf-r{animation:zbSwayR .8s ease-in-out infinite}
.zb-bam-row:hover .zb-leaf-l{animation:zbSwayL .8s ease-in-out infinite}
.zb-bam-row:hover .zb-node{transform:scaleX(1.18)}
header svg:first-child:hover{animation:zbWiggle .6s ease-in-out}
}
@media (prefers-reduced-motion:reduce){
#dc-root *,x-dc *{animation:none !important;transition:none !important}
button:hover,button:active,a:hover,a:active{transform:none !important}
}
/*zb-ui-end*/
</style>
<style>#dc-root>div{margin-left:auto;margin-right:auto}
.zb-setup{max-width:768px;margin:0 auto;padding:32px 24px 56px;box-sizing:border-box}
.zb-setup-card{background:#FCFAF6;border:1px solid #E4DED2;border-radius:20px;padding:32px 36px;display:flex;flex-direction:column;gap:24px}
.zb-setup-q{display:flex;flex-direction:column;gap:24px}
.zb-setup-card a[href="index.html"]{max-width:360px;width:100%;margin:0 auto}
.zb-date{display:flex;align-items:center;gap:2px;font-size:14px}
.zb-date button{background:transparent !important;border:0 !important;box-shadow:none !important;font-family:inherit;color:#1F2A24;cursor:pointer;padding:0}
.zb-date button:hover{transform:none !important}
.zb-date-arrow{width:40px;height:44px;border-radius:999px;font-size:24px;line-height:1}
.zb-date-arrow:hover{color:#2E5E4E}
.zb-date-arrow[aria-disabled="true"]{color:#D3CCBF;cursor:default}
.zb-date-pick{position:relative;display:inline-flex}
.zb-date-label{position:relative;min-height:44px;padding:0 4px !important;font-size:16px;font-weight:600;letter-spacing:.02em;transition:color .2s ease}
.zb-date-label::after{content:"";position:absolute;left:4px;right:4px;bottom:8px;height:2px;border-radius:2px;background:#2E5E4E;transform:scaleX(0);transform-origin:center;transition:transform .28s cubic-bezier(.23,1,.32,1)}
.zb-date-label:hover,.zb-date-label:focus-visible{color:#2E5E4E}
.zb-date-label:hover::after,.zb-date-label:focus-visible::after{transform:scaleX(1)}
.zb-date-label:active{transform:scale(.96) !important}
.zb-dp-pop{position:absolute;left:-8px;top:100%;z-index:40;margin-top:6px;width:296px;box-sizing:border-box;background:#FCFAF6;border-radius:20px;box-shadow:0 14px 36px rgba(31,42,36,.16);padding:14px 14px 10px;display:flex;flex-direction:column;gap:10px;transform-origin:top left;animation:zbDpIn .22s cubic-bezier(.2,.8,.2,1)}
.zb-dp-head{display:flex;align-items:baseline;justify-content:space-between;gap:8px;padding:0 4px;font-size:15px;font-weight:600;color:#1F2A24}
.zb-dp-sub{font-size:12px;font-weight:400;color:#5F6B64}
.zb-dp-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;justify-items:center}
.zb-dp-w{font-size:12px;color:#5F6B64;height:24px;display:flex;align-items:center}
.zb-date-pick button.zb-dp-d{position:relative;width:36px;height:36px;padding:0;border:0 !important;border-radius:999px;background:transparent !important;box-shadow:none !important;font-family:inherit;font-size:14px;color:#1F2A24;font-variant-numeric:tabular-nums;cursor:pointer;transition:background-color .18s ease,color .18s ease}
.zb-date-pick button.zb-dp-d:hover{background:#E4EEE7 !important;color:#2E5E4E;transform:none !important}
.zb-date-pick button.zb-dp-d:active{transform:scale(.9) !important}
.zb-date-pick button.zb-dp-d[aria-pressed="true"]{background:#2E5E4E !important;color:#FFFFFF;font-weight:600}
.zb-dp-today::after{content:"";position:absolute;left:50%;bottom:4px;width:4px;height:4px;margin-left:-2px;border-radius:999px;background:#8FC16F}
.zb-date-pick button.zb-dp-off{color:#C9C2B4;cursor:default}
.zb-date-pick button.zb-dp-off:hover{background:transparent !important;color:#C9C2B4}
.zb-date-pick button.zb-dp-off:active{transform:none !important}
.zb-date-pick button.zb-dp-blank{visibility:hidden}
.zb-dp-act{display:flex;justify-content:flex-end;gap:4px;border-top:1px solid #EFEAE0;padding-top:8px}
.zb-dp-act button{min-height:40px;padding:0 14px;border:0 !important;border-radius:12px;background:transparent !important;box-shadow:none !important;font-family:inherit;font-size:14px;font-weight:600;color:#2E5E4E;cursor:pointer}
.zb-dp-act button:hover{background:#E4EEE7 !important;transform:none !important}
.zb-dp-act button.zb-dp-ok{background:#2E5E4E !important;color:#FFFFFF}
.zb-date-label[aria-expanded="true"]{color:#2E5E4E}.zb-date-label[aria-expanded="true"]::after{transform:scaleX(1)}
@keyframes zbDpIn{from{opacity:0;transform:translateY(-6px) scale(.97)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.zb-dp-pop{animation:none}.zb-date-label::after{transition:none}}
.zb-dp-head{align-items:center}
.zb-date-pick button.zb-dp-nav{width:36px;height:36px;padding:0;border:0 !important;border-radius:999px;background:transparent !important;box-shadow:none !important;font-family:inherit;font-size:20px;line-height:1;color:#2E5E4E;cursor:pointer}
.zb-date-pick button.zb-dp-nav:hover{background:#E4EEE7 !important;transform:none !important}
.zb-date-pick button.zb-dp-nav:active{transform:scale(.9) !important}
.zb-dp-title{flex:1;text-align:center}
.zb-setup-card{gap:28px}
.zb-su-head{display:flex;flex-direction:column;gap:6px}
.zb-su-kicker{font-size:13px;font-weight:600;color:#2E5E4E;letter-spacing:.06em}
.zb-su-head h1{margin:0;font-size:26px;line-height:1.35;font-weight:600}
.zb-su-head p{margin:0;font-size:15px;line-height:1.7;color:#5F6B64}
.zb-su-note{margin:0;background:#E4EEE7;border-radius:12px;padding:12px 16px;font-size:13px;line-height:1.6;color:#2E5E4E}
.zb-su-sec{display:flex;flex-direction:column;gap:4px;border-top:1px solid #EFEAE0;padding-top:24px}
.zb-su-label{font-size:15px;font-weight:600}
.zb-su-hint{font-size:13px;color:#5F6B64}
.zb-su-sec .zb-date-label{font-size:20px;padding:0 2px !important}
.zb-setup-q{border-top:1px solid #EFEAE0;padding-top:24px}
.zb-setup-q fieldset{min-width:0}
.zb-su-foot{display:flex;flex-direction:column;align-items:center;gap:10px;border-top:1px solid #EFEAE0;padding-top:24px}
@media (max-width:760px){.zb-su-head h1{font-size:24px}.zb-su-sec,.zb-setup-q,.zb-su-foot{padding-top:20px}}

@media (max-width:760px){.zb-setup{padding:20px 16px 36px}.zb-setup-card{background:transparent;border:0;border-radius:0;padding:0;gap:20px}.zb-setup-q{gap:20px}.zb-su-save{max-width:none !important}}
</style>
</head>
<body>
<template id="dc-tpl">
<div style="width: 100%; min-height: 100vh; box-sizing: border-box; background: #F6F2EA; font-family: 'Noto Sans TC', system-ui, sans-serif; color: #1F2A24">
<header style="border-bottom: 1px solid #E4DED2; background: #FCFAF6">
<div style="max-width: 1200px; margin: 0 auto; padding: 14px 24px; box-sizing: border-box; display: flex; align-items: center; justify-content: space-between; gap: 12px">
<div style="display: flex; align-items: center; gap: 10px">
<svg width="26" height="26" viewBox="0 0 28 28" aria-hidden="true"><circle cx="14" cy="14" r="13" fill="#2E5E4E"></circle><path d="M14 20V9M14 13c0-2.5 2-4 4.5-4M14 15.5c0-2.2-1.8-3.5-4-3.5" stroke="#F6F2EA" stroke-width="1.8" fill="none" stroke-linecap="round"></path></svg>
<span style="font-size: 17px; font-weight: 600; letter-spacing: 0.04em">竹寶</span>
</div>
<nav class="zb-nav-links" aria-label="主選單" style="display: flex; gap: 4px; flex-wrap: wrap">
<a href="index.html" style="min-height: 44px; display: flex; align-items: center; padding: 0 14px; border-radius: 12px; text-decoration: none; color: #5F6B64; font-size: 14px">主頁</a>
<a href="benefits.html" style="min-height: 44px; display: flex; align-items: center; padding: 0 14px; border-radius: 12px; text-decoration: none; color: #5F6B64; font-size: 14px">補助及其他福利</a>
<a href="childcare.html" style="min-height: 44px; display: flex; align-items: center; padding: 0 14px; border-radius: 12px; text-decoration: none; color: #5F6B64; font-size: 14px">托育</a>
<a href="activities.html" style="min-height: 44px; display: flex; align-items: center; padding: 0 14px; border-radius: 12px; text-decoration: none; color: #5F6B64; font-size: 14px">親子活動</a>
<a href="ask.html" style="min-height: 44px; display: flex; align-items: center; padding: 0 14px; border-radius: 12px; text-decoration: none; color: #5F6B64; font-size: 14px">問竹寶</a>
<a href="help.html" style="min-height: 44px; display: flex; align-items: center; padding: 0 14px; border-radius: 12px; text-decoration: none; color: #5F6B64; font-size: 14px">協助</a>
</nav>
<button type="button" class="zb-nav-toggle" aria-expanded="{{menuExpanded}}" aria-controls="zb-menu" onClick="{{toggleMenu}}" style="min-height: 44px; align-items: center; gap: 8px; padding: 0 14px; border-radius: 12px; border: 1px solid #E4DED2; background: #FCFAF6; font-family: inherit; font-size: 14px; color: #1F2A24; cursor: pointer"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="{{menuIcon}}"></path></svg>{{menuLabel}}</button>
</div>
<sc-if value="{{menuOpen}}" hint-placeholder-val="{{false}}">
<nav id="zb-menu" class="zb-nav-menu" aria-label="主選單" style="border-top: 1px solid #E4DED2; background: #FCFAF6; padding: 8px 16px 16px; display: flex; flex-direction: column">
<a href="index.html" style="min-height: 52px; display: flex; align-items: center; padding: 0 14px; border-radius: 12px; text-decoration: none; color: #1F2A24; font-size: 16px; border-bottom: 1px solid #EFEAE0">主頁</a>
<a href="benefits.html" style="min-height: 52px; display: flex; align-items: center; padding: 0 14px; border-radius: 12px; text-decoration: none; color: #1F2A24; font-size: 16px; border-bottom: 1px solid #EFEAE0">補助及其他福利</a>
<a href="childcare.html" style="min-height: 52px; display: flex; align-items: center; padding: 0 14px; border-radius: 12px; text-decoration: none; color: #1F2A24; font-size: 16px; border-bottom: 1px solid #EFEAE0">托育</a>
<a href="activities.html" style="min-height: 52px; display: flex; align-items: center; padding: 0 14px; border-radius: 12px; text-decoration: none; color: #1F2A24; font-size: 16px; border-bottom: 1px solid #EFEAE0">親子活動</a>
<a href="ask.html" style="min-height: 52px; display: flex; align-items: center; padding: 0 14px; border-radius: 12px; text-decoration: none; color: #1F2A24; font-size: 16px; border-bottom: 1px solid #EFEAE0">問竹寶</a>
<a href="help.html" style="min-height: 52px; display: flex; align-items: center; padding: 0 14px; border-radius: 12px; text-decoration: none; color: #1F2A24; font-size: 16px; border-bottom: 1px solid #EFEAE0">協助</a>
</nav>
</sc-if>
</header>
<main class="zb-setup">
<div class="zb-setup-card">
<div class="zb-su-head">
<span class="zb-su-kicker">寶寶資料</span>
<h1>{{headTitle}}</h1>
<p>回答幾個簡單的問題，我們會依新竹市與中央的規定，整理出寶寶可以用的補助和每個年紀要注意的事。</p>
</div>
<p class="zb-su-note">只要一個暱稱（例如哥哥、妹妹），不收真實姓名與身分證字號。資料只存在這台裝置，隨時可以在設定中清除。</p>

<section class="zb-su-sec" aria-labelledby="pf-l">
<span id="pf-l" class="zb-su-label">寶寶檔案</span>
<span class="zb-su-hint">家裡有不只一個孩子，就幫每個孩子各建一個檔案。點一個檔案可以修改。</span>
<div class="zb-pick" style="margin-top: 8px">
<sc-for list="{{profiles}}" as="p" hint-placeholder-count="2"><button type="button" aria-pressed="{{p.on}}" onClick="{{p.pick}}"><i class="zb-kdot" style="background: {{p.hex}}"></i>{{p.name}}</button></sc-for>
<button type="button" aria-pressed="{{newOn}}" onClick="{{startNew}}">＋ 建立新檔案</button>
</div>
</section>

<section class="zb-su-sec" aria-labelledby="nm-l">
<label id="nm-l" class="zb-su-label" for="kid-name">暱稱</label>
<input id="kid-name" class="zb-input" style="margin-top: 6px" maxlength="10" placeholder="例如：哥哥、妹妹、小竹" value="{{nameVal}}" onInput="{{setName}}">
</section>

<section class="zb-su-sec" aria-labelledby="cl-l">
<span id="cl-l" class="zb-su-label">檔案顏色</span>
<span class="zb-su-hint">主頁行事曆會用這個顏色的點標出這個孩子的事。</span>
<div class="zb-pick" role="group" aria-labelledby="cl-l" style="margin-top: 8px">
<sc-for list="{{colors}}" as="c" hint-placeholder-count="7"><button type="button" aria-pressed="{{c.on}}" aria-label="{{c.name}}色" onClick="{{c.pick}}" style="min-width: 64px; justify-content: center"><i class="zb-kdot" style="background: {{c.hex}}; width: 14px; height: 14px"></i>{{c.name}}</button></sc-for>
</div>
</section>

<section class="zb-su-sec" aria-labelledby="bd-l">
<span id="bd-l" class="zb-su-label">寶寶出生日期</span>
<div class="zb-date">
<span class="zb-date-pick">
<button type="button" class="zb-date-label" aria-labelledby="bd-l bd-v" aria-expanded="{{dpExp}}" onClick="{{openPicker}}"><span id="bd-v">{{bdLabel}}</span></button>
<sc-if value="{{dpOpen}}" hint-placeholder-val="{{false}}">
<div class="zb-dp-pop" role="group" aria-label="選擇出生日期">
<div class="zb-dp-head"><button type="button" class="zb-dp-nav" aria-label="上個月" onClick="{{prevMonth}}">‹</button><span class="zb-dp-title">{{dpTitle}}</span><button type="button" class="zb-dp-nav" aria-label="下個月" onClick="{{nextMonth}}">›</button></div>
<div class="zb-dp-grid">
<sc-for list="{{dpWeek}}" as="w" hint-placeholder-count="7"><span class="zb-dp-w">{{w}}</span></sc-for>
<sc-for list="{{dpCells}}" as="c" hint-placeholder-count="35"><button type="button" class="{{c.cls}}" aria-label="{{c.aria}}" aria-pressed="{{c.on}}" tabindex="{{c.tab}}" onClick="{{c.pick}}">{{c.label}}</button></sc-for>
</div>
<div class="zb-dp-act"><button type="button" onClick="{{goToday}}">今天</button><button type="button" class="zb-dp-ok" onClick="{{closeDp}}">完成</button></div>
</div>
</sc-if>
</span>
</div>
<span class="zb-su-hint">還沒出生？填預產期就可以。</span>
</section>

<div class="zb-setup-q">
<sc-for list="{{questions}}" as="q" hint-placeholder-count="4">
<fieldset style="border: 0; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px">
<legend style="font-size: 15px; font-weight: 600; padding: 0; margin-bottom: 8px; display: flex; gap: 8px; align-items: center">{{q.label}}<sc-if value="{{q.optional}}" hint-placeholder-val="{{false}}"><span style="font-size: 12px; font-weight: 400; color: #5F6B64; border: 1px solid #E4DED2; border-radius: 999px; padding: 1px 8px">選填・可略過</span></sc-if></legend>
<sc-if value="{{q.hint}}" hint-placeholder-val="{{false}}"><span style="font-size: 12px; line-height: 1.5; color: #5F6B64; margin-top: -4px">{{q.hint}}</span></sc-if>
<div style="display: flex; flex-wrap: wrap; gap: 8px">
<sc-for list="{{q.options}}" as="o" hint-placeholder-count="3">
<button type="button" aria-pressed="{{o.pressed}}" onClick="{{o.pick}}" style="{{o.style}}">{{o.label}}</button>
</sc-for>
</div>
</fieldset>
</sc-for>
</div>

<div class="zb-su-foot">
<button type="button" class="zb-su-save" onClick="{{save}}" style="height: 52px; max-width: 360px; width: 100%; display: flex; align-items: center; justify-content: center; background: #2E5E4E; color: #FFFFFF; border: 0; border-radius: 12px; font-family: inherit; font-size: 16px; font-weight: 600; cursor: pointer">{{saveText}}</button>
<sc-if value="{{canDelete}}" hint-placeholder-val="{{false}}"><button type="button" onClick="{{remove}}" style="min-height: 44px; padding: 0 16px; border: 0; background: transparent; font-family: inherit; font-size: 14px; color: #8E3A33; cursor: pointer">{{deleteText}}</button></sc-if>
<p style="margin: 0; font-size: 12px; line-height: 1.6; color: #5F6B64; text-align: center">結果僅供參考，最終資格以主管機關審核為準。</p>
</div>

</div>
</main>
</div>
</template>
<div id="dc-root"></div>
<script src="zhubao-ai.js"></script>
<script src="zhubao-runtime.js"></script>
<script>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    document.addEventListener('click', (e) => { const t = e.target; if (t && t.isConnected && this.state.dp && !t.closest('.zb-date-pick')) this.setState({ dp: false }); });
    document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && this.state.dp) this.setState({ dp: false }); });
    const F = window.ZBF;
    this.state = Object.assign({ menuOpen: false, dp: false, confirmDel: false }, new URLSearchParams(location.search).get('new') === '1' ? this.blank() : this.load(F.current()));
  }
  load(k) {
    const b = window.ZBF.parse(k.bd);
    return { id: k.id, name: k.name, color: k.color, bd: { y: b.getFullYear(), m: b.getMonth(), d: b.getDate() }, vy: b.getFullYear(), vm: b.getMonth(),
      district: k.district, residency: k.residency, order: k.order, care: k.care, lowIncome: k.lowIncome, conds: (k.conds || []).slice(), confirmDel: false };
  }
  blank() {
    const F = window.ZBF, used = F.kids().map((k) => k.color), T = F.today();
    const free = F.COLORS.find((c) => used.indexOf(c.id) < 0) || F.COLORS[0];
    const n = F.kids().length + 1;
    return { id: '', name: '', color: free.id, bd: { y: T.getFullYear(), m: T.getMonth(), d: T.getDate() }, vy: T.getFullYear(), vm: T.getMonth(),
      district: F.current().district, residency: F.current().residency, order: n >= 3 ? '第 3 胎以上' : '第 ' + n + ' 胎', care: '自己或家人', lowIncome: F.current().lowIncome, conds: [], confirmDel: false };
  }
  renderVals() {
    const s = this.state;
    const base = 'min-height: 44px; padding: 0 16px; border-radius: 999px; font-family: inherit; font-size: 15px; cursor: pointer; ';
    const on = base + 'background: #2E5E4E; color: #FFFFFF; border: 1px solid #2E5E4E; font-weight: 600';
    const off = base + 'background: #FCFAF6; color: #1F2A24; border: 1px solid #E4DED2; font-weight: 400';
    const mk = (key, label, opts, extra) => Object.assign({
      label,
      options: opts.map((o) => ({
        label: o,
        pressed: s[key] === o ? 'true' : 'false',
        style: s[key] === o ? on : off,
        pick: () => this.setState({ [key]: o })
      }))
    }, extra || {});
    /* 出生日期：自製月曆，可以切換月份，也可以選未來日期（預產期） */
    const WK = ['日', '一', '二', '三', '四', '五', '六'];
    const now = new Date(), T = { y: now.getFullYear(), m: now.getMonth(), d: now.getDate() };
    const bd = s.bd, bdDate = new Date(bd.y, bd.m, bd.d);
    const shift = (n) => { const dt = new Date(s.vy, s.vm + n, 1); this.setState({ vy: dt.getFullYear(), vm: dt.getMonth() }); };
    const cells = [];
    const first = new Date(s.vy, s.vm, 1).getDay(), days = new Date(s.vy, s.vm + 1, 0).getDate();
    for (let n = 0; n < first; n++) cells.push({ label: '', cls: 'zb-dp-d zb-dp-blank', aria: '', on: 'false', tab: '-1', pick: null });
    for (let d = 1; d <= days; d++) {
      const on = bd.y === s.vy && bd.m === s.vm && bd.d === d, today = T.y === s.vy && T.m === s.vm && T.d === d;
      cells.push({ label: String(d), cls: 'zb-dp-d' + (today ? ' zb-dp-today' : ''), aria: s.vy + ' 年 ' + (s.vm + 1) + ' 月 ' + d + ' 日' + (today ? '（今天）' : ''),
        on: on ? 'true' : 'false', tab: '0', pick: () => this.setState({ bd: { y: s.vy, m: s.vm, d }, dp: false }) });
    }
    const F = window.ZBF, kids = F.kids();
    /* 家裡的其他狀況（可複選）：補助頁上方的篩選會自動帶入 */
    const MULTI = [['single', '單親・特殊境遇'], ['dis', '身障・早療'], ['med', '早產或需要長期就醫'], ['new', '新住民'], ['ind', '原住民'], ['multi', '多胞胎'], ['leave', '爸爸或媽媽請育嬰留停']];
    const sc = s.conds || [];
    const multi = { label: '家裡有這些情況嗎？', optional: true, hint: '可複選。補助頁會依這裡先幫你篩選，之後也可以在補助頁調整。',
      options: MULTI.map((o) => { const onNow = sc.indexOf(o[0]) >= 0; return { label: o[1], pressed: onNow ? 'true' : 'false', style: onNow ? on : off,
        pick: () => this.setState({ conds: onNow ? sc.filter((x) => x !== o[0]) : sc.concat([o[0]]) }) }; }) };
    const toast = (t) => window.ZB && window.ZB.toast(t);
    const save = () => {
      const name = (s.name || '').trim();
      if (!name) { const el = document.getElementById('kid-name'); if (el) el.focus(); toast('請先幫寶寶取個暱稱'); return; }
      const bdStr = bd.y + '-' + String(bd.m + 1).padStart(2, '0') + '-' + String(bd.d).padStart(2, '0');
      const k = F.saveKid({ id: s.id, name, color: s.color, bd: bdStr, district: s.district, residency: s.residency, order: s.order, care: s.care, lowIncome: s.lowIncome, conds: (s.conds || []).slice() });
      F.setCurrent(k.id);
      location.replace('index.html');
    };
    return {
      headTitle: s.id ? '修改' + (s.name || '寶寶') + '的資料' : kids.length ? '建立新的寶寶檔案' : '先認識你的寶寶',
      profiles: kids.map((k) => ({ name: k.name, hex: F.color(k.color).hex, on: k.id === s.id ? 'true' : 'false', pick: () => this.setState(this.load(k)) })),
      newOn: s.id ? 'false' : 'true', startNew: () => this.setState(this.blank()),
      nameVal: s.name || '', setName: (e) => { this.state.name = e.target.value; },
      colors: F.COLORS.map((c) => ({ name: c.name, hex: c.hex, on: s.color === c.id ? 'true' : 'false', pick: () => this.setState({ color: c.id, name: (document.getElementById('kid-name') || {}).value || s.name }) })),
      saveText: s.id ? '儲存並回到主頁' : '建立檔案並開始使用', save,
      canDelete: !!s.id && kids.length > 1, deleteText: s.confirmDel ? '再按一次刪除「' + s.name + '」的檔案' : '刪除這個檔案',
      remove: () => { if (!s.confirmDel) { this.setState({ confirmDel: true }); return; } F.removeKid(s.id); toast('已刪除'); this.setState(this.load(F.current())); },
      bdLabel: bd.y + ' 年 ' + (bd.m + 1) + ' 月 ' + bd.d + ' 日（' + WK[bdDate.getDay()] + '）',
      dpOpen: !!s.dp, dpExp: s.dp ? 'true' : 'false',
      openPicker: () => this.setState({ dp: !s.dp, vy: bd.y, vm: bd.m }),
      closeDp: () => this.setState({ dp: false }),
      goToday: () => this.setState({ bd: T, vy: T.y, vm: T.m, dp: false }),
      prevMonth: () => shift(-1), nextMonth: () => shift(1),
      dpTitle: s.vy + ' 年 ' + (s.vm + 1) + ' 月', dpWeek: WK, dpCells: cells,
      menuOpen: !!s.menuOpen, menuExpanded: s.menuOpen ? 'true' : 'false',
      menuLabel: s.menuOpen ? '關閉' : '選單', menuIcon: s.menuOpen ? 'M6 6l12 12M18 6 6 18' : 'M4 7h16M4 12h16M4 17h16',
      toggleMenu: () => this.setState({ menuOpen: !s.menuOpen }),
      questions: [
        mk('district', '戶籍行政區', ['東區', '北區', '香山區']),
        mk('residency', '父或母是否設籍新竹市？', ['是', '否', '不確定'], { hint: '用來判斷新竹市的補助' }),
        mk('order', '這是第幾胎？', ['第 1 胎', '第 2 胎', '第 3 胎以上'], { hint: '部分補助金額依胎次不同' }),
        mk('care', '寶寶目前主要由誰照顧？', ['自己或家人', '保母', '托嬰中心'], { hint: '影響育兒津貼和托育補助哪一項可能適用' }),
        mk('lowIncome', '是否為低收入或中低收入戶？', ['是', '否', '不想回答'], { optional: true }),
        multi
      ]
    };
  }
}

window.Component = Component;
</script>
</body>
</html>
