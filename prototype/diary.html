<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>竹寶・寶寶日記</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;600&amp;display=swap">
<style>
body{margin:0;background:#F6F2EA}
a{color:#2E5E4E}a:hover{color:#1F4337}
button:focus-visible,a:focus-visible,input:focus-visible{outline:2px solid #2E5E4E;outline-offset:2px}
.zb-nav-toggle{display:none}
@media (max-width: 760px){.zb-nav-links{display:none !important}.zb-nav-toggle{display:inline-flex !important}}
@media (min-width: 761px){.zb-nav-menu{display:none !important}}
/*zb-ui-start*/
.zb-bam-row{display:flex;gap:8px;align-items:stretch}
.zb-bam-row>button{flex:1;min-width:0}
.zb-bam{position:relative;width:40px;flex-shrink:0;display:flex;flex-direction:column;align-items:center;cursor:pointer}
.zb-culm{width:12px;flex-shrink:0;background:linear-gradient(90deg,#4F8065 0%,#80AE8F 45%,#5E8F73 100%)}
.zb-culm-a{height:26px}
.zb-culm-b{flex:1 1 auto;min-height:12px}
.zb-node{width:20px;height:7px;border-radius:4px;background:#3F6F57;flex-shrink:0;position:relative;z-index:1;transition:transform .25s cubic-bezier(.34,1.56,.64,1)}
.zb-bam-top .zb-culm-a{border-radius:6px 6px 0 0;height:20px;margin-top:6px}
.zb-bam-bottom .zb-culm-b{border-radius:0 0 3px 3px}
.zb-leaf{position:absolute;top:23px;width:26px;height:12px;fill:#6F9A82;pointer-events:none}
.zb-leaf-r{left:24px;transform-origin:left center;transform:rotate(-30deg)}
.zb-leaf-l{right:24px;transform-origin:right center;transform:rotate(30deg);display:none}
.zb-alt .zb-leaf-r{display:none}.zb-alt .zb-leaf-l{display:block}
.zb-bam-future .zb-culm,.zb-bam-future .zb-node{opacity:.28}
.zb-bam-future .zb-leaf{opacity:.25}
.zb-bam-now .zb-culm-a{opacity:.28}
.zb-bam-now .zb-node{background:#2E5E4E;animation:zbGlow 2.4s ease-in-out infinite}
.zb-bam-now .zb-leaf{fill:#8FC16F}
.zb-bam-now .zb-leaf-l,.zb-bam-now .zb-leaf-r{display:block}
.zb-bam-now .zb-leaf-r{animation:zbIdleR 3.2s ease-in-out infinite}
.zb-bam-now .zb-leaf-l{animation:zbIdleL 3.2s ease-in-out infinite}
.zb-bam-row[data-on="true"] .zb-leaf-r{animation:zbSwayR .8s ease-in-out 2}
.zb-bam-row[data-on="true"] .zb-leaf-l{animation:zbSwayL .8s ease-in-out 2}
@keyframes zbGlow{0%,100%{box-shadow:0 0 0 3px rgba(143,193,111,.35),0 0 8px rgba(46,94,78,.35)}50%{box-shadow:0 0 0 6px rgba(143,193,111,.25),0 0 18px rgba(46,94,78,.6)}}
@keyframes zbIdleR{0%,100%{transform:rotate(-30deg)}50%{transform:rotate(-20deg)}}
@keyframes zbIdleL{0%,100%{transform:rotate(30deg)}50%{transform:rotate(20deg)}}
@keyframes zbSwayR{0%,100%{transform:rotate(-30deg)}30%{transform:rotate(0deg)}65%{transform:rotate(-44deg)}}
@keyframes zbSwayL{0%,100%{transform:rotate(30deg)}30%{transform:rotate(0deg)}65%{transform:rotate(44deg)}}
@keyframes zbWiggle{0%,100%{transform:rotate(0)}25%{transform:rotate(-10deg)}60%{transform:rotate(8deg)}}
button,a{-webkit-tap-highlight-color:transparent}
button,a[style*="min-height"]{transition:transform .2s cubic-bezier(.34,1.56,.64,1),box-shadow .2s ease,background-color .2s ease,border-color .2s ease,color .2s ease}
button:active,a[style*="min-height"]:active{transform:scale(.94);box-shadow:none;transition-duration:.06s}
.zb-bam-row button:active{transform:scale(.98)}
@media (hover:hover){
button:not([aria-expanded]):not([role="switch"]):not([role="checkbox"]):hover,a[style*="min-height"]:hover{transform:translateY(-2px);box-shadow:0 6px 14px rgba(46,94,78,.18)}
button[aria-expanded]:hover{background-color:rgba(46,94,78,.05) !important}
button[role="switch"]:hover,button[role="checkbox"]:hover{color:#2E5E4E !important}
.zb-nav-links a:not([aria-current]):hover{background:#E4EEE7 !important;color:#2E5E4E !important}
.zb-bam-row button:hover{transform:none;box-shadow:none}
.zb-bam-row:hover button[aria-pressed="false"]{background:#F1EDE4 !important}
.zb-bam-row:hover .zb-leaf-r{animation:zbSwayR .8s ease-in-out infinite}
.zb-bam-row:hover .zb-leaf-l{animation:zbSwayL .8s ease-in-out infinite}
.zb-bam-row:hover .zb-node{transform:scaleX(1.18)}
header svg:first-child:hover{animation:zbWiggle .6s ease-in-out}
}
@media (prefers-reduced-motion:reduce){
#dc-root *,x-dc *{animation:none !important;transition:none !important}
button:hover,button:active,a:hover,a:active{transform:none !important}
}
/*zb-ui-end*/
/*zb-col-start*/
.zb-col{max-width:768px !important;margin-left:auto !important;margin-right:auto !important}
@media (max-width:760px){.zb-col{padding:20px 16px 36px !important}}
.zb-bam-panel{display:flex;gap:8px;align-items:stretch}
.zb-bam-spine{cursor:default}
.zb-bam-spine .zb-culm-b{min-height:24px}
.zb-bam-body{flex:1;min-width:0;display:flex;flex-direction:column;gap:10px;padding:4px 0 16px}
.zb-acc{background:#FCFAF6;border:1px solid #E4DED2;border-radius:16px;overflow:hidden;transition:border-color .2s ease,box-shadow .2s ease}
.zb-acc[data-open="true"]{border-color:#B9CDBF;box-shadow:0 4px 14px rgba(46,94,78,.08)}
.zb-acc-head{width:100%;min-height:60px;display:flex;align-items:center;gap:12px;padding:12px 16px;background:transparent;border:0;font-family:inherit;color:#1F2A24;text-align:left;cursor:pointer}
.zb-acc-title{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.zb-acc-body{padding:0 16px 16px;display:flex;flex-direction:column;gap:12px}
.zb-chev{flex-shrink:0;transition:transform .32s cubic-bezier(.2,.8,.2,1)}
[aria-expanded="true"]>.zb-chev{transform:rotate(180deg)}
.zb-sec{display:flex;flex-direction:column;gap:12px}
.zb-sec-head{display:flex;flex-direction:column;gap:4px}
.zb-sec-head h2{margin:0;font-size:20px;font-weight:600}
.zb-sec-head p{margin:0;font-size:14px;color:#5F6B64;line-height:1.6}
.zb-list{display:flex;flex-direction:column;gap:10px}
@media (max-width:480px){.zb-acc-head{padding:12px 14px;gap:10px}.zb-acc-body{padding:0 14px 14px}}
@media (max-width:480px){[aria-labelledby="h-today"] article>span:nth-child(2){font-size:21px !important}}
.zb-list .zb-acc-body{border-top:1px solid #EFEAE0;padding-top:14px}
.zb-list ul.zb-acc-body>li:first-child{border-top:0 !important}
/*zb-col-end*/
/*zb-diary-start*/
.zb-date{display:flex;align-items:center;gap:2px;font-size:14px}
.zb-date button{background:transparent !important;border:0 !important;box-shadow:none !important;font-family:inherit;color:#1F2A24;cursor:pointer;padding:0}
.zb-date button:hover{transform:none !important}
.zb-date-arrow{width:40px;height:44px;border-radius:999px;font-size:24px;line-height:1}
.zb-date-arrow:hover{color:#2E5E4E}
.zb-date-arrow[aria-disabled="true"]{color:#D3CCBF;cursor:default}
.zb-date-pick{position:relative;display:inline-flex}
.zb-date-label{position:relative;min-height:44px;padding:0 4px !important;font-size:16px;font-weight:600;letter-spacing:.02em;transition:color .2s ease}
.zb-date-label::after{content:"";position:absolute;left:4px;right:4px;bottom:8px;height:2px;border-radius:2px;background:#2E5E4E;transform:scaleX(0);transform-origin:center;transition:transform .28s cubic-bezier(.34,1.56,.64,1)}
.zb-date-label:hover,.zb-date-label:focus-visible{color:#2E5E4E}
.zb-date-label:hover::after,.zb-date-label:focus-visible::after{transform:scaleX(1)}
.zb-date-label:active{transform:scale(.96) !important}
.zb-date-in{position:absolute;left:0;bottom:0;width:100%;height:100%;opacity:0;pointer-events:none;border:0;padding:0;margin:0}
.zb-past{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;background:#F6E9CC;color:#5A3A08;border-radius:12px;padding:10px 14px;font-size:14px;line-height:1.6}
.zb-past button{min-height:40px;padding:0 14px;border-radius:10px;border:1px solid #7A4F0B;background:transparent;color:#5A3A08;font-family:inherit;font-size:14px;font-weight:600;cursor:pointer}
.zb-rec{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
@media (max-width:560px){.zb-rec{grid-template-columns:repeat(2,minmax(0,1fr))}}
.zb-rec button.zb-tile{min-height:96px;padding:14px 16px;border:0 !important;border-radius:16px;background:#E4EEE7 !important;box-shadow:none !important;font-family:inherit;color:#1F2A24;text-align:left;display:flex;flex-direction:column;justify-content:space-between;gap:6px;cursor:pointer;transition:background-color .2s ease,transform .2s cubic-bezier(.34,1.56,.64,1)}
.zb-rec button.zb-tile:hover{background:#D3E4D8 !important;transform:translateY(-2px) !important}
.zb-rec button.zb-tile:active{transform:scale(.96) !important;transition-duration:.06s}
.zb-tile-name{font-size:20px;font-weight:600;color:#2E5E4E}
.zb-tile-last{font-size:13px;color:#4F5B54;font-variant-numeric:tabular-nums}
.zb-rec button.zb-tile[aria-pressed="true"]{background:#2E5E4E !important}
.zb-tile[aria-pressed="true"] .zb-tile-name{color:#FFFFFF}
.zb-tile[aria-pressed="true"] .zb-tile-last{color:#D9E5DC;font-weight:600}
.zb-field{display:flex;flex-direction:column;gap:10px}
.zb-fl{font-size:14px;font-weight:600}
.zb-text{min-height:48px;padding:0 14px;border-radius:12px;border:1px solid #E4DED2;background:#FFFFFF;font-family:inherit;font-size:16px;color:#1F2A24;width:100%;box-sizing:border-box}
.zb-text:focus{border-color:#2E5E4E;outline:none;box-shadow:0 0 0 3px rgba(46,94,78,.15)}
.zb-qopts{display:flex;flex-wrap:wrap;gap:8px}
.zb-qopt{touch-action:manipulation;min-height:40px;padding:0 14px;border-radius:999px;border:0;background:#E4EEE7;color:#2E5E4E;font-family:inherit;font-size:14px;font-weight:600;cursor:pointer;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.zb-qopt.zb-pressing{background:#F5E4E0;color:#8E3A33;transform:scale(.95)}
.zb-qadd{min-height:40px;padding:0 12px;border-radius:999px;border:1px dashed #9FBDAA;background:transparent;color:#2E5E4E;font-family:inherit;font-size:14px;cursor:pointer}
.zb-addrow{display:flex;gap:8px;align-items:center}
.zb-addrow .zb-text{flex:1;min-width:0}
.zb-add-ok,.zb-add-no{min-height:48px;padding:0 14px;border-radius:12px;font-family:inherit;font-size:14px;font-weight:600;cursor:pointer;flex-shrink:0}
.zb-add-ok{border:0;background:#2E5E4E;color:#fff}.zb-add-no{border:1px solid #E4DED2;background:transparent;color:#1F2A24}
.zb-hint{font-size:12px;color:#5F6B64}
.zb-times{display:flex;flex-wrap:wrap;gap:8px 28px}
.zb-tp{position:relative;display:flex;align-items:baseline;gap:10px}
.zb-tp-l{font-size:14px;font-weight:600;color:#5F6B64}
.zb-tp button{font-family:inherit;cursor:pointer}
.zb-tp button.zb-tp-v{position:relative;min-height:44px;padding:0 2px;border:0 !important;background:transparent !important;box-shadow:none !important;font-size:20px;font-weight:600;color:#1F2A24;font-variant-numeric:tabular-nums;transition:color .2s ease}
.zb-tp-v::after{content:"";position:absolute;left:2px;right:2px;bottom:8px;height:2px;border-radius:2px;background:#2E5E4E;transform:scaleX(0);transition:transform .28s cubic-bezier(.34,1.56,.64,1)}
.zb-tp button.zb-tp-v:hover,.zb-tp-v:focus-visible,.zb-tp-v[aria-expanded="true"]{color:#2E5E4E;transform:none !important}
.zb-tp-v:hover::after,.zb-tp-v:focus-visible::after,.zb-tp-v[aria-expanded="true"]::after{transform:scaleX(1)}
.zb-tp-pop{position:absolute;left:0;top:100%;z-index:30;margin-top:4px;background:#FCFAF6;border-radius:16px;box-shadow:0 12px 32px rgba(31,42,36,.16);padding:10px;display:flex;flex-direction:column;gap:8px;animation:zbTpIn .18s ease-out}
.zb-tp-cols{display:flex;align-items:center;gap:4px}
.zb-tp-col{position:relative;height:200px;overflow-y:auto;display:flex;flex-direction:column;gap:2px;padding:0 2px;scrollbar-width:none;overscroll-behavior:contain}
.zb-tp-col::-webkit-scrollbar{display:none}
.zb-tp button.zb-tp-o{flex-shrink:0;width:56px;min-height:40px;border:0 !important;border-radius:10px;background:transparent !important;box-shadow:none !important;font-size:17px;color:#3D4842;font-variant-numeric:tabular-nums}
.zb-tp button.zb-tp-o:hover{color:#2E5E4E;background:#E4EEE7 !important;transform:none !important}
.zb-tp button.zb-tp-o[aria-pressed="true"]{background:#2E5E4E !important;color:#FFFFFF;font-weight:600}
.zb-tp-sep{font-size:18px;font-weight:600;color:#5F6B64}
.zb-tp-act{display:flex;gap:4px;justify-content:flex-end;border-top:1px solid #EFEAE0;padding-top:8px}
.zb-tp-act button{min-height:40px;padding:0 12px;border:0 !important;border-radius:10px;background:transparent !important;box-shadow:none !important;font-size:14px;color:#2E5E4E;font-weight:600}
.zb-tp-act button:hover{background:#E4EEE7 !important;transform:none !important}
.zb-tp-act button.zb-tp-ok{background:#2E5E4E !important;color:#fff}
@keyframes zbTpIn{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.zb-tp-pop{animation:none}.zb-tp-v::after{transition:none}}
.zb-tips{background:#F1F6F2;border-radius:12px}
.zb-tips-head{width:100%;min-height:48px;padding:0 14px;display:flex;align-items:center;justify-content:space-between;gap:8px;border:0;background:transparent;font-family:inherit;font-size:14px;font-weight:600;color:#2E5E4E;cursor:pointer;text-align:left}
.zb-tips-head[aria-expanded="true"] .zb-chev{transform:rotate(180deg)}
.zb-tips-body{padding:0 14px 14px;display:flex;flex-direction:column;gap:8px}
.zb-tips-body p{margin:0;font-size:14px;line-height:1.7;color:#3D4842}
.zb-tips-body strong{display:block;font-size:13px;color:#1F2A24}
.zb-tips-links{display:flex;flex-wrap:wrap;gap:8px 16px}
.zb-tips-links a{font-size:13px;color:#2E5E4E;font-weight:600;min-height:32px;display:inline-flex;align-items:center}
.zb-edit{min-height:36px;padding:0 12px;border-radius:999px;border:1px solid #B9CDBF;background:transparent;color:#2E5E4E;font-family:inherit;font-size:13px;font-weight:600;cursor:pointer}
.zb-bar{height:100%;padding:0;border:0;background:transparent;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:4px;font-family:inherit;cursor:pointer;border-radius:8px 8px 0 0}
.zb-bar:hover{background:rgba(46,94,78,.06)}
.zb-toast{position:fixed;left:50%;bottom:20px;bottom:calc(20px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:880;width:min(520px,calc(100% - 32px));box-sizing:border-box;background:#1F2A24;color:#F6F2EA;border-radius:16px;padding:12px 12px 14px 16px;box-shadow:0 12px 32px rgba(31,42,36,.28);display:flex;flex-direction:column;gap:10px;overflow:hidden;animation:zbToastIn .32s cubic-bezier(.34,1.56,.64,1)}
@media (max-width:760px){.zb-toast{left:16px;right:86px;width:auto;transform:none;animation-name:zbToastInM}}
.zb-toast-row{display:flex;align-items:center;gap:10px}
.zb-toast-msg{flex:1;min-width:0;font-size:14px;line-height:1.5;display:flex;flex-direction:column}
.zb-toast-msg strong{font-size:15px;font-weight:600}
.zb-toast-undo{min-height:40px;padding:0 12px;border-radius:10px;border:0;background:transparent;color:#B7D3BE;font-family:inherit;font-size:14px;font-weight:600;cursor:pointer;flex-shrink:0}
.zb-toast-undo:hover{background:rgba(255,255,255,.08)}
.zb-toast-chips{display:flex;gap:8px;flex-wrap:wrap}
.zb-chip{min-height:40px;padding:0 14px;border-radius:999px;border:1px solid rgba(246,242,234,.35);background:transparent;color:#F6F2EA;font-family:inherit;font-size:14px;font-weight:600;cursor:pointer}
.zb-chip:hover{background:#F6F2EA;color:#1F2A24}
.zb-toast-bar{position:absolute;left:0;bottom:0;height:3px;width:100%;background:#8FC16F;transform-origin:left;animation:zbToastBar var(--ms,7000ms) linear forwards}
@keyframes zbToastIn{from{opacity:0;transform:translate(-50%,16px) scale(.96)}to{opacity:1;transform:translate(-50%,0)}}
@keyframes zbToastInM{from{opacity:0;transform:translateY(16px) scale(.96)}to{opacity:1;transform:none}}
@keyframes zbToastBar{from{transform:scaleX(1)}to{transform:scaleX(0)}}
@media (prefers-reduced-motion:reduce){.zb-toast{animation:none}.zb-toast-bar{display:none}.zb-rec button.zb-tile{transition:none}.zb-rec button.zb-tile:hover,.zb-rec button.zb-tile:active{transform:none !important}.zb-date-label::after{transition:none}}
/*zb-diary-end*/
</style>
<style>#dc-root>div{margin-left:auto;margin-right:auto}</style>
</head>
<body>
<template id="dc-tpl">
<div style="width: 100%; min-height: 2000px; box-sizing: border-box; background: #F6F2EA; font-family: 'Noto Sans TC', system-ui, sans-serif; color: #1F2A24">

<header style="border-bottom: 1px solid #E4DED2; background: #FCFAF6">
<div style="max-width: 1200px; margin: 0 auto; padding: 14px 24px; box-sizing: border-box; display: flex; align-items: center; justify-content: space-between; gap: 12px">
<div style="display: flex; align-items: center; gap: 10px">
<svg width="26" height="26" viewBox="0 0 28 28" aria-hidden="true"><circle cx="14" cy="14" r="13" fill="#2E5E4E"></circle><path d="M14 20V9M14 13c0-2.5 2-4 4.5-4M14 15.5c0-2.2-1.8-3.5-4-3.5" stroke="#F6F2EA" stroke-width="1.8" fill="none" stroke-linecap="round"></path></svg>
<span style="font-size: 17px; font-weight: 600; letter-spacing: 0.04em">竹寶</span>
</div>
<nav class="zb-nav-links" aria-label="主選單" style="display: flex; gap: 4px; flex-wrap: wrap">
<a href="index.html" style="min-height: 44px; display: flex; align-items: center; padding: 0 14px; border-radius: 10px; text-decoration: none; color: #5F6B64; font-size: 14px">主頁</a>
<a href="#" aria-current="page" style="min-height: 44px; display: flex; align-items: center; padding: 0 14px; border-radius: 10px; text-decoration: none; background: #E4EEE7; color: #2E5E4E; font-weight: 600; font-size: 14px">寶寶日記</a>
<a href="benefits.html" style="min-height: 44px; display: flex; align-items: center; padding: 0 14px; border-radius: 10px; text-decoration: none; color: #5F6B64; font-size: 14px">補助及其他福利</a>
<a href="childcare.html" style="min-height: 44px; display: flex; align-items: center; padding: 0 14px; border-radius: 10px; text-decoration: none; color: #5F6B64; font-size: 14px">托育</a>
<a href="activities.html" style="min-height: 44px; display: flex; align-items: center; padding: 0 14px; border-radius: 10px; text-decoration: none; color: #5F6B64; font-size: 14px">親子活動</a>
<a href="ask.html" style="min-height: 44px; display: flex; align-items: center; padding: 0 14px; border-radius: 10px; text-decoration: none; color: #5F6B64; font-size: 14px">AI 問答</a>
<a href="help.html" style="min-height: 44px; display: flex; align-items: center; padding: 0 14px; border-radius: 10px; text-decoration: none; color: #5F6B64; font-size: 14px">協助</a>
</nav>
<button type="button" class="zb-nav-toggle" aria-expanded="{{menuExpanded}}" aria-controls="zb-menu" onClick="{{toggleMenu}}" style="min-height: 44px; align-items: center; gap: 8px; padding: 0 14px; border-radius: 12px; border: 1px solid #E4DED2; background: #FCFAF6; font-family: inherit; font-size: 14px; color: #1F2A24; cursor: pointer"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="{{menuIcon}}"></path></svg>{{menuLabel}}</button>
</div>
<sc-if value="{{menuOpen}}" hint-placeholder-val="{{false}}">
<nav id="zb-menu" class="zb-nav-menu" aria-label="主選單" style="border-top: 1px solid #E4DED2; background: #FCFAF6; padding: 8px 16px 16px; display: flex; flex-direction: column">

<script>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { menuOpen: false, day: 6, edit: null, form: null, sel: {}, added: {}, toast: null, metric: 'sleep' };
    this._seq = 0;
    this._q = {}; try { this._q = JSON.parse(localStorage.getItem('zb-diary-quick') || '{}') || {}; } catch (e) { this._q = {}; }
    window.__zbDiary = this;
    this._t0 = Date.now();
  }
  renderVals() {
    const s = this.state;
    /* ---- 小工具 ---- */
    const pad = (n) => String(n).padStart(2, '0');
    const hm = (m) => pad(Math.floor(((m % 1440) + 1440) % 1440 / 60)) + ':' + pad(((m % 60) + 60) % 60);
    const toMin = (t) => +t.slice(0, 2) * 60 + +t.slice(3, 5);
    const dur = (m) => (m >= 60 ? Math.floor(m / 60) + ' 小時' : '') + (m % 60 ? (m >= 60 ? ' ' : '') + (m % 60) + ' 分' : '') || '不到 1 分';
    /* Demo 的「現在」：今天 11/14 16:53，打開頁面後照真實時間往後走，睡覺計時才會準 */
    const nowMin = () => 16 * 60 + 53 + Math.floor((Date.now() - this._t0) / 60000);
    const K = {
      feed: ['喝奶', '#2E5E4E', '#E4EEE7'], diaper: ['尿布', '#7A4F0B', '#F6E9CC'], sleep: ['睡眠', '#2F5470', '#E3ECF2'],
      temp: ['體溫', '#8E3A33', '#F5E4E0'], grow: ['身高體重', '#6B3655', '#F3E8EE'], note: ['筆記', '#56625B', '#ECE8E0']
    };
    /* ---- 日期：11/8 到今天 11/14 ---- */
    const WK = ['日', '一', '二', '三', '四', '五', '六'];
    const DATES = [0, 1, 2, 3, 4, 5, 6].map((i) => { const d = new Date(2026, 10, 8 + i); return { md: (d.getMonth() + 1) + '/' + d.getDate(), w: WK[d.getDay()] }; });
    const TODAY = 6;
    const isToday = s.day === TODAY;
    const dayShort = DATES[s.day].md;
    /* ---- 今天已經有的紀錄 ---- */
    const BASE = [
      { t: '02:30', k: 'feed', d: '配方奶 120 ml' }, { t: '05:50', k: 'sleep', d: '00:30–05:50・5 小時 20 分', min: 320 },
      { t: '06:10', k: 'feed', d: '配方奶 120 ml' }, { t: '07:00', k: 'diaper', d: '濕' },
      { t: '08:40', k: 'sleep', d: '07:20–08:40・1 小時 20 分', min: 80 }, { t: '09:30', k: 'feed', d: '親餵母乳 左右各 10 分鐘' },
      { t: '10:05', k: 'diaper', d: '濕＋便便・黃色' }, { t: '12:45', k: 'feed', d: '配方奶 120 ml' },
      { t: '13:00', k: 'diaper', d: '濕' }, { t: '15:10', k: 'sleep', d: '13:00–15:10・2 小時 10 分', min: 130 },
      { t: '15:20', k: 'diaper', d: '濕' }, { t: '16:00', k: 'feed', d: '親餵母乳 15 分鐘' }
    ];
    /* ---- 前 6 天的示範紀錄（依每天的睡眠時數、喝奶次數、濕尿布片數產生） ---- */
    const PAST = [
      { sl: 14.5, f: 7, w: 7, poo: ['黃色'] },
      { sl: 15, f: 8, w: 8, poo: ['黃色', '黃色'] },
      { sl: 13.5, f: 7, w: 6, poo: ['黃色'], grow: true },
      { sl: 14, f: 7, w: 7, poo: ['黃色'], note: true },
      { sl: 15.5, f: 6, w: 7, poo: ['綠色'] },
      { sl: 14.5, f: 7, w: 8, poo: ['黃色', '綠色'] }
    ];
    const gen = (i) => {
      const p = PAST[i], out = [];
      const sleepSeg = (a, m) => out.push({ t: hm(a + m), k: 'sleep', d: hm(a) + '–' + hm(a + m) + '・' + dur(m), min: m });
      sleepSeg(10, 170); sleepSeg(220, 130);
      const rest = Math.round(p.sl * 60) - 300, nap = Math.floor(rest / 4 / 10) * 10;
      [420, 630, 870, 1170].forEach((a, j) => sleepSeg(a, j < 3 ? nap : rest - nap * 3));
      const FS = ['03:10', '06:00', '09:30', '13:00', '17:00', '18:50', '22:10', '23:30'];
      const fs = p.f === 6 ? FS.filter((t) => t !== '18:50' && t !== '23:30') : p.f === 7 ? FS.slice(0, 7) : FS;
      fs.forEach((t, j) => out.push({ t, k: 'feed', d: j % 3 === 2 ? '親餵母乳 15 分鐘' : '配方奶 120 ml' }));
      const DS = ['03:15', '06:05', '09:35', '13:05', '17:05', '18:55', '22:15', '23:35'];
      DS.slice(0, p.w).forEach((t) => {
        const n = t === '09:35' ? 0 : t === '17:05' ? 1 : -1;
        out.push({ t, k: 'diaper', d: n >= 0 && p.poo[n] ? '濕＋便便・' + p.poo[n] : '濕' });

      const v = st[s.metric], on = i === s.day;
      return { v: String(v), day: i === TODAY ? '今天' : DATES[i].md, pressed: on ? 'true' : 'false',
        aria: (i === TODAY ? '今天' : DATES[i].md) + ' ' + ser.label + ' ' + v + ' ' + ser.unit,
        pick: () => this.setState({ day: i, edit: null, form: null }),
        style: 'display: block; width: 70%; max-width: 40px; border-radius: 6px 6px 0 0; height: ' + Math.round(Math.min(v, ser.max) / ser.max * 120) + 'px; background: ' + (on ? ser.color : '#8FB89A') };
    });
    const tabStyle = (on) => 'min-height: 36px; padding: 0 12px; border-radius: 999px; font-family: inherit; font-size: 13px; cursor: pointer; ' + (on ? 'background: #2E5E4E; color: #FFFFFF; border: 1px solid #2E5E4E; font-weight: 600' : 'background: #FFFFFF; color: #1F2A24; border: 1px solid #E4DED2');
    const metricTabs = Object.keys(SERIES).map((k) => ({ label: SERIES[k].label, pressed: s.metric === k ? 'true' : 'false', style: tabStyle(s.metric === k), pick: () => this.setState({ metric: k }) }));
    let lastGrow = null;
    const num = (re, d) => { const m = re.exec(d); return m ? m[1] : ''; };
    [0, 1, 2, 3, 4, 5, 6].forEach((i) => addedOf(i).forEach((e) => {
      if (e.k !== 'grow') return; const d = textOf(e), rest = d.replace(/頭圍\s*\d+(?:\.\d+)?\s*(cm|公分)?/, '');
      const g = { h: num(/(\d+(?:\.\d+)?)\s*(?:cm|公分)/, rest), w: num(/(\d+(?:\.\d+)?)\s*(?:kg|公斤)/i, d), hc: num(/頭圍\s*(\d+(?:\.\d+)?)/, d) };
      if (g.h || g.w || g.hc) lastGrow = { e, i, g: Object.assign({}, lastGrow ? lastGrow.g : {}, Object.fromEntries(Object.entries(g).filter((kv) => kv[1]))) };
    }));
    const growH = ((lastGrow && lastGrow.g.h) || '58') + ' cm';
    const growW = ((lastGrow && lastGrow.g.w) || '5.6') + ' kg';
    const growHC = ((lastGrow && lastGrow.g.hc) || '39') + ' cm';
    const growNote = lastGrow ? '剛剛記錄' : '約第 50 百分位';
    const growDate = lastGrow ? DATES[lastGrow.i].md + ' ' + lastGrow.e.t + ' 記錄' : '11/10 兒童健檢時量測';

    /* ---- 提示列 ---- */
    const toast = s.toast;
    const undo = () => {
      if (!toast) return;
      clearToastTimer();
      if (toast.undo) this.setState({ added: Object.assign({}, s.added, { [toast.undo.day]: toast.undo.list }), toast: null, edit: null });
      else this.setState({ toast: null });
    };
    const dayLabel = (isToday ? '今天 ' : '') + dayShort + '（' + DATES[s.day].w + '）';
    const dayIso = '2026-11-' + pad(8 + s.day);
    return {
      menuOpen: !!s.menuOpen, menuExpanded: s.menuOpen ? 'true' : 'false',
      menuLabel: s.menuOpen ? '關閉' : '選單', menuIcon: s.menuOpen ? 'M6 6l12 12M18 6 6 18' : 'M4 7h16M4 12h16M4 17h16',
      toggleMenu: () => this.setState({ menuOpen: !s.menuOpen }),
      dayLabel, dayShort, isPast: !isToday, goToday: () => this.setState({ day: TODAY, edit: null, form: null }),
      prevDisabled: s.day === 0 ? 'true' : 'false', nextDisabled: isToday ? 'true' : 'false',
      prevDay: () => { if (s.day > 0) this.setState({ day: s.day - 1, edit: null, form: null }); },
      nextDay: () => { if (s.day < TODAY) this.setState({ day: s.day + 1, edit: null, form: null }); },
      dayIso: dayIso, dayAria: '選擇日期，目前是' + dayLabel,
      openPicker: () => {
        const el = document.getElementById('zb-date-in'); if (!el) return;
        el.value = dayIso;
        try { if (el.showPicker) { el.showPicker(); return; } } catch (err) { /* 不支援時改用 focus */ }
        el.focus(); el.click();
      },
      pickDate: (e) => {
        const v = e.target.value; const m = /^2026-11-(\d{2})$/.exec(v || '');
        const i = m ? +m[1] - 8 : -1;
        if (i >= 0 && i <= TODAY) this.setState({ day: i, edit: null, form: null });
        else e.target.value = dayIso;
      },
      recItems,
      ...formVals,
      formOpen: !!formKind, formTitle: editing ? '補充' + K[editing.k][0] + '・' + editing.t : (formKind ? '記錄' + K[formKind][0] : ''),
      formWarn, save, closeForm: () => this.setState({ form: null, edit: null, sel: {}, addOpt: false, tp: null }),
      alerts: alertsOut, summary, log, logEmpty: log.length === 0, bars, metricTabs,
      sumTitle: isToday ? '今天到目前' : dayShort + ' 一整天', logTitle: isToday ? '今天的紀錄' : dayShort + ' 的紀錄',
      chartLabel: '最近 7 天' + ser.label + '（' + ser.unit + '）', chartNote: ser.label + '（' + ser.unit + '）・' + ser.note + '點長條可以看那一天。',
      growth: [ { label: '身高', value: growH, pct: growNote }, { label: '體重', value: growW, pct: growNote }, { label: '頭圍', value: growHC, pct: lastGrow ? '剛剛記錄' : '健檢時量測' } ], growDate,
      toastOn: !!toast, toastMs: toast ? toast.ms : 0, toastKey: toast ? 't' + toast.key : '', toastTitle: toast ? toast.title : '', toastSub: toast ? toast.sub : '',
      toastChips: toast ? toast.chips : [], toastHasChips: !!(toast && toast.chips.length), undo, undoLabel: toast && toast.undo ? '復原' : '關閉'
    };
  }
}

const __rv = Component.prototype.renderVals;
Component.prototype.renderVals = function () {
  const v = __rv.call(this); const s = this.state; const LIMIT = 4;
  v.logShown = s.logAll ? v.log : v.log.slice(0, LIMIT);
  v.logMore = v.log.length > LIMIT; v.logExpanded = s.logAll ? 'true' : 'false';
  v.logLabel = s.logAll ? '收合' : '看全部 ' + v.log.length + ' 筆';
  v.toggleLog = () => this.setState({ logAll: !s.logAll });
  return v;
};
window.Component = Component;
/* 快捷選項長按刪除 */
(function () {
  let timer = null, fired = false, btn = null;
  const stop = () => { if (timer) clearTimeout(timer); timer = null; if (btn) btn.classList.remove('zb-pressing'); btn = null; };
  document.addEventListener('pointerdown', (e) => {
    const b = e.target.closest && e.target.closest('.zb-qopt'); if (!b) return;
    stop(); fired = false; btn = b;
    timer = setTimeout(() => { fired = true; const c = window.__zbDiary; const k = b.getAttribute('data-qk'), v = b.getAttribute('data-qv'); stop(); if (navigator.vibrate) navigator.vibrate(20); if (c && c.delOpt) c.delOpt(k, v); }, 550);
    setTimeout(() => { if (btn === b) b.classList.add('zb-pressing'); }, 200);
  });
  ['pointerup', 'pointercancel'].forEach((t) => document.addEventListener(t, stop, true));
  document.addEventListener('pointerleave', (e) => { if (btn && e.target === btn) stop(); }, true);
  document.addEventListener('click', (e) => { if (fired && e.target.closest && e.target.closest('.zb-qopt')) { e.stopImmediatePropagation(); e.preventDefault(); fired = false; } }, true);
  document.addEventListener('contextmenu', (e) => { if (e.target.closest && e.target.closest('.zb-qopt')) e.preventDefault(); });
})();
</script>
