<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>竹寶・補助及其他福利</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;600&amp;display=swap">
<style>
body{margin:0;background:#F6F2EA}
a{color:#2E5E4E}a:hover{color:#1F4337}
button:focus-visible,a:focus-visible{outline:2px solid #2E5E4E;outline-offset:2px}
.zb-nav-toggle{display:none}
@media (max-width: 760px){.zb-nav-links{display:none !important}.zb-nav-toggle{display:inline-flex !important}}
@media (min-width: 761px){.zb-nav-menu{display:none !important}}
</style>
<style>#dc-root>div{margin-left:auto;margin-right:auto}</style>
</head>
<body>
<template id="dc-tpl">
<div style="width: 100%; min-height: 1180px; box-sizing: border-box; background: #F6F2EA; font-family: 'Noto Sans TC', system-ui, sans-serif; color: #1F2A24">

<header style="border-bottom: 1px solid #E4DED2; background: #FCFAF6">
<div style="max-width: 1360px; margin: 0 auto; padding: 16px 32px; box-sizing: border-box; display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap">
<div style="display: flex; align-items: center; gap: 10px">
<svg width="28" height="28" viewBox="0 0 28 28" aria-hidden="true"><circle cx="14" cy="14" r="13" fill="#2E5E4E"></circle><path d="M14 20V9M14 13c0-2.5 2-4 4.5-4M14 15.5c0-2.2-1.8-3.5-4-3.5" stroke="#F6F2EA" stroke-width="1.8" fill="none" stroke-linecap="round"></path></svg>
<span style="font-size: 18px; font-weight: 600; letter-spacing: 0.04em">竹寶</span>
<span style="font-size: 13px; color: #5F6B64; margin-left: 8px">新竹市生養時程</span>
</div>
<nav class="zb-nav-links" aria-label="主選單" style="display: flex; gap: 4px; flex-wrap: wrap">
<a href="index.html" style="min-height: 44px; display: flex; align-items: center; padding: 0 14px; border-radius: 10px; text-decoration: none; color: #5F6B64; font-size: 14px">主頁</a>
<a href="diary.html" style="min-height: 44px; display: flex; align-items: center; padding: 0 14px; border-radius: 10px; text-decoration: none; color: #5F6B64; font-size: 14px">寶寶日記</a>
<a href="#" aria-current="page" style="min-height: 44px; display: flex; align-items: center; padding: 0 14px; border-radius: 10px; text-decoration: none; background: #E4EEE7; color: #2E5E4E; font-weight: 600; font-size: 14px">補助及其他福利</a>
<a href="childcare.html" style="min-height: 44px; display: flex; align-items: center; padding: 0 14px; border-radius: 10px; text-decoration: none; color: #5F6B64; font-size: 14px">托育</a>
<a href="activities.html" style="min-height: 44px; display: flex; align-items: center; padding: 0 14px; border-radius: 10px; text-decoration: none; color: #5F6B64; font-size: 14px">親子活動</a>
<a href="ask.html" style="min-height: 44px; display: flex; align-items: center; padding: 0 14px; border-radius: 10px; text-decoration: none; color: #5F6B64; font-size: 14px">AI 問答</a>
<a href="help.html" style="min-height: 44px; display: flex; align-items: center; padding: 0 14px; border-radius: 10px; text-decoration: none; color: #5F6B64; font-size: 14px">協助</a>
</nav>
<button type="button" class="zb-nav-toggle" aria-expanded="{{menuExpanded}}" aria-controls="zb-menu" onClick="{{toggleMenu}}" style="min-height: 44px; align-items: center; gap: 8px; padding: 0 14px; border-radius: 12px; border: 1px solid #E4DED2; background: #FCFAF6; font-family: inherit; font-size: 14px; color: #1F2A24; cursor: pointer"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="{{menuIcon}}"></path></svg>{{menuLabel}}</button>
</div>
<sc-if value="{{menuOpen}}" hint-placeholder-val="{{false}}">
<nav id="zb-menu" class="zb-nav-menu" aria-label="主選單" style="border-top: 1px solid #E4DED2; background: #FCFAF6; padding: 8px 16px 16px; display: flex; flex-direction: column">
<a href="index.html" style="min-height: 52px; display: flex; align-items: center; padding: 0 14px; border-radius: 12px; text-decoration: none; color: #1F2A24; font-size: 16px; border-bottom: 1px solid #EFEAE0">主頁</a>
<a href="diary.html" style="min-height: 52px; display: flex; align-items: center; padding: 0 14px; border-radius: 12px; text-decoration: none; color: #1F2A24; font-size: 16px; border-bottom: 1px solid #EFEAE0">寶寶日記</a>
<a href="#" aria-current="page" style="min-height: 52px; display: flex; align-items: center; justify-content: space-between; padding: 0 14px; border-radius: 12px; text-decoration: none; background: #E4EEE7; color: #2E5E4E; font-weight: 600; font-size: 16px">補助及其他福利<span style="font-size: 12px; font-weight: 400">目前位置</span></a>
<a href="childcare.html" style="min-height: 52px; display: flex; align-items: center; padding: 0 14px; border-radius: 12px; text-decoration: none; color: #1F2A24; font-size: 16px; border-bottom: 1px solid #EFEAE0">托育</a>
<a href="activities.html" style="min-height: 52px; display: flex; align-items: center; padding: 0 14px; border-radius: 12px; text-decoration: none; color: #1F2A24; font-size: 16px; border-bottom: 1px solid #EFEAE0">親子活動</a>
<a href="ask.html" style="min-height: 52px; display: flex; align-items: center; padding: 0 14px; border-radius: 12px; text-decoration: none; color: #1F2A24; font-size: 16px; border-bottom: 1px solid #EFEAE0">AI 問答</a>
<a href="help.html" style="min-height: 52px; display: flex; align-items: center; padding: 0 14px; border-radius: 12px; text-decoration: none; color: #1F2A24; font-size: 16px; border-bottom: 1px solid #EFEAE0">協助</a>
</nav>
</sc-if>
</header>

<div style="max-width: 1360px; margin: 0 auto; padding: 28px 32px 40px; box-sizing: border-box; display: flex; flex-direction: column; gap: 24px">

<div style="display: flex; justify-content: space-between; align-items: flex-end; gap: 16px; flex-wrap: wrap">
<div>
<h1 style="margin: 0; font-size: 28px; font-weight: 600; line-height: 1.3">寶寶 2 個月 4 天</h1>
<div style="font-size: 14px; color: #5F6B64; margin-top: 6px">2026/9/10 出生・北區・第 1 胎・自己或家人照顧　<a href="setup.html">修改資料</a></div>
</div>
<div style="display: flex; gap: 8px; flex-wrap: wrap">
<sc-for list="{{counts}}" as="c" hint-placeholder-count="4">
<span style="{{c.style}}"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{c.icon}}"></path></svg>{{c.text}}</span>
</sc-for>
</div>
</div>

<div style="display: flex; flex-wrap: wrap; gap: 24px; align-items: flex-start">

<section aria-label="年齡階段" style="flex: 1 1 260px; max-width: 320px; min-width: 0; background: #FCFAF6; border: 1px solid #E4DED2; border-radius: 16px; padding: 20px 16px">
<h2 style="margin: 0 0 12px 4px; font-size: 14px; font-weight: 600; color: #5F6B64; letter-spacing: 0.06em">依寶寶年齡</h2>
<sc-for list="{{stages}}" as="st" hint-placeholder-count="5">
<div style="display: grid; grid-template-columns: 24px minmax(0, 1fr); column-gap: 10px">
<div style="display: flex; flex-direction: column; align-items: center">
<div style="width: 2px; height: 18px; background: {{st.lineTop}}"></div>
<div style="{{st.dotStyle}}"></div>
<div style="width: 2px; flex-grow: 1; min-height: 18px; background: {{st.lineBottom}}"></div>
</div>
<button type="button" onClick="{{st.select}}" aria-pressed="{{st.pressed}}" style="{{st.btnStyle}}">
<span style="display: flex; align-items: center; gap: 8px; flex-wrap: wrap"><span style="font-size: 15px; font-weight: 600; color: {{st.titleColor}}">{{st.title}}</span><sc-if value="{{st.isNow}}" hint-placeholder-val="{{false}}"><span style="font-size: 11px; font-weight: 600; color: #FFFFFF; background: #2E5E4E; border-radius: 999px; padding: 1px 8px">現在</span></sc-if></span>
<span style="font-size: 12px; color: #5F6B64">{{st.range}}・{{st.countText}}</span>
</button>
</div>
</sc-for>
</section>

<section aria-label="補助與福利" style="flex: 999 1 520px; min-width: 0; display: flex; flex-direction: column; gap: 12px">
<div style="display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap">
<h2 style="margin: 0; font-size: 20px; font-weight: 600">{{sel.title}}的補助與福利</h2>
<span style="font-size: 13px; color: #5F6B64">{{sel.range}}</span>
</div>
<sc-if value="{{sel.empty}}" hint-placeholder-val="{{false}}"><p style="margin: 0; font-size: 14px; color: #5F6B64; background: #FCFAF6; border: 1px solid #E4DED2; border-radius: 16px; padding: 20px">這個階段的項目已經結束，沒有需要處理的事。</p></sc-if>
<sc-for list="{{sel.items}}" as="it" hint-placeholder-count="4">
<div style="background: #FCFAF6; border: 1px solid #E4DED2; border-radius: 16px; overflow: hidden">
<button type="button" onClick="{{it.toggle}}" aria-expanded="{{it.expanded}}" style="width: 100%; min-height: 68px; display: flex; align-items: center; gap: 16px; padding: 16px 20px; background: transparent; border: 0; text-align: left; font-family: inherit; color: inherit; cursor: pointer">
<div style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px">
<span style="font-size: 16px; font-weight: 600">{{it.name}}</span>
<span style="font-size: 13px; color: #5F6B64; font-variant-numeric: tabular-nums">{{it.meta}}</span>
</div>
<span style="{{it.pillStyle}}"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{it.icon}}"></path></svg>{{it.label}}</span>
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#5F6B64" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{it.chev}}"></path></svg>
</button>
<sc-if value="{{it.open}}" hint-placeholder-val="{{false}}">
<div style="border-top: 1px solid #E4DED2; padding: 18px 20px 20px; display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 20px">
<div style="display: flex; flex-direction: column; gap: 12px">
<div style="display: flex; flex-direction: column; gap: 6px">
<span style="align-self: flex-start; font-size: 11px; font-weight: 600; color: #2F5470; background: #E3ECF2; border-radius: 999px; padding: 2px 8px">AI 說明</span>
<span style="font-size: 13px; font-weight: 600; color: #5F6B64; margin-top: 4px">補助什麼</span>
<p style="margin: 0; font-size: 14px; line-height: 1.75">{{it.what}}</p>
<span style="font-size: 13px; font-weight: 600; color: #5F6B64; margin-top: 6px">重要資訊</span>
<ul style="margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 4px; font-size: 14px; line-height: 1.7">
<sc-for list="{{it.points}}" as="pt" hint-placeholder-count="3"><li>{{pt.t}}</li></sc-for>
</ul>
</div>
</div>
<div style="display: flex; flex-direction: column; gap: 12px; justify-content: space-between">
<dl style="margin: 0; display: grid; grid-template-columns: 72px minmax(0, 1fr); row-gap: 8px; font-size: 13px">
<dt style="color: #5F6B64">來源</dt><dd style="margin: 0"><a href="{{it.srcUrl}}">{{it.srcTitle}}</a></dd>
</dl>
<sc-if value="{{it.showCta}}" hint-placeholder-val="{{true}}">
<a href="{{it.srcUrl}}" style="min-height: 46px; display: flex; align-items: center; justify-content: center; gap: 8px; border-radius: 12px; background: #2E5E4E; color: #FFFFFF; font-size: 15px; font-weight: 600; text-decoration: none">{{it.cta}}<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 17 17 7M8 7h9v9"></path></svg></a>
</sc-if>
</div>
</div>
</sc-if>
</div>
</sc-for>
</section>

<aside aria-label="這個階段的資源" style="flex: 1 1 280px; max-width: 360px; min-width: 0; display: flex; flex-direction: column; gap: 16px">
<div style="background: #FCFAF6; border: 1px solid #E4DED2; border-radius: 16px; padding: 20px; display: flex; flex-direction: column; gap: 4px">
<h2 style="margin: 0 0 8px; font-size: 16px; font-weight: 600">這個階段的資源</h2>
<sc-if value="{{sel.noRes}}" hint-placeholder-val="{{false}}"><p style="margin: 0; font-size: 13px; color: #5F6B64">這個階段暫無整理好的資源。</p></sc-if>
<sc-for list="{{sel.resources}}" as="r" hint-placeholder-count="3">
<div style="display: flex; flex-direction: column; gap: 4px; padding: 12px 0; border-bottom: 1px solid #E4DED2">
<span style="align-self: flex-start; font-size: 12px; color: #2E5E4E; background: #E4EEE7; border-radius: 999px; padding: 2px 10px">{{r.tag}}</span>
<span style="font-size: 14px; line-height: 1.6">{{r.text}}</span>
<sc-if value="{{r.url}}" hint-placeholder-val="{{false}}"><a href="{{r.url}}" style="font-size: 12px">{{r.src}}</a></sc-if>
</div>
</sc-for>
</div>
<div style="background: #FCFAF6; border: 1px solid #E4DED2; border-radius: 16px; padding: 20px; display: flex; flex-direction: column; gap: 12px">
<h2 style="margin: 0; font-size: 16px; font-weight: 600">問問竹寶</h2>
<p style="margin: 0; font-size: 13px; line-height: 1.6; color: #5F6B64">只引用衛福部、國健署與新竹市政府資料，回答會附出處。</p>
<div style="display: flex; flex-direction: column; gap: 8px">
<a href="ask.html" style="min-height: 44px; display: flex; align-items: center; padding: 0 14px; border: 1px solid #E4DED2; border-radius: 12px; font-size: 14px; color: #1F2A24; text-decoration: none">生育津貼要帶哪些文件？</a>
<a href="ask.html" style="min-height: 44px; display: flex; align-items: center; padding: 0 14px; border: 1px solid #E4DED2; border-radius: 12px; font-size: 14px; color: #1F2A24; text-decoration: none">送托之後育兒津貼會停嗎？</a>
<a href="ask.html" style="min-height: 44px; display: flex; align-items: center; padding: 0 14px; border: 1px solid #E4DED2; border-radius: 12px; font-size: 14px; color: #1F2A24; text-decoration: none">寶寶發燒半夜可以去哪裡？</a>
</div>
</div>
</aside>

</div>

<section aria-labelledby="h-other" style="background: #FCFAF6; border: 1px solid #E4DED2; border-radius: 16px; padding: 20px; display: flex; flex-direction: column; gap: 14px">
<div style="display: flex; flex-direction: column; gap: 4px">
<h2 id="h-other" style="margin: 0; font-size: 20px; font-weight: 600">其他福利與親子空間</h2>
<p style="margin: 0; font-size: 13px; line-height: 1.6; color: #5F6B64">不分寶寶年齡、隨時可以使用的新竹市服務。</p>
</div>
<div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 12px">
<sc-for list="{{others}}" as="o" hint-placeholder-count="6">
<article style="background: #FFFFFF; border: 1px solid #E4DED2; border-left: 4px solid #2E5E4E; border-radius: 14px; padding: 16px; display: flex; flex-direction: column; gap: 8px">
<div style="display: flex; justify-content: space-between; align-items: flex-start; gap: 8px">
<h3 style="margin: 0; font-size: 16px; font-weight: 600; line-height: 1.4">{{o.name}}</h3>
<span style="flex-shrink: 0; font-size: 12px; color: #2E5E4E; background: #E4EEE7; border-radius: 999px; padding: 3px 10px">{{o.tag}}</span>
</div>
<dl style="margin: 0; display: grid; grid-template-columns: auto 1fr; gap: 4px 10px; font-size: 13px; line-height: 1.6">
<dt style="color: #5F6B64">對象</dt><dd style="margin: 0">{{o.who}}</dd>
<dt style="color: #5F6B64">內容</dt><dd style="margin: 0">{{o.what}}</dd>
<dt style="color: #5F6B64">地點</dt><dd style="margin: 0">{{o.where}}</dd>
</dl>
<p style="margin: 0; font-size: 13px; line-height: 1.6; color: #5F6B64">{{o.note}}</p>
<a href="{{o.url}}" style="margin-top: auto; min-height: 44px; display: inline-flex; align-items: center; justify-content: center; border-radius: 12px; background: #2E5E4E; color: #FFFFFF; font-size: 14px; font-weight: 600; text-decoration: none">{{o.cta}}</a>
</article>
</sc-for>
</div>
</section>

<p style="margin: 0; font-size: 12px; line-height: 1.6; color: #5F6B64; border-top: 1px solid #E4DED2; padding-top: 16px">資格由官方規則判定，AI 只負責白話說明。結果僅供參考，最終資格以主管機關審核為準。</p>

</div>
</div>
</template>
<div id="dc-root"></div>
<script src="zhubao-runtime.js"></script>
<script>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { menuOpen: false, residency: null, lowIncome: null, stage: 's0', open: 'birthHC' };
  }
  renderVals() {
    const s = this.state;
    const ICON = {
      ok: 'M20 6 9 17l-5-5',
      check: 'M9.1 9a3 3 0 0 1 5.8 1c0 2-3 2-3 4M12 18h.01',
      no: 'M5 12h14',
      auto: 'M12 4v11m0 0 4-4m-4 4-4-4M4 20h16',
      expired: 'M12 7v5l3 2M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0'
    };
    const PILL = {
      ok: ['#E4EEE7', '#2E5E4E', '符合'],
      check: ['#F6E9CC', '#7A4F0B', '需確認'],
      no: ['#ECE8E0', '#56625B', '不符合'],
      auto: ['#E3ECF2', '#2F5470', '自動入帳'],
      expired: ['#F5E4E0', '#8E3A33', '已過期限']
    };
    const pill = (k) => 'display: inline-flex; align-items: center; gap: 4px; flex-shrink: 0; font-size: 12px; font-weight: 600; padding: 4px 10px; border-radius: 999px; white-space: nowrap; background: ' + PILL[k][0] + '; color: ' + PILL[k][1];
    const SRC = {
      civil: ['新竹市民政處・生育津貼', 'https://dep-civil.hccg.gov.tw/ch/home.jsp?id=272&parentpath=0%2C4%2C51', ''],
      dosi: ['衛福部社會保險司 115/5', 'https://dep.mohw.gov.tw/DOSI/cp-3544-86293-102.html', ''],
      lawLow: ['新竹市低收入戶產婦及嬰兒營養費補助辦法', 'https://law.hccg.gov.tw/LawContent.aspx?id=FL086082', ''],
      hpaPost: ['國健署・產後健康照護 115/6', 'https://www.hpa.gov.tw/Pages/Detail.aspx?nodeid=4996&pid=19790', ''],
      hpaChild: ['國健署・兒童免費健康檢查', 'https://www.hpa.gov.tw/Pages/List.aspx?nodeid=202', ''],
      cdc: ['疾管署・兒童預防接種時程 115/7', 'https://www.cdc.gov.tw/Category/Page/TxRW-x3WzvPhvEtxM628GA', ''],
      allow: ['新竹市政府・育兒津貼申辦公告', 'https://www.hccg.gov.tw/hccg/app/data/view?module=news&id=30122&serno=168fff14-5734-45d5-9823-44254b02e80c', ''],
      temp: ['新竹市社會處・臨托服務', 'https://society.hccg.gov.tw/ch/home.jsp?id=10376&parentpath=&mcustomize=onemessages_view.jsp&toolsflag=Y&dataserno=202503110001&t=SocietyOnes&mserno=201907010005', ''],
      quasi: ['新竹市社會處・準公共化專區', 'https://society.hccg.gov.tw/ch/home.jsp?id=10330&parentpath=0%2C3%2C20', '']
    };
    const yn = (v) => v === true ? 'ok' : v === false ? 'no' : 'check';
    const ITEMS = {
      birthHC: { name: '新竹市生育津貼', meta: '每胎 30,000 元・戶政事務所', status: yn(s.residency), src: 'civil', cta: '查看官方說明',
        desc: '父或母須設籍新竹市，寶寶出生後向戶政事務所申請。',
        questions: s.residency === null ? [{ text: '父或母是否設籍新竹市？', yes: () => this.setState({ residency: true }), no: () => this.setState({ residency: false }) }] : [] },
      centralTop: { name: '中央生育補助', meta: '115/1/1 起生產・每胎 10 萬元', status: 'auto', src: 'dosi', cta: '',
        desc: '有參加社會保險的人不用另外申請。參加國民年金或沒有參加社會保險的媽媽，可以在戶政事務所辦出生登記時一併申請，也可以線上或向勞保局申請。' },

    };
