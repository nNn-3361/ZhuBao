<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FCFAF6">
<script src="zhubao-family.js"></script>
<script src="zhubao-app.js"></script>
<title>竹寶・補助及其他福利</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;600&amp;display=swap">
<style>
body{margin:0;background:#F6F2EA}
a{color:#2E5E4E}a:hover{color:#1F4337}
button:focus-visible,a:focus-visible{outline:2px solid #2E5E4E;outline-offset:2px}
.zb-nav-toggle{display:none}
@media (max-width: 760px){.zb-nav-links{display:none !important}.zb-nav-toggle{display:inline-flex !important}}
@media (min-width: 761px){.zb-nav-menu{display:none !important}}
.zb-res-item:last-child{border-bottom:0 !important}
@media (max-width: 760px){.zb-ben-wrap{padding:20px 16px 32px !important}}
/*zb-ui-start*/
.zb-bam-row{display:flex;gap:8px;align-items:stretch}
.zb-bam-row>button{flex:1;min-width:0}
.zb-bam{position:relative;width:40px;flex-shrink:0;display:flex;flex-direction:column;align-items:center;cursor:pointer}
.zb-culm{width:12px;flex-shrink:0;background:linear-gradient(90deg,#4F8065 0%,#80AE8F 45%,#5E8F73 100%)}
.zb-culm-a{height:26px}
.zb-culm-b{flex:1 1 auto;min-height:12px}
.zb-node{width:20px;height:7px;border-radius:4px;background:#3F6F57;flex-shrink:0;position:relative;z-index:1;transition:transform .25s cubic-bezier(.23,1,.32,1)}
.zb-bam-top .zb-culm-a{border-radius:6px 6px 0 0;height:20px;margin-top:6px}
.zb-bam-bottom .zb-culm-b{border-radius:0 0 3px 3px}
.zb-leaf{position:absolute;top:23px;width:26px;height:12px;fill:#6F9A82;pointer-events:none}
.zb-leaf-r{left:24px;transform-origin:left center;transform:rotate(-30deg)}
.zb-leaf-l{right:24px;transform-origin:right center;transform:rotate(30deg);display:none}
.zb-alt .zb-leaf-r{display:none}.zb-alt .zb-leaf-l{display:block}
.zb-bam-future .zb-culm,.zb-bam-future .zb-node{opacity:.28}
.zb-bam-future .zb-leaf{opacity:.25}
.zb-bam-now .zb-culm-a{opacity:.28}
.zb-bam-now .zb-node{background:#2E5E4E;animation:zbGlow 2.4s ease-in-out infinite}
.zb-bam-now .zb-leaf{fill:#8FC16F}
.zb-bam-now .zb-leaf-l,.zb-bam-now .zb-leaf-r{display:block}
.zb-bam-now .zb-leaf-r{animation:zbIdleR 3.2s ease-in-out infinite}
.zb-bam-now .zb-leaf-l{animation:zbIdleL 3.2s ease-in-out infinite}
.zb-bam-row[data-on="true"] .zb-leaf-r{animation:zbSwayR .8s ease-in-out 2}
.zb-bam-row[data-on="true"] .zb-leaf-l{animation:zbSwayL .8s ease-in-out 2}
@keyframes zbGlow{0%,100%{box-shadow:0 0 0 3px rgba(143,193,111,.35),0 0 8px rgba(46,94,78,.35)}50%{box-shadow:0 0 0 6px rgba(143,193,111,.25),0 0 18px rgba(46,94,78,.6)}}
@keyframes zbIdleR{0%,100%{transform:rotate(-30deg)}50%{transform:rotate(-20deg)}}
@keyframes zbIdleL{0%,100%{transform:rotate(30deg)}50%{transform:rotate(20deg)}}
@keyframes zbSwayR{0%,100%{transform:rotate(-30deg)}30%{transform:rotate(0deg)}65%{transform:rotate(-44deg)}}
@keyframes zbSwayL{0%,100%{transform:rotate(30deg)}30%{transform:rotate(0deg)}65%{transform:rotate(44deg)}}
@keyframes zbWiggle{0%,100%{transform:rotate(0)}25%{transform:rotate(-10deg)}60%{transform:rotate(8deg)}}
*{-webkit-tap-highlight-color:transparent}
button,a[style*="min-height"]{transition:transform .2s cubic-bezier(.23,1,.32,1),box-shadow .2s ease,background-color .2s ease,border-color .2s ease,color .2s ease}
button:active,a[style*="min-height"]:active{transform:scale(.97);box-shadow:none;transition-duration:.1s}
.zb-bam-row button:active{transform:none}
@media (hover:hover){
button:not([aria-expanded]):not([role="switch"]):not([role="checkbox"]):hover,a[style*="min-height"]:hover{transform:translateY(-2px);box-shadow:0 6px 14px rgba(46,94,78,.18)}
button[aria-expanded]:hover .zb-chev{stroke:#2E5E4E}
button[role="switch"]:hover,button[role="checkbox"]:hover{color:#2E5E4E !important}
.zb-nav-links a:not([aria-current]):hover{background:#E4EEE7 !important;color:#2E5E4E !important}
.zb-bam-row button:hover{transform:none;box-shadow:none}
.zb-bam-row:hover button[aria-pressed="false"]{background:#F1EDE4 !important}
.zb-bam-row:hover .zb-leaf-r{animation:zbSwayR .8s ease-in-out infinite}
.zb-bam-row:hover .zb-leaf-l{animation:zbSwayL .8s ease-in-out infinite}
.zb-bam-row:hover .zb-node{transform:scaleX(1.18)}
header svg:first-child:hover{animation:zbWiggle .6s ease-in-out}
}
@media (prefers-reduced-motion:reduce){
#dc-root *,x-dc *{animation:none !important;transition:none !important}
button:hover,button:active,a:hover,a:active{transform:none !important}
}
/*zb-ui-end*/
/*zb-col-start*/
.zb-col{max-width:768px !important;margin-left:auto !important;margin-right:auto !important}
@media (max-width:760px){.zb-col{padding:20px 16px 36px !important}}
.zb-bam-panel{display:flex;gap:8px;align-items:stretch}
.zb-bam-spine{cursor:default}
.zb-bam-spine .zb-culm-b{min-height:24px}
.zb-bam-body{flex:1;min-width:0;display:flex;flex-direction:column;gap:10px;padding:4px 0 16px}
.zb-acc{background:#FCFAF6;border:1px solid #E4DED2;border-radius:16px;overflow:hidden;transition:border-color .2s ease,box-shadow .2s ease}
.zb-acc[data-open="true"]{border-color:#B9CDBF;box-shadow:0 4px 14px rgba(46,94,78,.08)}
.zb-acc-head{width:100%;min-height:60px;display:flex;align-items:center;gap:12px;padding:12px 16px;background:transparent;border:0;font-family:inherit;color:#1F2A24;text-align:left;cursor:pointer}
.zb-acc-title{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.zb-acc-body{padding:0 16px 16px;display:flex;flex-direction:column;gap:12px}
.zb-chev{flex-shrink:0;transition:transform .32s cubic-bezier(.2,.8,.2,1)}
[aria-expanded="true"]>.zb-chev{transform:rotate(180deg)}
.zb-sec{display:flex;flex-direction:column;gap:12px}
.zb-sec-head{display:flex;flex-direction:column;gap:4px}
.zb-sec-head h2{margin:0;font-size:20px;font-weight:600}
.zb-sec-head p{margin:0;font-size:14px;color:#5F6B64;line-height:1.6}
.zb-acc-past{background:#EFECE6 !important;border-color:#E2DDD3 !important}
.zb-acc-past,.zb-acc-past span,.zb-acc-past p,.zb-acc-past li{color:#8C928D !important}
.zb-acc-past a{color:#6F7671 !important}
.zb-list{display:flex;flex-direction:column;gap:10px}
.zb-chips{display:flex;flex-wrap:wrap;gap:8px}
.zb-chip{min-height:44px;padding:0 16px;border-radius:999px;border:1px solid #E4DED2;background:#FCFAF6;color:#1F2A24;font-family:inherit;font-size:14px;cursor:pointer}
.zb-chip-on{background:#2E5E4E;border-color:#2E5E4E;color:#FFFFFF;font-weight:600}
.zb-filter{background:#FCFAF6;border:1px solid #E4DED2;border-radius:16px;overflow:hidden}
.zb-filter-head{width:100%;min-height:60px;display:flex;align-items:center;gap:12px;padding:12px 16px;background:transparent;border:0;font-family:inherit;color:#1F2A24;text-align:left;cursor:pointer}
.zb-filter-body{border-top:1px solid #EFEAE0;padding:16px;display:flex;flex-direction:column;gap:16px}
.zb-filter-note{margin:0;font-size:14px;line-height:1.6;color:#5F6B64}
.zb-filter-foot{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px}
.zb-filter-done{margin-left:auto;min-height:44px;padding:0 20px;border-radius:12px;border:1px solid #E4DED2;background:#FCFAF6;font-family:inherit;font-size:15px;font-weight:600;color:#2E5E4E;cursor:pointer}
.zb-fgroup{display:flex;flex-direction:column;gap:8px}
.zb-flabel{font-size:13px;font-weight:600;color:#5F6B64;display:flex;gap:8px;align-items:baseline}
.zb-flabel span{font-weight:400;font-size:12px}
.zb-reset{align-self:flex-start;min-height:44px;padding:0 4px;border:0;background:transparent;font-family:inherit;font-size:14px;color:#2E5E4E;text-decoration:underline;text-underline-offset:3px;cursor:pointer}
@media (max-width:480px){.zb-filter-head{padding:12px 14px}.zb-filter-body{padding:14px}.zb-chip{padding:0 14px}}
@media (max-width:480px){.zb-acc-head{padding:12px 14px;gap:10px}.zb-acc-body{padding:0 14px 14px}}
@media (hover:hover){.zb-bam-row:hover button[aria-expanded="false"]{background:#F1EDE4 !important}}
.zb-list .zb-acc-body{border-top:1px solid #EFEAE0;padding-top:14px}
.zb-list ul.zb-acc-body>li:first-child{border-top:0 !important}
/*zb-col-end*/
</style>
<style>#dc-root>div{margin-left:auto;margin-right:auto}</style>
</head>
<body>
<template id="dc-tpl">
<div style="width: 100%; min-height: 1180px; box-sizing: border-box; background: #F6F2EA; font-family: 'Noto Sans TC', system-ui, sans-serif; color: #1F2A24">

<header style="border-bottom: 1px solid #E4DED2; background: #FCFAF6">
<div style="max-width: 1360px; margin: 0 auto; padding: 16px 32px; box-sizing: border-box; display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap">
<div style="display: flex; align-items: center; gap: 10px">
<svg width="28" height="28" viewBox="0 0 28 28" aria-hidden="true"><circle cx="14" cy="14" r="13" fill="#2E5E4E"></circle><path d="M14 20V9M14 13c0-2.5 2-4 4.5-4M14 15.5c0-2.2-1.8-3.5-4-3.5" stroke="#F6F2EA" stroke-width="1.8" fill="none" stroke-linecap="round"></path></svg>
<span style="font-size: 18px; font-weight: 600; letter-spacing: 0.04em">竹寶</span>
<span style="font-size: 13px; color: #5F6B64; margin-left: 8px">新竹市生養時程</span>
</div>
<nav class="zb-nav-links" aria-label="主選單" style="display: flex; gap: 4px; flex-wrap: wrap">
<a href="index.html" style="min-height: 44px; display: flex; align-items: center; padding: 0 14px; border-radius: 12px; text-decoration: none; color: #5F6B64; font-size: 14px">主頁</a>
<a href="#" aria-current="page" style="min-height: 44px; display: flex; align-items: center; padding: 0 14px; border-radius: 12px; text-decoration: none; background: #E4EEE7; color: #2E5E4E; font-weight: 600; font-size: 14px">補助及其他福利</a>
<a href="childcare.html" style="min-height: 44px; display: flex; align-items: center; padding: 0 14px; border-radius: 12px; text-decoration: none; color: #5F6B64; font-size: 14px">托育</a>
<a href="activities.html" style="min-height: 44px; display: flex; align-items: center; padding: 0 14px; border-radius: 12px; text-decoration: none; color: #5F6B64; font-size: 14px">親子活動</a>
<a href="ask.html" style="min-height: 44px; display: flex; align-items: center; padding: 0 14px; border-radius: 12px; text-decoration: none; color: #5F6B64; font-size: 14px">問竹寶</a>
<a href="help.html" style="min-height: 44px; display: flex; align-items: center; padding: 0 14px; border-radius: 12px; text-decoration: none; color: #5F6B64; font-size: 14px">協助</a>
</nav>
<button type="button" class="zb-nav-toggle" aria-expanded="{{menuExpanded}}" aria-controls="zb-menu" onClick="{{toggleMenu}}" style="min-height: 44px; align-items: center; gap: 8px; padding: 0 14px; border-radius: 12px; border: 1px solid #E4DED2; background: #FCFAF6; font-family: inherit; font-size: 14px; color: #1F2A24; cursor: pointer"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="{{menuIcon}}"></path></svg>{{menuLabel}}</button>
</div>
<sc-if value="{{menuOpen}}" hint-placeholder-val="{{false}}">
<nav id="zb-menu" class="zb-nav-menu" aria-label="主選單" style="border-top: 1px solid #E4DED2; background: #FCFAF6; padding: 8px 16px 16px; display: flex; flex-direction: column">
<a href="index.html" style="min-height: 52px; display: flex; align-items: center; padding: 0 14px; border-radius: 12px; text-decoration: none; color: #1F2A24; font-size: 16px; border-bottom: 1px solid #EFEAE0">主頁</a>
<a href="#" aria-current="page" style="min-height: 52px; display: flex; align-items: center; justify-content: space-between; padding: 0 14px; border-radius: 12px; text-decoration: none; background: #E4EEE7; color: #2E5E4E; font-weight: 600; font-size: 16px">補助及其他福利<span style="font-size: 12px; font-weight: 400">目前位置</span></a>
<a href="childcare.html" style="min-height: 52px; display: flex; align-items: center; padding: 0 14px; border-radius: 12px; text-decoration: none; color: #1F2A24; font-size: 16px; border-bottom: 1px solid #EFEAE0">托育</a>
<a href="activities.html" style="min-height: 52px; display: flex; align-items: center; padding: 0 14px; border-radius: 12px; text-decoration: none; color: #1F2A24; font-size: 16px; border-bottom: 1px solid #EFEAE0">親子活動</a>
<a href="ask.html" style="min-height: 52px; display: flex; align-items: center; padding: 0 14px; border-radius: 12px; text-decoration: none; color: #1F2A24; font-size: 16px; border-bottom: 1px solid #EFEAE0">問竹寶</a>
<a href="help.html" style="min-height: 52px; display: flex; align-items: center; padding: 0 14px; border-radius: 12px; text-decoration: none; color: #1F2A24; font-size: 16px; border-bottom: 1px solid #EFEAE0">協助</a>
</nav>
</sc-if>
</header>

<div class="zb-ben-wrap zb-col" style="max-width: 1360px; margin: 0 auto; padding: 28px 32px 40px; box-sizing: border-box; display: flex; flex-direction: column; gap: 24px">

<div style="display: flex; justify-content: space-between; align-items: flex-end; gap: 16px; flex-wrap: wrap">
<div>
<h1 style="margin: 0; font-size: 28px; font-weight: 600; line-height: 1.3; display: flex; align-items: center; gap: 10px"><i aria-hidden="true" style="width: 14px; height: 14px; border-radius: 999px; background: {{kidHex}}; flex-shrink: 0"></i>{{kidTitle}}</h1>
<div style="font-size: 14px; color: #5F6B64; margin-top: 6px">{{kidLine}}　<a href="setup.html" style="white-space: nowrap">修改寶寶資料</a></div>
</div>
<div style="display: flex; gap: 8px; flex-wrap: wrap">
<sc-for list="{{counts}}" as="c" hint-placeholder-count="4">
<span style="{{c.style}}">{{c.text}}</span>
</sc-for>
</div>
</div>

<section aria-labelledby="h-filter" class="zb-filter" data-open="{{filterOpen}}">
<button type="button" class="zb-filter-head" aria-expanded="{{filterOpen}}" aria-controls="zb-filter-body" onClick="{{toggleFilter}}">
<span class="zb-acc-title"><span id="h-filter" style="font-size: 16px; font-weight: 600">篩選條件</span><span style="font-size: 13px; color: #5F6B64">{{filterSub}}</span></span>
<svg class="zb-chev" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#5F6B64" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"></path></svg>
</button>
<sc-if value="{{filterShow}}" hint-placeholder-val="{{false}}">
<div id="zb-filter-body" class="zb-filter-body">
<p class="zb-filter-note">{{filterNote}}</p>
<sc-for list="{{condGroups}}" as="g" hint-placeholder-count="2">
<div class="zb-fgroup" role="group" aria-label="{{g.label}}">
<span class="zb-flabel">{{g.label}}<span>可複選</span></span>
<div class="zb-chips">
<sc-for list="{{g.chips}}" as="c" hint-placeholder-count="6"><button type="button" class="{{c.cls}}" aria-pressed="{{c.pressed}}" onClick="{{c.pick}}">{{c.name}}</button></sc-for>
</div>
</div>
</sc-for>
<div class="zb-filter-foot">
<sc-if value="{{canReset}}" hint-placeholder-val="{{false}}"><button type="button" class="zb-reset" onClick="{{resetConds}}">改回依寶寶資料的選擇</button></sc-if>
<button type="button" class="zb-filter-done" onClick="{{toggleFilter}}">收起</button>
</div>
</div>
</sc-if>
</section>

<section aria-labelledby="h-stage" class="zb-sec">
<div class="zb-sec-head">
<h2 id="h-stage">依寶寶年齡</h2>
<p>竹節會依上面選的情況換成對應的補助與福利。點一個竹節展開，最近要申請或快截止的排前面；不分年齡的放在最下面「任何年齡」。</p>
</div>
<div style="display: flex; flex-direction: column">
<sc-for list="{{stages}}" as="st" hint-placeholder-count="5">
<div class="zb-bam-row" data-k="r{{st.title}}" data-on="{{st.pressed}}">
<div class="{{st.bamCls}}" aria-hidden="true" onClick="{{st.select}}"><span class="zb-culm zb-culm-a"></span><span class="zb-node"></span><svg class="zb-leaf zb-leaf-r" viewBox="0 0 30 14"><path d="M1 7C8 0 22 0 29 7C22 14 8 14 1 7Z"></path></svg><svg class="zb-leaf zb-leaf-l" viewBox="0 0 30 14"><path d="M29 7C22 0 8 0 1 7C8 14 22 14 29 7Z"></path></svg><span class="zb-culm zb-culm-b"></span></div>
<button type="button" onClick="{{st.select}}" aria-expanded="{{st.pressed}}" style="{{st.btnStyle}}">
<span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px">
<span style="display: flex; align-items: center; gap: 8px; flex-wrap: wrap"><span style="font-size: 16px; font-weight: 600; color: {{st.titleColor}}">{{st.title}}</span><sc-if value="{{st.isNow}}" hint-placeholder-val="{{false}}"><span style="font-size: 12px; font-weight: 600; color: #FFFFFF; background: #2E5E4E; border-radius: 999px; padding: 2px 8px">現在</span></sc-if></span>
<span style="font-size: 13px; color: #5F6B64">{{st.range}}・{{st.countText}}</span>
</span>
<svg class="zb-chev" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#5F6B64" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"></path></svg>
</button>
</div>
<sc-if value="{{st.open}}" hint-placeholder-val="{{false}}">
<div class="zb-bam-panel" data-k="p{{st.title}}">
<div class="{{st.spineCls}}" aria-hidden="true"><span class="zb-culm zb-culm-b"></span></div>
<div class="zb-bam-body">
<sc-if value="{{st.empty}}" hint-placeholder-val="{{false}}"><p style="margin: 0; font-size: 15px; color: #5F6B64; background: #FCFAF6; border: 1px solid #E4DED2; border-radius: 16px; padding: 16px">這個階段的項目已經結束，沒有需要處理的事。</p></sc-if>
<sc-for list="{{st.items}}" as="it" hint-placeholder-count="4">
<div class="{{it.accCls}}" data-k="{{it.name}}" data-item="{{it.itemId}}" data-open="{{it.expanded}}">
<button type="button" onClick="{{it.toggle}}" aria-expanded="{{it.expanded}}" style="width: 100%; min-height: 68px; display: flex; align-items: center; gap: 12px; padding: 14px 16px; background: transparent; border: 0; text-align: left; font-family: inherit; color: inherit; cursor: pointer">
<div style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px">
<sc-if value="{{it.showPill}}" hint-placeholder-val="{{true}}"><span style="{{it.pillStyle}}; align-self: flex-start; margin-bottom: 2px">{{it.label}}</span></sc-if>
<span style="font-size: 16px; font-weight: 600; line-height: 1.4">{{it.name}}</span>
<span style="font-size: 13px; color: #5F6B64; font-variant-numeric: tabular-nums">{{it.meta}}</span>
</div>
<svg class="zb-chev" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#5F6B64" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="transform: none"><path d="m9 6 6 6-6 6"></path></svg>
</button>
</div>
</sc-for>

<sc-if value="{{st.hasRes}}" hint-placeholder-val="{{false}}">
<div style="background: #EEF3EE; border-radius: 16px; padding: 14px 16px; display: flex; flex-direction: column; gap: 2px">
<span style="font-size: 13px; font-weight: 600; color: #2E5E4E">這個階段的資源</span>
<sc-for list="{{st.resources}}" as="r" hint-placeholder-count="2">
<div class="zb-res-item" style="display: flex; flex-direction: column; gap: 4px; padding: 10px 0; border-bottom: 1px solid #D9E3DA">
<span style="align-self: flex-start; font-size: 12px; color: #2E5E4E; background: #FCFAF6; border-radius: 999px; padding: 2px 10px">{{r.tag}}</span>
<span style="font-size: 15px; line-height: 1.6">{{r.text}}</span>
<sc-if value="{{r.url}}" hint-placeholder-val="{{false}}"><a href="{{r.url}}" style="font-size: 13px">{{r.src}}</a></sc-if>
</div>
</sc-for>
</div>
</sc-if>
</div>
</div>
</sc-if>
</sc-for>
</div>
</section>


<p style="margin: 0; font-size: 12px; line-height: 1.6; color: #5F6B64; border-top: 1px solid #E4DED2; padding-top: 16px">「可能適用」只是依你填的資料初步整理，不代表已通過資格審查。實際資格以主管機關審核為準。</p>

</div>
</div>
<sc-if value="{{sheet}}" hint-placeholder-val="{{false}}">
<div class="zb-sheet zb-csheet" data-k="cs-{{sheet.name}}">
<div class="zb-sheet-back" onClick="{{sheet.close}}"></div>
<div class="zb-sheet-panel" role="dialog" aria-modal="true" aria-label="{{sheet.name}}" tabindex="-1">
<span class="zb-grab" aria-hidden="true"></span>
<div class="zb-sheet-head"><div class="zb-csheet-title"><sc-if value="{{sheet.showPill}}" hint-placeholder-val="{{true}}"><span style="{{sheet.pillStyle}}; align-self: flex-start">{{sheet.label}}</span></sc-if><h2>{{sheet.name}}</h2></div><button type="button" class="zb-sheet-x" data-sheet-close="1" onClick="{{sheet.close}}">完成</button></div>
<div class="zb-csheet-body">
<div style="display: flex; flex-direction: column; gap: 12px; max-width: 680px">
<div style="display: flex; flex-direction: column; gap: 6px">
<span style="align-self: flex-start; font-size: 11px; font-weight: 600; color: #5F6B64; background: #EFEAE0; border-radius: 999px; padding: 2px 8px">AI 說明</span>
<span style="font-size: 13px; font-weight: 600; color: #5F6B64; margin-top: 4px">補助什麼</span>
<p style="margin: 0; font-size: 15px; line-height: 1.75">{{sheet.what}}</p>
<span style="font-size: 13px; font-weight: 600; color: #5F6B64; margin-top: 6px">重要資訊</span>
<ul style="margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 4px; font-size: 15px; line-height: 1.7">
<sc-for list="{{sheet.points}}" as="pt" hint-placeholder-count="3"><li>{{pt.t}}</li></sc-for>
</ul>
<sc-if value="{{sheet.hasNeed}}" hint-placeholder-val="{{true}}">
<span style="font-size: 13px; font-weight: 600; color: #5F6B64; margin-top: 6px">還要確認的資料</span>
<ul style="margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 4px; font-size: 15px; line-height: 1.7">
<sc-for list="{{sheet.need}}" as="nd" hint-placeholder-count="2"><li>{{nd.t}}</li></sc-for>
</ul>
</sc-if>
</div>
</div>
<sc-if value="{{sheet.canFollow}}" hint-placeholder-val="{{false}}">
<div style="display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px">
<button type="button" class="zb-follow" aria-pressed="{{sheet.followOn}}" onClick="{{sheet.toggleFollow}}">{{sheet.followText}}</button>
<span class="zb-follow-note" style="flex: 1 1 220px">{{sheet.followNote}}</span>
</div>
</sc-if>
<div style="display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; border-top: 1px dashed #E4DED2; padding-top: 14px">
<span style="font-size: 13px; color: #5F6B64">來源：<a href="{{sheet.srcUrl}}">{{sheet.srcTitle}}</a></span>
<sc-if value="{{sheet.showCta}}" hint-placeholder-val="{{true}}">
<a href="{{sheet.srcUrl}}" style="min-height: 44px; padding: 0 20px; display: inline-flex; align-items: center; justify-content: center; gap: 8px; border-radius: 12px; background: #2E5E4E; color: #FFFFFF; font-size: 15px; font-weight: 600; text-decoration: none">{{sheet.cta}}<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 17 17 7M8 7h9v9"></path></svg></a>
</sc-if>
</div>
</div>
</div>
</sc-if>

      confine: ['是否設籍並居住新竹市', '是否為弱勢家庭（可多補助時數）'],
      post2: ['是否在產後 1 到 3 個月內，院所是否有提供這項服務'],
      check2: ['這次健檢的建議月齡（看兒童健康手冊）'],
      vax2: ['這次要打的疫苗與月齡（看疾管署時程與兒童健康手冊）'],
      allowance: ['寶寶是否由自己或家人照顧、沒有送托', '戶籍、所得等其他條件請看市府公告'],
      tempcare: ['據點是否有空的時段，以及收費方式'],
      check3: ['這次健檢的建議月齡（看兒童健康手冊）'],
      vax4: ['這次要打的疫苗與月齡（看疾管署時程與兒童健康手冊）'],
      nursery: ['之後是否會送準公共托嬰中心或保母'],
      check4: ['這次健檢的建議月齡（看兒童健康手冊）'],
      leave: ['爸爸或媽媽是否有就業保險，年資是否滿 1 年', '是否已向公司申請育嬰留職停薪'],
      careExtra: ['之後是否會送托', '是否為中低收入戶或低收入戶，這是第幾胎'],
      after2: ['滿 2 歲後是否在家照顧，或讀哪一種幼兒園'],
      kinder: ['之後要讀哪一種幼兒園，這是第幾胎'],
      school5: ['5 歲時是否在家照顧，或讀哪一種幼兒園'],
      primary: ['是否為新竹市列冊的低收入戶或中低收入戶', '是否讀市立國小']
    };
    /* 不分年齡的福利：放在最下面的「任何年齡」竹節 */
    others.forEach((o) => {
      SRC['o_' + o.id] = [o.srcT, o.url, ''];
      ITEMS[o.id] = { name: o.name, meta: o.what, status: o.conds.length ? fit(o.conds) : 'ok', src: 'o_' + o.id, cta: o.cta };
      INFO[o.id] = [o.what + '。', ['對象：' + o.who + '。', '地點／窗口：' + o.where + '。', o.note]];
    });
    const ITEMS_BY = { preg: ['confine', 'haoyun'], s0: ['birthHC', 'centralTop', 'multiBirth', 'lowInc', 'post1'], s1: ['post2', 'check2', 'vax2', 'allowance', 'leave', 'tempcare'], s2: ['check3', 'vax4', 'nursery', 'careExtra'], s3: ['check4'], s4: ['after2', 'kinder'], s5: ['school5'], s6: ['primary'], any: others.map((o) => o.id) };
    const STAGES = F.stages(K).map((x) => ({ id: x.id, title: x.title, range: x.range, phase: x.phase, items: ITEMS_BY[x.id] || [] }));
    STAGES.unshift({ id: 'any', title: '任何年齡', range: '不分年齡，隨時可以申請或使用', phase: 'any', items: ITEMS_BY.any });
    if (s.jump) { const js = STAGES.find((x) => x.items.indexOf(s.jump) >= 0); if (js) s.stage = js.id; s.jump = null; }
    const tally = { ok: 0, check: 0, expired: 0, no: 0 };
    /* 關注：只有算得出日期（可開始申請、截止）的項目才能加到行事曆 */
    const followOf = (id) => {
      const dates = F.benefitDates(K, id).filter((d) => d.date >= T);
      if (!dates.length) return { canFollow: false };
      const on = F.isFollowing('b', id, K.id);
      return {
        canFollow: true, followOn: on ? 'true' : 'false', followText: on ? '已關注' : '關注',
        followNote: (on ? '已加到行事曆：' : '關注後會加到行事曆：') + dates.map((d) => F.fmt(d.date) + ' ' + d.label).join('、') + '。前 7 天和前 1 天提醒你。',
        toggleFollow: () => {
          if (on) F.unfollow('b', id, K.id); else F.follow({ t: 'b', id, kid: K.id });
          if (window.ZB) { window.ZB.toast(on ? '已取消關注' : '已加到行事曆'); window.ZB.buzz && window.ZB.buzz(); window.ZB.refresh && window.ZB.refresh(); }
          this.setState({});
        }
      };
    };
    /* 最近要注意的日期（可開始申請或截止，今天以後）：排序用，也顯示在卡片上 */
    const nextDate = (id) => F.benefitDates(K, id).filter((d) => d.date >= T).sort((x, y) => x.date - y.date)[0] || null;
    const build = (id) => {
      const it = ITEMS[id];
      const nd = it.status === 'expired' ? null : nextDate(id);
      return {
        status: it.status, name: it.name, desc: it.desc,
        meta: it.meta + (nd ? '・' + (nd.date.getFullYear() === T.getFullYear() ? F.md(nd.date) : F.fmt(nd.date)) + (nd.type === 'end' ? ' 截止' : ' 起可申請') : ''),
        sortDate: it.status === 'expired' ? Infinity : nd ? nd.date.getTime() : 9e15,
        need: (NEED[id] || []).map((x) => ({ t: x })), hasNeed: (NEED[id] || []).length > 0 && it.status !== 'expired',
        label: PILL[it.status][2], what: INFO[id][0], points: INFO[id][1].map((x) => ({ t: x })),
        icon: ICON[it.status], pillStyle: pill(it.status),
        showPill: it.status !== 'expired', accCls: 'zb-acc' + (it.status === 'expired' ? ' zb-acc-past' : ''),
        open: s.open === id, expanded: s.open === id ? 'true' : 'false',
        chev: s.open === id ? 'm6 15 6-6 6 6' : 'm6 9 6 6 6-6',
        toggle: () => this.setState({ open: s.open === id ? null : id }),
        srcTitle: SRC[it.src][0], srcUrl: SRC[it.src][1], srcConf: SRC[it.src][2],
        cta: it.cta, showCta: !!it.cta,
        itemId: id, ...followOf(id)
      };
    };
    /* 竹節裡的排序：先看日期（最近、最急的先），再看適不適用（可能適用的先），已過期限的放最後 */
    const rank = (b) => (b.status === 'no' ? 1 : 0);
    const ORDER = STAGES.slice().reverse();
    const stages = ORDER.map((st, i) => {
      const built = st.items.map(build).sort((x, y) => (x.sortDate - y.sortDate) || (rank(x) - rank(y)));
      built.forEach((b) => { tally[b.status] += 1; });
      const nFit = built.filter((b) => b.status === 'ok' || b.status === 'check').length;
      const selected = s.stage === st.id;
      const ph = st.phase === 'now' ? 'now' : (st.phase === 'past' || st.phase === 'any') ? 'past' : 'future';
      return {
        id: st.id, title: st.title, range: st.range, isNow: st.phase === 'now',
        countText: st.items.length === 0 ? '已結束' : nFit === st.items.length ? st.items.length + ' 項' : built.every((b) => b.status === 'expired') ? st.items.length + ' 項，都已過期限' : st.items.length + ' 項，' + nFit + ' 項可能適用',
        titleColor: st.phase === 'past' ? '#5F6B64' : '#1F2A24',
        bamCls: 'zb-bam zb-bam-' + ph + (i % 2 ? ' zb-alt' : '') + (i === 0 ? ' zb-bam-top' : '') + (i === ORDER.length - 1 && !selected ? ' zb-bam-bottom' : ''),
        pressed: selected ? 'true' : 'false', open: selected, empty: built.length === 0, hasRes: (RES[st.id] || []).length > 0,
        spineCls: 'zb-bam zb-bam-spine zb-bam-' + ph + (i === ORDER.length - 1 ? ' zb-bam-bottom' : ''),
        btnStyle: 'min-height: 60px; margin: 4px 0; padding: 8px 12px; border-radius: 12px; display: flex; align-items: center; gap: 10px; color: #1F2A24; text-align: left; font-family: inherit; cursor: pointer; border: 1px solid ' + (selected ? '#2E5E4E' : 'transparent') + '; background: ' + (selected ? '#E4EEE7' : 'transparent'),
        select: () => this.setState({ stage: selected ? null : st.id, open: null }),
        items: built, resources: RES[st.id] || []
      };
    });
    const counts = [{ text: '可能適用 ' + (tally.ok + tally.check), style: pill('ok') }];
    if (tally.no) counts.push({ text: '可能不適用 ' + tally.no, style: pill('no') });
    /* 最上方的篩選：可複選；「顯示全部」＝不依條件判斷 */
    const setConds = (list) => this.setState({ conds: list, showAll: list.length === 0, open: null });
    const chip = (name, on, pick) => ({ name, pressed: on ? 'true' : 'false', cls: 'zb-chip' + (on ? ' zb-chip-on' : ''), pick });
    const condChip = (c) => { const on = !s.showAll && has(c.id); return chip(c.name, on, () => setConds(on ? s.conds.filter((x) => x !== c.id) : (s.showAll ? [] : s.conds).concat([c.id]))); };
    const auto = F.conds(K);
    const same = !s.showAll && auto.length === s.conds.length && auto.every(has);
    const condGroups = [
      { label: '家庭狀況', chips: [chip('顯示全部', s.showAll, () => this.setState({ showAll: true, open: null }))].concat(F.CONDS.filter((c) => c.group === 'family').map(condChip)) },
      { label: '照顧方式', chips: F.CONDS.filter((c) => c.group === 'care').map(condChip) }
    ];
    const A = F.age(K);
    return {
      kidHex: F.color(K.color).hex, kidTitle: K.name + (A.born ? ' ' + A.text : '・' + A.text), kidLine: F.line(K),
      filterOpen: s.filterOpen ? 'true' : 'false', filterShow: !!s.filterOpen,
      toggleFilter: () => this.setState({ filterOpen: !s.filterOpen }),
      /* 收起時不列出選了哪些條件，只說是否有篩選 */
      filterSub: s.filterOpen ? '選好可以收起，收起後不會列出選了什麼' : s.showAll ? '目前顯示全部' : '已依寶寶資料篩選，點開調整',
      condGroups, canReset: !same && auto.length > 0, resetConds: () => setConds(auto.slice()),
      filterNote: s.showAll ? '目前顯示全部，不依條件判斷，每一項都先標「可能適用」。' : '已依' + K.name + '的寶寶資料先選好，可以再調整。沒選到的條件，相關項目會標「可能不適用」，仍然列出來。',
      menuOpen: !!s.menuOpen, menuExpanded: s.menuOpen ? 'true' : 'false',
      menuLabel: s.menuOpen ? '關閉' : '選單', menuIcon: s.menuOpen ? 'M6 6l12 12M18 6 6 18' : 'M4 7h16M4 12h16M4 17h16',
      toggleMenu: () => this.setState({ menuOpen: !s.menuOpen }),
      stages, counts,
      /* 點開的項目：細節從下方滑出面板顯示，列表本身不動 */
      sheet: (() => { const o = stages.reduce((a, st) => a.concat(st.items), []).find((b) => b.open); return o ? Object.assign({}, o, { close: () => this.setState({ open: null }) }) : null; })()
    };
  }
}

window.Component = Component;
</script>
</body>
