<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>竹寶・AI 問答</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;600&amp;display=swap">
<style>
body{margin:0;background:#F6F2EA}
a{color:#2E5E4E}a:hover{color:#1F4337}
button:focus-visible,a:focus-visible,input:focus-visible{outline:2px solid #2E5E4E;outline-offset:2px}
.zb-nav-toggle{display:none}
@media (max-width: 760px){.zb-nav-links{display:none !important}.zb-nav-toggle{display:inline-flex !important}}
@media (min-width: 761px){.zb-nav-menu{display:none !important}}
/*zb-ui-start*/
.zb-bam-row{display:flex;gap:8px;align-items:stretch}
.zb-bam-row>button{flex:1;min-width:0}
.zb-bam{position:relative;width:40px;flex-shrink:0;display:flex;flex-direction:column;align-items:center;cursor:pointer}
.zb-culm{width:12px;flex-shrink:0;background:linear-gradient(90deg,#4F8065 0%,#80AE8F 45%,#5E8F73 100%)}
.zb-culm-a{height:26px}
.zb-culm-b{flex:1 1 auto;min-height:12px}
.zb-node{width:20px;height:7px;border-radius:4px;background:#3F6F57;flex-shrink:0;position:relative;z-index:1;transition:transform .25s cubic-bezier(.34,1.56,.64,1)}
.zb-bam-top .zb-culm-a{border-radius:6px 6px 0 0;height:20px;margin-top:6px}
.zb-bam-bottom .zb-culm-b{border-radius:0 0 3px 3px}
.zb-leaf{position:absolute;top:23px;width:26px;height:12px;fill:#6F9A82;pointer-events:none}
.zb-leaf-r{left:24px;transform-origin:left center;transform:rotate(-30deg)}
.zb-leaf-l{right:24px;transform-origin:right center;transform:rotate(30deg);display:none}
.zb-alt .zb-leaf-r{display:none}.zb-alt .zb-leaf-l{display:block}
.zb-bam-future .zb-culm,.zb-bam-future .zb-node{opacity:.28}
.zb-bam-future .zb-leaf{opacity:.25}
.zb-bam-now .zb-culm-a{opacity:.28}
.zb-bam-now .zb-node{background:#2E5E4E;animation:zbGlow 2.4s ease-in-out infinite}
.zb-bam-now .zb-leaf{fill:#8FC16F}
.zb-bam-now .zb-leaf-l,.zb-bam-now .zb-leaf-r{display:block}
.zb-bam-now .zb-leaf-r{animation:zbIdleR 3.2s ease-in-out infinite}
.zb-bam-now .zb-leaf-l{animation:zbIdleL 3.2s ease-in-out infinite}
.zb-bam-row[data-on="true"] .zb-leaf-r{animation:zbSwayR .8s ease-in-out 2}
.zb-bam-row[data-on="true"] .zb-leaf-l{animation:zbSwayL .8s ease-in-out 2}
@keyframes zbGlow{0%,100%{box-shadow:0 0 0 3px rgba(143,193,111,.35),0 0 8px rgba(46,94,78,.35)}50%{box-shadow:0 0 0 6px rgba(143,193,111,.25),0 0 18px rgba(46,94,78,.6)}}
@keyframes zbIdleR{0%,100%{transform:rotate(-30deg)}50%{transform:rotate(-20deg)}}
@keyframes zbIdleL{0%,100%{transform:rotate(30deg)}50%{transform:rotate(20deg)}}
@keyframes zbSwayR{0%,100%{transform:rotate(-30deg)}30%{transform:rotate(0deg)}65%{transform:rotate(-44deg)}}
@keyframes zbSwayL{0%,100%{transform:rotate(30deg)}30%{transform:rotate(0deg)}65%{transform:rotate(44deg)}}
@keyframes zbWiggle{0%,100%{transform:rotate(0)}25%{transform:rotate(-10deg)}60%{transform:rotate(8deg)}}
button,a{-webkit-tap-highlight-color:transparent}
button,a[style*="min-height"]{transition:transform .2s cubic-bezier(.34,1.56,.64,1),box-shadow .2s ease,background-color .2s ease,border-color .2s ease,color .2s ease}
button:active,a[style*="min-height"]:active{transform:scale(.94);box-shadow:none;transition-duration:.06s}
.zb-bam-row button:active{transform:scale(.98)}
@media (hover:hover){
button:not([aria-expanded]):not([role="switch"]):not([role="checkbox"]):hover,a[style*="min-height"]:hover{transform:translateY(-2px);box-shadow:0 6px 14px rgba(46,94,78,.18)}
button[aria-expanded]:hover{background-color:rgba(46,94,78,.05) !important}
button[role="switch"]:hover,button[role="checkbox"]:hover{color:#2E5E4E !important}
.zb-nav-links a:not([aria-current]):hover{background:#E4EEE7 !important;color:#2E5E4E !important}
.zb-bam-row button:hover{transform:none;box-shadow:none}
.zb-bam-row:hover button[aria-pressed="false"]{background:#F1EDE4 !important}
.zb-bam-row:hover .zb-leaf-r{animation:zbSwayR .8s ease-in-out infinite}
.zb-bam-row:hover .zb-leaf-l{animation:zbSwayL .8s ease-in-out infinite}
.zb-bam-row:hover .zb-node{transform:scaleX(1.18)}
header svg:first-child:hover{animation:zbWiggle .6s ease-in-out}
}
@media (prefers-reduced-motion:reduce){
#dc-root *,x-dc *{animation:none !important;transition:none !important}
button:hover,button:active,a:hover,a:active{transform:none !important}
}
/*zb-ui-end*/
/*zb-col-start*/
.zb-col{max-width:768px !important;margin-left:auto !important;margin-right:auto !important}
@media (max-width:760px){.zb-col{padding:20px 16px 36px !important}}
.zb-bam-panel{display:flex;gap:8px;align-items:stretch}
.zb-bam-spine{cursor:default}
.zb-bam-spine .zb-culm-b{min-height:24px}
.zb-bam-body{flex:1;min-width:0;display:flex;flex-direction:column;gap:10px;padding:4px 0 16px}
.zb-acc{background:#FCFAF6;border:1px solid #E4DED2;border-radius:16px;overflow:hidden;transition:border-color .2s ease,box-shadow .2s ease}
.zb-acc[data-open="true"]{border-color:#B9CDBF;box-shadow:0 4px 14px rgba(46,94,78,.08)}
.zb-acc-head{width:100%;min-height:60px;display:flex;align-items:center;gap:12px;padding:12px 16px;background:transparent;border:0;font-family:inherit;color:#1F2A24;text-align:left;cursor:pointer}
.zb-acc-title{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.zb-acc-body{padding:0 16px 16px;display:flex;flex-direction:column;gap:12px}
.zb-chev{flex-shrink:0;transition:transform .32s cubic-bezier(.2,.8,.2,1)}
[aria-expanded="true"]>.zb-chev{transform:rotate(180deg)}
.zb-sec{display:flex;flex-direction:column;gap:12px}
.zb-sec-head{display:flex;flex-direction:column;gap:4px}
.zb-sec-head h2{margin:0;font-size:20px;font-weight:600}
.zb-sec-head p{margin:0;font-size:14px;color:#5F6B64;line-height:1.6}
.zb-list{display:flex;flex-direction:column;gap:10px}
@media (max-width:480px){.zb-acc-head{padding:12px 14px;gap:10px}.zb-acc-body{padding:0 14px 14px}}
.zb-list .zb-acc-body{border-top:1px solid #EFEAE0;padding-top:14px}
.zb-list ul.zb-acc-body>li:first-child{border-top:0 !important}
/*zb-col-end*/
/*zb-ask-start*/
.zb-ask-grid{display:grid;grid-template-columns:280px minmax(0,1fr);gap:24px;align-items:start}
.zb-ask-side{position:sticky;top:16px;min-width:0;display:flex;flex-direction:column;gap:14px}
.zb-hist{background:#FCFAF6;border:1px solid #E4DED2;border-radius:16px;padding:8px;display:flex;flex-direction:column;gap:4px}
.zb-hist-head{display:flex;align-items:center;gap:4px;padding:4px 4px 4px 8px}
.zb-hist-toggle{flex:1;min-width:0;min-height:40px;display:flex;align-items:center;gap:8px;padding:0;border:0;background:transparent;font-family:inherit;color:#1F2A24;text-align:left;cursor:default}
.zb-hist-toggle .zb-chev{display:none;margin-left:auto}
.zb-hist-clear{min-height:36px;padding:0 10px;border-radius:10px;border:0;background:transparent;color:#5F6B64;font-family:inherit;font-size:13px;cursor:pointer;transition:background .15s ease,color .15s ease,transform .2s cubic-bezier(.34,1.56,.64,1)}
.zb-hist-clear:hover{background:#F1ECE2;color:#1F2A24}.zb-hist-clear:active{transform:scale(.92)}
.zb-hist-list{display:flex;flex-direction:column;gap:2px}
.zb-hist-item{position:relative;min-height:52px;display:flex;flex-direction:column;align-items:flex-start;gap:2px;padding:8px 10px 8px 16px;border-radius:12px;border:0;background:transparent;font-family:inherit;text-align:left;cursor:pointer;color:#1F2A24;transition:background .15s ease,transform .22s cubic-bezier(.34,1.56,.64,1)}
.zb-hist-item::before{content:"";position:absolute;left:6px;top:12px;bottom:12px;width:3px;border-radius:2px;background:#D9E5DC;transition:background .15s ease}
.zb-hist-item:hover{background:#F1ECE2;transform:translateX(3px)}
.zb-hist-item:active{transform:scale(.97)}
.zb-hist-item[aria-current="true"]{background:#E4EEE7}
.zb-hist-item[aria-current="true"]::before{background:#2E5E4E}
.zb-hist-q{font-size:14px;line-height:1.5}
.zb-hist-item[aria-current="true"] .zb-hist-q{color:#2E5E4E;font-weight:600}
.zb-hist-t{font-size:12px;color:#5F6B64}
.zb-hints{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.zb-hints-label{font-size:12px;color:#5F6B64;margin-right:2px}
.zb-hint{min-height:36px;padding:0 12px;border-radius:999px;border:1px solid #E4DED2;background:#FCFAF6;color:#1F2A24;font-family:inherit;font-size:13px;cursor:pointer;transition:background .15s ease,border-color .15s ease,color .15s ease,transform .22s cubic-bezier(.34,1.56,.64,1)}
.zb-hint:hover{background:#E4EEE7;border-color:#2E5E4E;color:#2E5E4E;transform:translateY(-2px)}
.zb-hint:active{transform:scale(.94)}
@keyframes zbFilled{0%{box-shadow:0 0 0 0 rgba(46,94,78,.35)}100%{box-shadow:0 0 0 8px rgba(46,94,78,0)}}
.zb-filled{animation:zbFilled .6s ease-out}
@media (max-width:860px){
.zb-ask{padding:20px 16px 36px !important}
.zb-ask-grid{grid-template-columns:minmax(0,1fr);gap:14px}
.zb-ask-side{position:static}
.zb-hist-toggle{cursor:pointer}
.zb-hist-toggle .zb-chev{display:block}
.zb-hist[data-open="false"] .zb-hist-list{display:none}
}
@media (prefers-reduced-motion:reduce){.zb-hist-item,.zb-hint,.zb-hist-clear{transition:none}.zb-hist-item:hover,.zb-hint:hover{transform:none}.zb-filled{animation:none}}
/*zb-ask-end*/
</style>
<style>#dc-root>div{margin-left:auto;margin-right:auto}</style>
</head>
<body>
<template id="dc-tpl">
<div style="width: 100%; min-height: 1400px; box-sizing: border-box; background: #F6F2EA; font-family: 'Noto Sans TC', system-ui, sans-serif; color: #1F2A24">

<header style="border-bottom: 1px solid #E4DED2; background: #FCFAF6">
<div style="max-width: 1200px; margin: 0 auto; padding: 14px 24px; box-sizing: border-box; display: flex; align-items: center; justify-content: space-between; gap: 12px">
<div style="display: flex; align-items: center; gap: 10px">
<svg width="26" height="26" viewBox="0 0 28 28" aria-hidden="true"><circle cx="14" cy="14" r="13" fill="#2E5E4E"></circle><path d="M14 20V9M14 13c0-2.5 2-4 4.5-4M14 15.5c0-2.2-1.8-3.5-4-3.5" stroke="#F6F2EA" stroke-width="1.8" fill="none" stroke-linecap="round"></path></svg>
<span style="font-size: 17px; font-weight: 600; letter-spacing: 0.04em">竹寶</span>
</div>
<nav class="zb-nav-links" aria-label="主選單" style="display: flex; gap: 4px; flex-wrap: wrap">
<a href="index.html" style="min-height: 44px; display: flex; align-items: center; padding: 0 14px; border-radius: 10px; text-decoration: none; color: #5F6B64; font-size: 14px">主頁</a>
<a href="diary.html" style="min-height: 44px; display: flex; align-items: center; padding: 0 14px; border-radius: 10px; text-decoration: none; color: #5F6B64; font-size: 14px">寶寶日記</a>
<a href="benefits.html" style="min-height: 44px; display: flex; align-items: center; padding: 0 14px; border-radius: 10px; text-decoration: none; color: #5F6B64; font-size: 14px">補助及其他福利</a>
<a href="childcare.html" style="min-height: 44px; display: flex; align-items: center; padding: 0 14px; border-radius: 10px; text-decoration: none; color: #5F6B64; font-size: 14px">托育</a>
<a href="activities.html" style="min-height: 44px; display: flex; align-items: center; padding: 0 14px; border-radius: 10px; text-decoration: none; color: #5F6B64; font-size: 14px">親子活動</a>
<a href="#" aria-current="page" style="min-height: 44px; display: flex; align-items: center; padding: 0 14px; border-radius: 10px; text-decoration: none; background: #E4EEE7; color: #2E5E4E; font-weight: 600; font-size: 14px">AI 問答</a>
<a href="help.html" style="min-height: 44px; display: flex; align-items: center; padding: 0 14px; border-radius: 10px; text-decoration: none; color: #5F6B64; font-size: 14px">協助</a>
</nav>
<button type="button" class="zb-nav-toggle" aria-expanded="{{menuExpanded}}" aria-controls="zb-menu" onClick="{{toggleMenu}}" style="min-height: 44px; align-items: center; gap: 8px; padding: 0 14px; border-radius: 12px; border: 1px solid #E4DED2; background: #FCFAF6; font-family: inherit; font-size: 14px; color: #1F2A24; cursor: pointer"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="{{menuIcon}}"></path></svg>{{menuLabel}}</button>
</div>
<sc-if value="{{menuOpen}}" hint-placeholder-val="{{false}}">
<nav id="zb-menu" class="zb-nav-menu" aria-label="主選單" style="border-top: 1px solid #E4DED2; background: #FCFAF6; padding: 8px 16px 16px; display: flex; flex-direction: column">
<a href="index.html" style="min-height: 52px; display: flex; align-items: center; padding: 0 14px; border-radius: 12px; text-decoration: none; color: #1F2A24; font-size: 16px; border-bottom: 1px solid #EFEAE0">主頁</a>
<a href="diary.html" style="min-height: 52px; display: flex; align-items: center; padding: 0 14px; border-radius: 12px; text-decoration: none; color: #1F2A24; font-size: 16px; border-bottom: 1px solid #EFEAE0">寶寶日記</a>
<a href="benefits.html" style="min-height: 52px; display: flex; align-items: center; padding: 0 14px; border-radius: 12px; text-decoration: none; color: #1F2A24; font-size: 16px; border-bottom: 1px solid #EFEAE0">補助及其他福利</a>
<a href="childcare.html" style="min-height: 52px; display: flex; align-items: center; padding: 0 14px; border-radius: 12px; text-decoration: none; color: #1F2A24; font-size: 16px; border-bottom: 1px solid #EFEAE0">托育</a>
<a href="activities.html" style="min-height: 52px; display: flex; align-items: center; padding: 0 14px; border-radius: 12px; text-decoration: none; color: #1F2A24; font-size: 16px; border-bottom: 1px solid #EFEAE0">親子活動</a>
<a href="#" aria-current="page" style="min-height: 52px; display: flex; align-items: center; justify-content: space-between; padding: 0 14px; border-radius: 12px; text-decoration: none; background: #E4EEE7; color: #2E5E4E; font-weight: 600; font-size: 16px">AI 問答<span style="font-size: 12px; font-weight: 400">目前位置</span></a>
<a href="help.html" style="min-height: 52px; display: flex; align-items: center; padding: 0 14px; border-radius: 12px; text-decoration: none; color: #1F2A24; font-size: 16px; border-bottom: 1px solid #EFEAE0">協助</a>
</nav>
</sc-if>
</header>

<main class="zb-ask" style="max-width: 1080px; margin: 0 auto; padding: 24px 24px 48px; box-sizing: border-box; display: flex; flex-direction: column; gap: 20px">
<div style="display: flex; flex-direction: column; gap: 6px">
<h1 style="margin: 0; font-size: 26px; font-weight: 600">問竹寶</h1>
<p style="margin: 0; font-size: 14px; line-height: 1.6; color: #5F6B64">依寶寶的資料，用白話回答補助、托育、健康的問題。每個回答都附官方來源。</p>
</div>

<div class="zb-ask-grid">

<aside class="zb-ask-side">
<section aria-labelledby="h-hist" class="zb-hist" data-open="{{histExpanded}}">
<div class="zb-hist-head">
<button type="button" class="zb-hist-toggle" aria-expanded="{{histExpanded}}" aria-controls="zb-hist-list" onClick="{{toggleHist}}">
<span id="h-hist" style="font-size: 16px; font-weight: 600">歷史問答</span>
<span style="font-size: 13px; color: #5F6B64">{{histCount}} / 5</span>
<svg class="zb-chev" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#5F6B64" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"></path></svg>
</button>
<sc-if value="{{hasHist}}" hint-placeholder-val="{{true}}">
<button type="button" class="zb-hist-clear" onClick="{{clearHist}}">清除</button>
</sc-if>
</div>
<div id="zb-hist-list" class="zb-hist-list">
<sc-if value="{{noHist}}" hint-placeholder-val="{{false}}">
<p style="margin: 0; padding: 4px 6px 8px; font-size: 13px; line-height: 1.7; color: #5F6B64">問過的問題會留在這裡，最多 5 筆。在任何一頁右下角的竹寶問的也會記下來。</p>
</sc-if>
<sc-for list="{{hist}}" as="hi" hint-placeholder-count="3">
<button type="button" class="zb-hist-item" data-k="{{hi.id}}" aria-current="{{hi.current}}" onClick="{{hi.pick}}"><span class="zb-hist-q">{{hi.q}}</span><span class="zb-hist-t">{{hi.when}}</span></button>
</sc-for>
</div>
</section>

<section aria-labelledby="h-me" class="zb-acc" data-open="{{meExpanded}}">
<button type="button" class="zb-acc-head" aria-expanded="{{meExpanded}}" onClick="{{toggleMe}}">
<span class="zb-acc-title">
<span id="h-me" style="font-size: 16px; font-weight: 600">竹寶知道的你</span>
<span style="font-size: 13px; color: #5F6B64">2 個月 4 天・北區・第 1 胎・自己或家人照顧</span>
</span>
<svg class="zb-chev" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#5F6B64" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"></path></svg>
</button>
<sc-if value="{{meOpen}}" hint-placeholder-val="{{false}}">
<div class="zb-acc-body">
<dl style="margin: 0; display: grid; grid-template-columns: 64px minmax(0, 1fr); row-gap: 6px; font-size: 15px">
<dt style="color: #5F6B64">寶寶</dt><dd style="margin: 0">2 個月 4 天</dd>
<dt style="color: #5F6B64">戶籍</dt><dd style="margin: 0">新竹市北區</dd>
<dt style="color: #5F6B64">胎次</dt><dd style="margin: 0">第 1 胎</dd>
<dt style="color: #5F6B64">照顧</dt><dd style="margin: 0">自己或家人</dd>
</dl>
<a href="setup.html" style="font-size: 14px">修改寶寶資料</a>
</div>
</sc-if>
</section>
</aside>

<section aria-label="對話" style="min-width: 0; display: flex; flex-direction: column; gap: 14px">

<style>
@keyframes zbDot { 0%, 80%, 100% { opacity: 0.25 } 40% { opacity: 1 } }
.zb-dot { display: inline-block; width: 8px; height: 8px; border-radius: 999px; background: #2E5E4E; animation: zbDot 1.2s infinite ease-in-out; }
.zb-dot:nth-child(2) { animation-delay: 0.2s } .zb-dot:nth-child(3) { animation-delay: 0.4s }
@media (prefers-reduced-motion: reduce) { .zb-dot { animation: none; opacity: 0.6 } }
</style>
<sc-if value="{{isWelcome}}" hint-placeholder-val="{{false}}">
<article aria-label="竹寶" style="background: #FCFAF6; border: 1px solid #E4DED2; border-radius: 4px 16px 16px 16px; padding: 18px; display: flex; flex-direction: column; gap: 10px">
<div style="display: flex; align-items: center; gap: 8px">
<svg width="24" height="24" viewBox="0 0 28 28" aria-hidden="true"><circle cx="14" cy="14" r="13" fill="#2E5E4E"></circle><path d="M14 20V9M14 13c0-2.5 2-4 4.5-4M14 15.5c0-2.2-1.8-3.5-4-3.5" stroke="#F6F2EA" stroke-width="1.8" fill="none" stroke-linecap="round"></path></svg>
<span style="font-size: 13px; font-weight: 600; color: #2E5E4E">竹寶</span>
</div>
<p style="margin: 0; font-size: 16px; line-height: 1.7">嗨，我是竹寶。我知道寶寶 2 個月 4 天、住北區、由自己或家人照顧。補助、健康、托育的問題都可以打在下面問我，我會照你的情況回答，並附上官方來源。</p>
</article>
</sc-if>

<sc-if value="{{hasQ}}" hint-placeholder-val="{{true}}">
<div style="display: flex; justify-content: flex-end">
<div style="max-width: 80%; background: #2E5E4E; color: #FFFFFF; border-radius: 16px 16px 4px 16px; padding: 12px 16px; font-size: 15px; line-height: 1.6">{{q}}</div>
</div>
</sc-if>

<sc-if value="{{isThinking}}" hint-placeholder-val="{{false}}">
<article aria-label="竹寶正在查資料" role="status" style="background: #FCFAF6; border: 1px solid #E4DED2; border-radius: 4px 16px 16px 16px; padding: 18px; display: flex; flex-direction: column; gap: 12px">
<div style="display: flex; align-items: center; gap: 10px">
<svg width="24" height="24" viewBox="0 0 28 28" aria-hidden="true"><circle cx="14" cy="14" r="13" fill="#2E5E4E"></circle><path d="M14 20V9M14 13c0-2.5 2-4 4.5-4M14 15.5c0-2.2-1.8-3.5-4-3.5" stroke="#F6F2EA" stroke-width="1.8" fill="none" stroke-linecap="round"></path></svg>
<span style="font-size: 14px; font-weight: 600; color: #2E5E4E">竹寶正在查資料</span>
<span aria-hidden="true" style="display: inline-flex; gap: 4px"><span class="zb-dot"></span><span class="zb-dot"></span><span class="zb-dot"></span></span>
</div>
<ul style="margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 6px; font-size: 14px">
<sc-for list="{{steps}}" as="st" hint-placeholder-count="3">
<li style="{{st.style}}"><span style="width: 18px; text-align: center">{{st.mark}}</span>{{st.label}}</li>
</sc-for>
</ul>
</article>
</sc-if>

<sc-if value="{{isFallback}}" hint-placeholder-val="{{false}}">
<article aria-label="竹寶的回答" style="background: #FCFAF6; border: 1px solid #E4DED2; border-radius: 4px 16px 16px 16px; padding: 18px; display: flex; flex-direction: column; gap: 12px">
<div style="display: flex; align-items: center; gap: 8px">
<svg width="24" height="24" viewBox="0 0 28 28" aria-hidden="true"><circle cx="14" cy="14" r="13" fill="#2E5E4E"></circle><path d="M14 20V9M14 13c0-2.5 2-4 4.5-4M14 15.5c0-2.2-1.8-3.5-4-3.5" stroke="#F6F2EA" stroke-width="1.8" fill="none" stroke-linecap="round"></path></svg>
<span style="font-size: 13px; font-weight: 600; color: #2E5E4E">竹寶</span>
</div>
<p style="margin: 0; font-size: 16px; line-height: 1.7">這題竹寶還在學習中。這個 Demo 版先準備了下面幾題，點一下就能看竹寶怎麼回答：</p>
<div style="display: flex; flex-direction: column; gap: 8px">
<sc-for list="{{demoChips}}" as="d" hint-placeholder-count="3">
<button type="button" onClick="{{d.pick}}" style="min-height: 44px; padding: 8px 14px; border-radius: 12px; border: 1px solid #2E5E4E; background: #FFFFFF; color: #2E5E4E; font-family: inherit; font-size: 14px; font-weight: 600; text-align: left; cursor: pointer">{{d.q}}</button>
</sc-for>
</div>
</article>
</sc-if>

<sc-if value="{{isAnswer}}" hint-placeholder-val="{{true}}">
<article aria-label="竹寶的回答" style="background: #FCFAF6; border: 1px solid #E4DED2; border-radius: 4px 16px 16px 16px; padding: 18px; display: flex; flex-direction: column; gap: 14px">
<div style="display: flex; align-items: center; gap: 8px">
<svg width="24" height="24" viewBox="0 0 28 28" aria-hidden="true"><circle cx="14" cy="14" r="13" fill="#2E5E4E"></circle><path d="M14 20V9M14 13c0-2.5 2-4 4.5-4M14 15.5c0-2.2-1.8-3.5-4-3.5" stroke="#F6F2EA" stroke-width="1.8" fill="none" stroke-linecap="round"></path></svg>
<span style="font-size: 13px; font-weight: 600; color: #2E5E4E">竹寶</span>
</div>
<p style="margin: 0; font-size: 17px; font-weight: 600; line-height: 1.6">{{answer}}</p>
<div style="background: #E4EEE7; border-radius: 12px; padding: 12px 14px; display: flex; flex-direction: column; gap: 4px">
<span style="font-size: 12px; font-weight: 600; color: #2E5E4E">你的情況</span>
<span style="font-size: 14px; line-height: 1.7">{{mine}}</span>
</div>
<sc-if value="{{hasPrep}}" hint-placeholder-val="{{true}}">
<div style="display: flex; flex-direction: column; gap: 6px">
<span style="font-size: 13px; font-weight: 600; color: #5F6B64">{{prepTitle}}</span>
<ul style="margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 6px; font-size: 14px; line-height: 1.7">
<sc-for list="{{prep}}" as="p" hint-placeholder-count="3"><li>{{p}}</li></sc-for>
</ul>
</div>
</sc-if>
<div style="display: flex; gap: 8px; flex-wrap: wrap">
<sc-for list="{{next}}" as="n" hint-placeholder-count="2">
<a href="{{n.url}}" style="{{n.style}}">{{n.label}}</a>
</sc-for>
</div>
<div style="font-size: 12px; line-height: 1.7; color: #5F6B64; border-top: 1px solid #E4DED2; padding-top: 10px; display: flex; flex-wrap: wrap; gap: 4px 12px">
<span>來源：</span>
<sc-for list="{{srcs}}" as="sr" hint-placeholder-count="2"><a href="{{sr.url}}">{{sr.title}}</a></sc-for>
</div>
</article>
</sc-if>

<div class="zb-hints" role="group" aria-label="試試看這些問題，點一下會填進輸入框">
<span class="zb-hints-label">試試看</span>
<sc-for list="{{hints}}" as="hn" hint-placeholder-count="3">
<button type="button" class="zb-hint" onClick="{{hn.fill}}">{{hn.q}}</button>
</sc-for>
</div>
<form onSubmit="{{send}}" style="display: flex; gap: 8px; background: #FCFAF6; border: 1px solid #E4DED2; border-radius: 16px; padding: 8px">
<label for="ask" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">輸入問題</label>
<input id="ask" type="text" placeholder="輸入問題，例如：寶寶出生後，我可以領哪些補助？" autocomplete="off" style="flex: 1; min-width: 0; height: 48px; border: 0; background: transparent; padding: 0 10px; font-family: inherit; font-size: 16px; color: #1F2A24">
<button type="submit" style="min-height: 48px; padding: 0 18px; border-radius: 12px; border: 0; background: #2E5E4E; color: #FFFFFF; font-family: inherit; font-size: 15px; font-weight: 600; cursor: pointer">送出</button>
</form>
<p style="margin: 0; font-size: 12px; line-height: 1.6; color: #5F6B64">竹寶的 AI 只負責白話說明，資格以主管機關審核為準。寶寶有緊急狀況請直接撥 119，或看<a href="help.html">協助</a>頁的專線。</p>
</section>

</div>
</main>
</div>
</template>
<div id="dc-root"></div>
<script src="zhubao-ai.js"></script>
<script src="zhubao-runtime.js"></script>
<script>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    const AI = window.ZBAI;
    let k = null;
    try { k = new URLSearchParams(location.search).get('k'); } catch (e) { k = null; }
    const hist = AI.history();
    if (k && AI.ALL[k]) {
      const h0 = hist.find((x) => x.k === k);
      this.state = { menuOpen: false, qa: k, q: AI.ALL[k].q, phase: 'answer', step: 0, hist, cur: h0 ? h0.t : null };
    } else {
      this.state = { menuOpen: false, qa: null, q: '', phase: 'welcome', step: 0, hist, cur: null };
    }
  }
  renderVals() {
    const s = this.state;
    const AI = window.ZBAI;
    const ALL = AI.ALL, DEMO = AI.DEMO;
    const cur = ALL[s.qa] || DEMO.money;
    const ask = (k, text) => {
      (this._tm || []).forEach(clearTimeout);
      const hist = AI.remember(k, text);
      this.setState({ q: text, qa: k, phase: 'thinking', step: 0, hist, cur: hist[0].t });
      const end = k ? 'answer' : 'fallback';
      this._tm = [setTimeout(() => this.setState({ step: 1 }), 600), setTimeout(() => this.setState({ step: 2 }), 1200), setTimeout(() => this.setState({ phase: end }), 1900)];
    };
    const pick = (k) => () => ask(k, ALL[k].q);
    const showPast = (h) => () => {
      (this._tm || []).forEach(clearTimeout);
      this.setState({ q: h.q, qa: h.k, phase: h.k && ALL[h.k] ? 'answer' : 'fallback', cur: h.t, histOpen: false });
    };
    const fill = (q) => () => {
      const inp = document.getElementById('ask');
      if (!inp) return;
      inp.value = q;
      inp.focus();
      const f = inp.closest('form');
      if (f) { f.classList.remove('zb-filled'); void f.offsetWidth; f.classList.add('zb-filled'); }
    };
    const next = cur.next.map((n, i) => ({
      label: n[0], url: n[1],
      style: 'min-height: 44px; display: inline-flex; align-items: center; padding: 0 16px; border-radius: 12px; font-size: 14px; font-weight: 600; text-decoration: none; ' + (i === 0 ? 'background: #2E5E4E; color: #FFFFFF' : 'border: 1px solid #2E5E4E; color: #2E5E4E')
    }));
    const hist = s.hist || [];
    return {
      menuOpen: !!s.menuOpen, menuExpanded: s.menuOpen ? 'true' : 'false',
      menuLabel: s.menuOpen ? '關閉' : '選單', menuIcon: s.menuOpen ? 'M6 6l12 12M18 6 6 18' : 'M4 7h16M4 12h16M4 17h16',
      toggleMenu: () => this.setState({ menuOpen: !s.menuOpen }),
      meOpen: !!s.meOpen, meExpanded: s.meOpen ? 'true' : 'false', toggleMe: () => this.setState({ meOpen: !s.meOpen }),
      histExpanded: s.histOpen ? 'true' : 'false', toggleHist: () => this.setState({ histOpen: !s.histOpen }),
      hist: hist.map((h) => ({ id: 'h' + h.t, q: h.q, when: AI.when(h.t), current: h.t === s.cur && s.phase !== 'welcome' ? 'true' : 'false', pick: showPast(h) })),
      histCount: hist.length, hasHist: hist.length > 0, noHist: hist.length === 0,
      clearHist: () => this.setState({ hist: AI.clearHistory(), cur: null }),
      hints: Object.keys(DEMO).map((k) => ({ q: DEMO[k].q, fill: fill(DEMO[k].q) })),
      answer: cur.answer, mine: cur.mine, hasPrep: cur.prep.length > 0, prepTitle: cur.prepTitle, prep: cur.prep,
      next, srcs: cur.srcs.map((x) => ({ title: x[0], url: x[1] })),
      isWelcome: s.phase === 'welcome', hasQ: s.phase !== 'welcome', isThinking: s.phase === 'thinking',
      isAnswer: s.phase === 'answer', isFallback: s.phase === 'fallback',
      q: s.q,
      steps: ['讀取寶寶的資料', '比對中央與新竹市的規定', '整理官方來源'].map((l, i) => ({ label: l, mark: i < s.step ? '✓' : (i === s.step ? '…' : '・'),
        style: 'display: flex; align-items: center; gap: 8px; color: ' + (i <= s.step ? '#1F2A24' : '#9AA39D') + (i < s.step ? '; font-weight: 400' : '') })),
      demoChips: Object.keys(DEMO).map((k) => ({ q: DEMO[k].q, pick: pick(k) })),
      send: (e) => { if (e && e.preventDefault) e.preventDefault(); const f = e.target; const inp = f.querySelector('input'); const text = (inp && inp.value || '').trim(); if (!text) return; inp.value = ''; ask(AI.match(text), text); }
    };
  }
}

window.Component = Component;
</script>
</body>
</html>
